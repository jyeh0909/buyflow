<script>
// ====== Firebase 設定（沿用你已建立好的專案） ======
const firebaseConfig = {
  apiKey: "AIzaSyCJxAWxAhOtkewFF0FEqu4UduELWDdAv2k",
  authDomain: "jenna---usa-buy.firebaseapp.com",
  projectId: "jenna---usa-buy",
  storageBucket: "jenna---usa-buy.firebasestorage.app",
  messagingSenderId: "786455761363",
  appId: "1:786455761363:web:e9390a916083d2d0d55f26"
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let connectionError = '';
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;
const FS_KEY = firebaseConfig.apiKey;
const dbReady = !CONFIG_IS_PLACEHOLDER;
const AUTH_BASE = `https://identitytoolkit.googleapis.com/v1/accounts`;
let currentUser = null;
function authHeaders(){ return currentUser && currentUser.idToken ? { 'Authorization': 'Bearer ' + currentUser.idToken } : {}; }
function getStoredUser(){ try { return JSON.parse(localStorage.getItem('buyflowUser') || 'null'); } catch(e){ return null; } }
function setStoredUser(u){ if(u) localStorage.setItem('buyflowUser', JSON.stringify(u)); else localStorage.removeItem('buyflowUser'); }
function showLoginError(msg){ const el=document.getElementById('loginError'); if(el){ el.style.display='block'; el.textContent=msg; } }
async function loginWithEmail(){
  const email=(document.getElementById('loginEmail')||{}).value || '';
  const password=(document.getElementById('loginPassword')||{}).value || '';
  if(!email || !password){ showLoginError('請輸入 Email 和 Password'); return; }
  try{
    const res = await fetch(`${AUTH_BASE}:signInWithPassword?key=${FS_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, returnSecureToken:true })
    });
    if(!res.ok){ throw new Error('登入失敗，請確認 Email / Password 是否正確'); }
    const data = await res.json();
    currentUser = { email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn||'3600')*1000) };
    setStoredUser(currentUser);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }catch(e){ showLoginError(e.message || '登入失敗'); }
}
function logout(){
  setStoredUser(null); currentUser=null; loaded=false; orders=[];
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('appRoot').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  const err=document.getElementById('loginError'); if(err) err.style.display='none';
}
function initAuth(){
  const u = getStoredUser();
  if(u && u.idToken && (!u.expiresAt || u.expiresAt > Date.now()+60000)){
    currentUser = u;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }else{
    setStoredUser(null);
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appRoot').style.display='none';
  }
}

async function fsGetDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('資料庫讀取失敗（HTTP ' + res.status + '）');
  const data = await res.json();
  return data.fields || null;
}
async function fsSetDoc(collection, docId, fieldName, stringValue){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields: { [fieldName]: { stringValue } } })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}
async function fsSetFieldsDoc(collection, docId, values){
  const fields = {};
  Object.keys(values || {}).forEach(key => {
    fields[key] = { stringValue: String(values[key] == null ? '' : values[key]) };
  });
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}

async function fsDeleteDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { method: 'DELETE', headers: authHeaders() });
  return res.ok;
}

function splitReturnItemsIntoSeparateOrders(preferredDetailId){
  // 只要客人訂單中的某個商品被標記為退貨，就把該商品拆成獨立退貨訂單。
  // 這樣原本客人的訂單只保留正常商品；退貨商品會走自己的退貨流程。
  let changed = false;
  const newReturnOrders = [];

  orders.forEach(order => {
    if(order.orderType !== 'customer' || !Array.isArray(order.items)) return;
    const keepItems = [];
    order.items.forEach(item => {
      if(item && item.isReturn){
        changed = true;
        const returnItem = Object.assign({}, item, {
          isReturn: true,
          returnSourceOrderId: item.returnSourceOrderId || order.id,
          returnSourceCustomerName: item.returnSourceCustomerName || order.customerName || '',
          flow: '',
          priceTWD: '',
          priceUSD: '',
          twReceivedDate: '',
          customerShippedDate: '',
          directRecipient: '',
          directAddress: '',
          directGroup: ''
        });
        newReturnOrders.push({
          id: uidOrder(),
          orderType: 'return',
          createdAt: todayStr(),
          sourceOrderId: order.id,
          sourceCustomerName: order.customerName || '',
          customerName: '', phone: '', lineId: '', twRecipient: '', twPhone: '', twAddress: '',
          paymentsReceived: 0,
          items: [returnItem]
        });
      }else{
        keepItems.push(item);
      }
    });
    order.items = keepItems;
  });

  if(changed){
    // 移除已經沒有任何商品的原訂單，避免留下空訂單。
    orders = orders.filter(o => o.orderType !== 'customer' || (Array.isArray(o.items) && o.items.length > 0));
    orders.unshift(...newReturnOrders);
    if(preferredDetailId && !findOrder(preferredDetailId) && newReturnOrders.length){
      detailSelectedId = newReturnOrders[0].id;
    }
  }
  return changed;
}

async function convertItemToReturn(itemId){
  const found = findItem(itemId);
  if(!found){ alert('找不到這個商品'); return; }
  const item = found.item;
  const sourceOrder = found.order;
  if(item.isReturn || sourceOrder.orderType === 'return'){
    alert('這個商品已經在退貨流程中');
    return;
  }
  const shippedQty = usShippedQty(item);
  if(shippedQty > 0){
    alert('這個商品已有 ' + shippedQty + ' 件從美國出貨，不能直接轉為退貨。請先確認實際貨況後再處理。');
    return;
  }
  const totalQty = itemTotalQty(item);
  const qtyText = prompt(`這個商品共有 ${totalQty} 件，請輸入要退貨的數量`, String(totalQty));
  if(qtyText === null) return;
  const returnQty = parseInt(qtyText, 10);
  if(!Number.isFinite(returnQty) || returnQty < 1 || returnQty > totalQty){
    alert(`退貨數量必須介於 1 到 ${totalQty} 件`);
    return;
  }
  const receivedQty = usReceivedQty(item);
  const stageText = receivedQty > 0
    ? `Jen 已收到 ${receivedQty}/${totalQty} 件。退貨商品會依實際已收到數量進入退貨頁。`
    : `商品已購買但尚未收到；退貨部分仍會先留在「美國收貨」，收到後才進入「退貨」頁。`;
  if(!confirm(`確定要把「${itemDisplayName(item)}」中的 ${returnQty} 件轉為退貨嗎？\n\n${stageText}\n原本的購買與美國收貨紀錄都會保留。`)) return;

  const sourceOrderId = sourceOrder.id;
  const sourceCustomerName = sourceOrder.customerName || '';
  const userEmail = currentUser && currentUser.email ? currentUser.email : '未知使用者';

  let returnItem;
  if(returnQty === totalQty){
    returnItem = item;
    returnItem.isReturn = true;
  }else{
    returnItem = JSON.parse(JSON.stringify(item));
    returnItem.id = uidItem();
    returnItem.qty = String(returnQty);
    returnItem.isReturn = true;
    returnItem.returnQty = returnQty;

    // 原訂單保留未退貨數量。
    item.qty = String(totalQty - returnQty);
    item.returnQty = 0;

    // 依照已收到數量，把相對應數量分配到退貨商品；其餘保留在原商品。
    const returnReceivedQty = Math.min(returnQty, receivedQty);
    const remainReceivedQty = Math.max(0, receivedQty - returnReceivedQty);
    const split = splitStageHistoryForQty(item.usReceipts || [], returnReceivedQty);
    returnItem.usReceipts = split.taken;
    item.usReceipts = split.remaining;
    returnItem.usReceivedQty = returnReceivedQty;
    item.usReceivedQty = remainReceivedQty;
    returnItem.usReceivedDate = returnItem.usReceipts.length ? returnItem.usReceipts[returnItem.usReceipts.length-1].date : (returnReceivedQty ? item.usReceivedDate : '');
    item.usReceivedDate = item.usReceipts.length ? item.usReceipts[item.usReceipts.length-1].date : (remainReceivedQty ? item.usReceivedDate : '');

    // 退貨商品尚未出貨回台灣；原商品的未來流程保持不變。
    returnItem.usShippedQty = 0;
    returnItem.usShippedDate = '';
    returnItem.usShipments = [];
    returnItem.twReceivedQty = 0;
    returnItem.twReceivedDate = '';
    returnItem.twReceipts = [];
    returnItem.customerShippedQty = 0;
    returnItem.customerShippedDate = '';
    returnItem.customerShipments = [];

    sourceOrder.items.push(returnItem);
  }

  returnItem.convertedToReturnAt = localDateTimeStr();
  returnItem.convertedToReturnBy = userEmail;
  returnItem.returnSourceOrderId = sourceOrderId;
  returnItem.returnSourceCustomerName = sourceCustomerName;
  returnItem.returnQty = returnQty;
  returnItem.flow = '';
  returnItem.priceTWD = '';
  returnItem.priceUSD = '';
  returnItem.twReceivedDate = '';
  returnItem.customerShippedDate = '';
  returnItem.twReceipts = [];
  returnItem.customerShipments = [];
  returnItem.directRecipient = '';
  returnItem.directAddress = '';
  returnItem.directGroup = '';

  splitReturnItemsIntoSeparateOrders(sourceOrderId);
  const returnOrder = orders.find(o => o.orderType === 'return' && (o.items||[]).some(i => i.id === returnItem.id));
  if(returnOrder) detailSelectedId = returnOrder.id;
  logActivity('商品轉為退貨', `${itemDisplayName(returnItem)}（${returnItem.id}）退貨 ${returnQty} 件，從訂單 ${sourceOrderId}${sourceCustomerName ? '／客人 '+sourceCustomerName : ''} 拆出並進入退貨流程`);
  await saveOrders();
  detailEditing = false;
  show('detail');
  alert(`已將 ${returnQty} 件轉為退貨。原本的購買日期與美國收貨紀錄已保留。`);
}

function splitStageHistoryForQty(history, takeQty){
  const source = Array.isArray(history) ? history.map(x=>({date:String(x.date||''), qty:Number(x.qty)||0, user:String(x.user||'')})).filter(x=>x.qty>0) : [];
  const taken = [];
  const remaining = [];
  let need = Math.max(0, Number(takeQty)||0);
  for(const row of source){
    if(need <= 0){ remaining.push({...row}); continue; }
    const use = Math.min(row.qty, need);
    if(use > 0) taken.push({date:row.date, qty:use, user:row.user||''});
    if(row.qty > use) remaining.push({date:row.date, qty:row.qty-use, user:row.user||''});
    need -= use;
  }
  return {taken, remaining};
}

function itemTotalQty(item){
  const n = parseInt(item && item.qty, 10);
  return Number.isFinite(n) && n > 0 ? n : 1;
}
function itemStageQty(item, key, legacyDateKey){
  const explicit = Number(item && item[key]);
  if(Number.isFinite(explicit) && explicit >= 0) return Math.min(explicit, itemTotalQty(item));
  return item && item[legacyDateKey] ? itemTotalQty(item) : 0;
}
function purchasedQty(item){ return item && item.purchasedDate ? itemTotalQty(item) : 0; }
function usReceivedQty(item){ return itemStageQty(item, 'usReceivedQty', 'usReceivedDate'); }
function usShippedQty(item){ return itemStageQty(item, 'usShippedQty', 'usShippedDate'); }
function twReceivedQty(item){ return itemStageQty(item, 'twReceivedQty', 'twReceivedDate'); }
function customerShippedQty(item){ return itemStageQty(item, 'customerShippedQty', 'customerShippedDate'); }

function stageHistory(item, arrayKey, legacyDateKey, qtyGetter){
  if(!Array.isArray(item[arrayKey])) item[arrayKey]=[];
  item[arrayKey] = item[arrayKey]
    .filter(x=>x && Number(x.qty)>0)
    .map(x=>({date:String(x.date||''), qty:Number(x.qty)||0, user:String(x.user||'')}));
  const totalQty = qtyGetter(item);
  const recordedQty = item[arrayKey].reduce((sum,x)=>sum + (Number(x.qty)||0), 0);
  // 舊資料沒有逐批紀錄時只能用舊的總日期補一筆；之後可直接按「修改」校正日期。
  if(totalQty > recordedQty){
    item[arrayKey].push({date:item[legacyDateKey]||'', qty:totalQty-recordedQty, user:''});
  }
  return item[arrayKey];
}
function appendStageEvent(item, arrayKey, legacyDateKey, qtyGetter, date, qty){
  if(!Array.isArray(item[arrayKey])) item[arrayKey]=[];
  if(item[arrayKey].length===0){
    const previousQty=qtyGetter(item);
    const previousDate=item[legacyDateKey]||'';
    if(previousQty>0) item[arrayKey].push({date:previousDate,qty:previousQty,user:''});
  }
  // 每次操作都以當下輸入的日期新增獨立紀錄，不覆蓋前一筆。
  item[arrayKey].push({date:String(date||todayStr()),qty:Number(qty)||0,user:(currentUser&&currentUser.email)||'unknown'});
}

function usShipmentHistory(item){ return stageHistory(item,'usShipments','usShippedDate',usShippedQty); }
function twReceiptHistory(item){ return stageHistory(item,'twReceipts','twReceivedDate',twReceivedQty); }

async function editStageHistory(itemId,arrayKey,index,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const found=findItem(itemId); if(!found) return;
  const map={
    usReceipts:{dateKey:'usReceivedDate',qtyKey:'usReceivedQty'},
    usShipments:{dateKey:'usShippedDate',qtyKey:'usShippedQty'},
    twReceipts:{dateKey:'twReceivedDate',qtyKey:'twReceivedQty'},
    customerShipments:{dateKey:'customerShippedDate',qtyKey:'customerShippedQty'}
  };
  const cfg=map[arrayKey]; if(!cfg) return;
  if(!Array.isArray(found.item[arrayKey]) || !found.item[arrayKey][index]) return;
  const row=found.item[arrayKey][index];
  const date=prompt('請輸入正確日期（YYYY-MM-DD）',row.date||todayStr());
  if(date===null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('日期格式請使用 YYYY-MM-DD');return;}
  const qtyText=prompt('請輸入這一次的件數',String(row.qty||1));
  if(qtyText===null) return;
  const qty=parseInt(qtyText,10);
  if(!Number.isFinite(qty)||qty<1){alert('件數必須大於 0');return;}
  const otherTotal=found.item[arrayKey].reduce((sum,x,j)=>sum+(j===index?0:(Number(x.qty)||0)),0);
  if(otherTotal+qty>itemTotalQty(found.item)){alert('歷史紀錄總件數不能超過商品總數量');return;}
  found.item[arrayKey][index]={date,qty,user:row.user||((currentUser&&currentUser.email)||'unknown')};
  const total=found.item[arrayKey].reduce((sum,x)=>sum+(Number(x.qty)||0),0);
  found.item[cfg.qtyKey]=total;
  const latest=found.item[arrayKey].filter(x=>x.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
  found.item[cfg.dateKey]=latest?latest.date:'';
  logActivity(`修改${arrayKey}歷史：第 ${index+1} 次 ${date} ${qty} 件`,found.order.id);
  await saveOrders();
  renderSection(currentSection); hydrateImages();
}


async function deleteStageHistory(itemId,arrayKey,index,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const found=findItem(itemId); if(!found) return;
  const map={
    usReceipts:{dateKey:'usReceivedDate',qtyKey:'usReceivedQty',label:'美國收貨',downstream:()=>usShippedQty(found.item)},
    usShipments:{dateKey:'usShippedDate',qtyKey:'usShippedQty',label:'美國出貨',downstream:()=>twReceivedQty(found.item)},
    twReceipts:{dateKey:'twReceivedDate',qtyKey:'twReceivedQty',label:'台灣收貨',downstream:()=>customerShippedQty(found.item)},
    customerShipments:{dateKey:'customerShippedDate',qtyKey:'customerShippedQty',label:'寄給客人',downstream:()=>0}
  };
  const cfg=map[arrayKey]; if(!cfg) return;
  if(!Array.isArray(found.item[arrayKey]) || !found.item[arrayKey][index]) return;
  const row=found.item[arrayKey][index];
  const newTotal=found.item[arrayKey].reduce((sum,x,j)=>sum+(j===index?0:(Number(x.qty)||0)),0);
  const downstream=Number(cfg.downstream())||0;
  if(newTotal < downstream){
    alert(`不能撤銷這筆${cfg.label}紀錄，因為後續流程已有 ${downstream} 件。請先撤銷後續的物流紀錄。`);
    return;
  }
  if(!confirm(`確定要撤銷這筆${cfg.label}紀錄嗎？\n日期：${row.date||'未填'}\n數量：${row.qty||0} 件`)) return;
  found.item[arrayKey].splice(index,1);
  const total=found.item[arrayKey].reduce((sum,x)=>sum+(Number(x.qty)||0),0);
  found.item[cfg.qtyKey]=total;
  const latest=found.item[arrayKey].filter(x=>x.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
  found.item[cfg.dateKey]=latest?latest.date:'';
  logActivity(`撤銷${cfg.label}紀錄：${row.date||'未填日期'} ${row.qty||0} 件`,found.order.id,found.item.id);
  await saveOrders();
  renderSection(currentSection); hydrateImages();
}

async function clearSimpleDate(itemId,key,label,event){

  const downstreamMap={
    purchasedDate:()=>usReceivedQty(found.item),
    returnDate:()=>0

let pollTimer = null;
async function pollOrders(){
  if(!dbReady) return;
  try{
    const fields = await fsGetDoc('app-data', 'main');
    const json = (fields && fields.ordersJson && fields.ordersJson.stringValue) || '[]';
    const deletedJson = (fields && fields.deletedOrdersJson && fields.deletedOrdersJson.stringValue) || '[]';
    const logJson = (fields && fields.activityLogJson && fields.activityLogJson.stringValue) || '[]';
    const combinedJson = json + '|' + deletedJson + '|' + logJson;
    if(combinedJson !== lastOrdersJson){
      lastOrdersJson = combinedJson;
      orders = JSON.parse(json || '[]');
      deletedOrders = JSON.parse(deletedJson || '[]');
      activityLog = JSON.parse(logJson || '[]');
      renderAll();
    }
    if(connectionError){ connectionError = ''; renderAll(); }
  }catch(e){
    console.error('讀取資料失敗', e);
    connectionError = e && e.message ? e.message : '無法連線到資料庫';
    renderAll();
  }
}
function startListening(){
  if(!dbReady){ loaded = true; renderAll(); return; }
  pollOrders().finally(()=>{ loaded = true; renderAll(); });
  pollTimer = setInterval(pollOrders, 4000);
}
async function saveOrders(addGenericLog=true){
  if(addGenericLog) logActivity('更新資料', currentSection || '');
  if(!dbReady) return;
  try{
    const json = JSON.stringify(orders);
    const deletedJson = JSON.stringify(deletedOrders);
    const logJson = JSON.stringify(activityLog);
    // 一次寫入三個欄位，避免 Firestore PATCH 互相覆蓋，造成新訂單消失。
    await fsSetFieldsDoc('app-data', 'main', {
      ordersJson: json,
      deletedOrdersJson: deletedJson,
      activityLogJson: logJson
    });
    lastOrdersJson = json + '|' + deletedJson + '|' + logJson;
    connectionError = '';
  }catch(e){
    console.error('儲存發生錯誤', e);
    connectionError = e && e.message ? e.message : String(e);
    renderAll();
  }
}

// ====== 圖片 ======
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('無法解析這張圖片的格式'));
    img.src = src;
  });
}
function drawToDataURL(srcW, srcH, drawFn){
  const maxDim = 900;
  let w = srcW, h = srcH;
  if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, w, h);
  return canvas.toDataURL('image/jpeg', 0.7);
}
async function compressImage(file){
  try{
    const bitmap = await createImageBitmap(file);
    const dataUrl = drawToDataURL(bitmap.width, bitmap.height, (ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h));
    bitmap.close && bitmap.close();
    return dataUrl;
  }catch(e1){
    try{
      const rawDataUrl = await readFileAsDataURL(file);
      const img = await loadImageEl(rawDataUrl);
      return drawToDataURL(img.naturalWidth, img.naturalHeight, (ctx,w,h)=>ctx.drawImage(img,0,0,w,h));
    }catch(e2){
      const rawDataUrl = await readFileAsDataURL(file).catch(()=>null);
      if(rawDataUrl && rawDataUrl.length < 4000000) return rawDataUrl;
      throw new Error('這張圖片的格式或大小無法處理，建議改用 JPG / PNG 格式，或先縮小照片再上傳');
    }
  }
}
async function uploadImageForItem(itemId, file){
  if(!dbReady) return;
  try{
    const dataUrl = await compressImage(file);
    await fsSetDoc('item-images', itemId, 'dataUrl', dataUrl);
    imageCache[itemId] = dataUrl;
  }catch(e){
    console.error('圖片上傳失敗', e);
    alert('商品「'+itemId+'」的圖片上傳失敗：' + (e && e.message ? e.message : '未知錯誤'));
  }
}

function bindSearch(inputId, onChange, rerenderFn){

  if(!el) return;
  el.addEventListener('compositionstart', ()=>{ isComposingSearch = true; });
  el.addEventListener('compositionend', (e)=>{ isComposingSearch = false; onChange(e.target.value); rerenderFn(); });
  el.addEventListener('input', (e)=>{

  });

function itemStatusInfo(item, order){
  const total=itemTotalQty(item), r=usReceivedQty(item), us=usShippedQty(item), tw=twReceivedQty(item), cs=customerShippedQty(item);
  if(!item.purchasedDate) return { text:`等待 Jenna 訂購（共 ${total} 件）`, cls:'s-wait', detail:`這個商品共 ${total} 件，還沒有標記購買日期。`, current:'Jenna 待採購' };
  if(item.isReturn){
    if(r===0) return { text:`已下單 ${total} 件，等待 Jen 收到`, cls:'s-buy', detail:'這是退貨商品；Jen 收到至少一件後才會出現在退貨頁。', current:'Jen 美國收貨' };
    if(!item.returnDate) return { text:`Jen 已收到 ${r}/${total} 件，等待退貨`, cls:'s-return', detail:`目前已收到 ${r} 件；尚有 ${total-r} 件未收到。`, current:'退貨處理' };
    return { text:'已退貨完成', cls:'s-done', detail:'這個商品已完成退貨流程。', current:'完成' };
  }
  if(r < total) return { text:`已下單，Jen 已收到 ${r}/${total} 件`, cls:'s-buy', detail:`共訂購 ${total} 件，目前 Jen 收到 ${r} 件，仍有 ${total-r} 件等待到貨。已收到的部分可以進入美國出貨。`, current:'Jen 美國收貨 / 美國出貨' };
  if(us < total){
    const msg=item.flow==='直郵'?'等待直郵出貨':item.flow==='婷婷'?'等待美國出貨': '等待美國出貨回台灣';
    return { text:`Jen 已收齊，已出貨 ${us}/${total} 件`, cls:'s-usa', detail:`已收到全部 ${total} 件；目前從美國寄出 ${us} 件，尚有 ${total-us} 件等待出貨。`, current:msg };
  }
  if(endsAfterUSShip(item, order)) return { text:`美國已出貨 ${us}/${total} 件，流程完成`, cls:'s-done', detail:'直郵 / 婷婷商品完成美國端流程。', current:'完成' };
  if(tw < total) return { text:`美國已出貨，台灣收到 ${tw}/${total} 件`, cls:'s-ship', detail:`共 ${total} 件，台灣目前收到 ${tw} 件，尚有 ${total-tw} 件等待收貨。`, current:'台灣收貨' };

}
function itemStatusSteps(item, order){
  const total=itemTotalQty(item);
  const base = [
    {label:`Jenna 購買（${total} 件）`, date:item.purchasedDate, done:!!item.purchasedDate},
    {label:`Jen 美國收貨（${usReceivedQty(item)}/${total} 件）`, date:item.usReceivedDate, done:usReceivedQty(item)>=total}
  ];
  if(item.isReturn){
    base.push({label:'退貨日期', date:item.returnDate, done:!!item.returnDate});
    return base;
  }
  base.push({label:`${item.flow==='直郵'?'直郵 / 美國出貨':'美國出貨'}（${usShippedQty(item)}/${total} 件）`, date:item.usShippedDate, done:usShippedQty(item)>=total});
  if(needsTwFlow(item, order)){
    base.push({label:`台灣收貨（${twReceivedQty(item)}/${total} 件）`, date:item.twReceivedDate, done:twReceivedQty(item)>=total});
    base.push({label:`台灣出貨給客人（${customerShippedQty(item)}/${total} 件）`, date:item.customerShippedDate, done:customerShippedQty(item)>=total});
  }
  return base;
}

async function openImageModalById(itemId, event){
  if(event){ event.stopPropagation(); event.preventDefault(); }
  const found = findItem(itemId);
  const title = found ? `${itemDisplayName(found.item)}${found.item.brand && found.item.itemName ? '｜' + found.item.brand : ''}` : '商品圖片';
  if(imageCache[itemId]){ openImageModal(imageCache[itemId], title); return; }
  if(!dbReady) return;
  try{
    const fields = await fsGetDoc('item-images', itemId);
    if(fields && fields.dataUrl && fields.dataUrl.stringValue){
      imageCache[itemId] = fields.dataUrl.stringValue;
      openImageModal(imageCache[itemId], title);
    }
  }catch(e){ console.error('讀取圖片失敗', e); }
}
function closeImageModal(event){
  if(event){ event.stopPropagation(); }
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('imageModalImg');
  if(modal) modal.classList.remove('open');
  if(img) img.src = '';

}

async function saveNewOrder(){
  const returnMode = isReturnOnlyMode();
  const orderType = returnMode ? 'return' : 'customer';
  let customerName='', phone='', lineId='', twRecipient='', twPhone='', twAddress='';
  if(!returnMode){
    customerName = (document.getElementById('noCustomerName')||{}).value || '';
    if(!customerName.trim()){ alert('請填寫客人姓名'); return; }
    phone = (document.getElementById('noPhone')||{}).value || '';
    lineId = (document.getElementById('noLineId')||{}).value || '';
    twRecipient = (document.getElementById('noTwRecipient')||{}).value || '';
    twPhone = (document.getElementById('noTwPhone')||{}).value || '';
    twAddress = (document.getElementById('noTwAddress')||{}).value || '';
  }

  const cards = document.querySelectorAll('#itemsWrap .itemcard');
  const items = [];
  const uploadJobs = [];
  cards.forEach(card=>{
    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
    const itemName = get('itemName').trim();
    const itemId = card.dataset.itemid;
    if(!itemHasEnoughInfo(card, itemId)) return;
    let brand = get('brand'); if(brand==='__other__') brand = get('brandOther');
    let site = get('site'); if(site==='__other__') site = get('siteOther');
    const flow = returnMode ? '' : get('flow');
    const item = {
      id: itemId, itemName, brand, site, itemUrl: get('itemUrl'), size: get('size'), color: get('color'),
      qty: get('qty') || '1', note: get('note'),
      flow, priceTWD: returnMode?'':get('priceTWD'), priceUSD: returnMode?'':get('priceUSD'),
      directRecipient: flow==='直郵'?get('directRecipient'):'', directAddress: flow==='直郵'?get('directAddress'):'', directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: returnMode, hasImage: false,
      purchasedDate:'', usReceivedDate:'', usShippedDate:'', twReceivedDate:'', customerShippedDate:'', returnDate:'', usReceipts:[], usShipments:[], twReceipts:[], customerShipments:[]
    };
    items.push(item);
    if(pendingImageFiles[itemId]) uploadJobs.push({itemId, file: pendingImageFiles[itemId]});
  });

  if(items.length===0){ alert('請至少加入一個商品：可以只上傳圖片，商品名稱可空白'); return; }

  const newOrder = {
    id: uidOrder(), orderType, createdAt: todayStr(),
    customerName, phone, lineId, twRecipient, twPhone, twAddress,
    paymentsReceived: 0, items
  };
  orders.unshift(newOrder);
  await saveOrders();

  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    const found = findItem(job.itemId);
    if(found) found.item.hasImage = true;
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();

  alert('訂單已建立！');
  show(returnMode ? 'returns' : 'customerOrders');
}

  if(jessicaState.flow!=='all')allCustomerPairs=allCustomerPairs.filter(p=>p.item.flow===jessicaState.flow);

    const activeRows=g.pairs.map(p=>{const item=p.item,total=itemTotalQty(item),ready=Math.max(0,twReceivedQty(item)-customerShippedQty(item)),waiting=Math.max(0,total-twReceivedQty(item)),remaining=Math.max(0,total-customerShippedQty(item));if(remaining<=0)return '';return `<div class="checkrow mobile-item-row">${thumbHTML(item)}<div class="mobile-item-info" style="flex:1"><b class="item-click" onclick="openItemStatusModal('${escAttr(item.id)}', event)">${esc(itemDisplayName(item))}</b>${itemNoteHTML(item)}<br><span class="muted">總數 ${total} 件｜台灣已收 ${twReceivedQty(item)}｜已寄客人 ${customerShippedQty(item)}｜仍未寄 ${remaining}｜仍等待到貨 ${waiting}</span>${shipmentHistoryHTML(item)}</div>${ready>0?`<div class="qty-action"><span class="status s-ready">可寄 ${ready} 件</span><input type="number" min="0" max="${ready}" value="${ready}" class="input jessica-qty" data-id="${item.id}" style="max-width:80px"></div>`:`<span class="status s-ship">無可寄數量</span>`}</div>`;}).join('');
    const shippedRows=g.pairs.filter(p=>customerShippedQty(p.item)>0).map(p=>{const item=p.item;return `<div class="checkrow mobile-item-row shipped-record-row">${thumbHTML(item)}<div class="mobile-item-info" style="flex:1"><b class="item-click" onclick="openItemStatusModal('${escAttr(item.id)}', event)">${esc(itemDisplayName(item))}</b>${itemNoteHTML(item)}<br><span class="status s-done">已出貨 ${customerShippedQty(item)}/${itemTotalQty(item)} 件</span>${shipmentHistoryHTML(item)}</div></div>`;}).join('');
    const custBox=(primaryOrder.twRecipient||primaryOrder.twPhone||primaryOrder.twAddress)?`<div class="customerbox"><b>台灣收件人：</b>${esc(primaryOrder.twRecipient)||'—'}　<b>電話：</b>${esc(primaryOrder.twPhone)||'—'}<br><b>地址：</b>${esc(primaryOrder.twAddress)||'—'}</div>`:'';const safeKey=btoa(unescape(encodeURIComponent(name))).replace(/=/g,'');return `<div class="shipmentgroup customer-shipment-card" data-customer="${escAttr(name)}"><div class="customer-shipment-head"><div><h3>${esc(name)}</h3><span class="status ${summaryClass}">${summaryText}</span>${shippedUnits>0?`<span class="status s-done" style="margin-left:6px">已出貨 ${shippedUnits} 件</span>`:''}</div></div>${custBox}<h4 class="shipment-section-title">待處理商品</h4>${activeRows||'<div class="empty-state">目前沒有待處理商品</div>'}${shippedRows?`<details class="shipped-history-box" open><summary>查看已出貨商品與日期（${shippedUnits} 件）</summary>${shippedRows}</details>`:''}<div class="shipping-choice"><div><b>本次出貨</b><div class="muted">每個商品可填本次要寄出的數量；已寄出的商品與日期會保留在上方紀錄。</div></div><div class="shipping-actions"><input type="date" class="input" id="jship_${safeKey}"><button class="btn green" data-action="jessica-ship-group" data-customer="${escAttr(name)}" data-key="${safeKey}" ${readyUnits===0?'disabled':''}>確認本次出貨</button></div></div></div>`;}).join('');
  document.getElementById('jessicaContent').innerHTML=`<div class="card"><h2>台灣出貨給客人：依客人與數量管理</h2><div class="note">部分出貨後，已寄出的商品仍會保留並顯示每次出貨日期與數量；尚未寄出的商品繼續留在待處理區。</div><div class="toolbar"><select id="jessicaFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(TW_FLOWS,jessicaState.flow==='all'?null:jessicaState.flow)}</select><input class="input" id="jessicaSearchInput" style="max-width:340px" placeholder="搜尋客人 / 商品 / 品牌" value="${escAttr(jessicaState.search)}"><select id="jessicaStatusSelect" style="max-width:240px"><option value="all" ${jessicaState.status==='all'?'selected':''}>全部客人</option><option value="partial" ${jessicaState.status==='partial'?'selected':''}>部分到貨，可先寄</option><option value="all-ready" ${jessicaState.status==='all-ready'?'selected':''}>全部到貨</option><option value="waiting" ${jessicaState.status==='waiting'?'selected':''}>全部等待中</option></select></div>${names.length===0?`<div class="empty-state">目前沒有符合條件的客人</div>`:body}</div>`;
  bindSearch('jessicaSearchInput',v=>jessicaState.search=v,()=>{renderJessica();hydrateImages();});const flowSel=document.getElementById('jessicaFlowSelect');if(flowSel)flowSel.addEventListener('change',e=>{jessicaState.flow=e.target.value;renderJessica();hydrateImages();});const statSel=document.getElementById('jessicaStatusSelect');if(statSel)statSel.addEventListener('change',e=>{jessicaState.status=e.target.value;renderJessica();hydrateImages();});

}

function orderTWDTotal(order){

}

  const custOrders = orders.filter(o=>o.orderType==='customer' && !orderIsCompleted(o));

    return `<tr>
      <td>${esc(o.customerName)}</td>
      <td>${esc(o.id)}</td>
      <td>NT$${fmtMoney(total)}</td>
      <td>NT$${fmtMoney(received)}</td>
      <td>${statusHtml}</td>
      <td><input class="input" id="payinput_${o.id}" style="max-width:130px;display:inline-block" placeholder="收款金額" type="number"><button class="btn small green" data-action="add-payment" data-id="${o.id}">新增收款</button></td>
    </tr>`;
  }).join('');

// ====== 備份 / 回收桶 / 活動紀錄 ======
let activityLogUserFilter = 'all';
function activityLogTimestamp_(log){
  const m = String(log && log.id || '').match(/^LOG-(\d+)/);
  if(m) return Number(m[1]) || 0;
  const t = Date.parse(log && log.at ? log.at : '');
  return Number.isFinite(t) ? t : 0;
}
function setActivityLogUserFilter(value){
  activityLogUserFilter = value || 'all';
  renderBackup();
}
function renderBackup(){
  const deletedRows = (deletedOrders||[]).map(o=>`<tr>
    <td>${esc(o.id)}</td><td>${o.orderType==='return'?'退貨商品':esc(o.customerName)}</td><td>${(o.items||[]).length}</td><td>${esc(o.deletedAt)||'-'}</td><td>${esc(o.deletedBy)||'-'}</td>
    <td><button class="btn small green" onclick="restoreDeletedOrder('${escAttr(o.id)}')">還原</button> <button class="btn small red" onclick="permanentlyDeleteOrder('${escAttr(o.id)}')">永久刪除</button></td>
  </tr>`).join('');
  const activityUsers = Array.from(new Set((activityLog||[]).map(l=>l.user||'unknown'))).sort((a,b)=>a.localeCompare(b));
  let filteredLogs = (activityLog||[]).slice().sort((a,b)=>activityLogTimestamp_(b)-activityLogTimestamp_(a));
  if(activityLogUserFilter !== 'all') filteredLogs = filteredLogs.filter(l=>(l.user||'unknown')===activityLogUserFilter);
  const logRows = filteredLogs.slice(0,200).map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.user)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('');
  document.getElementById('backupContent').innerHTML = `
  <div class="card"><h2>備份與資料安全</h2>
    <div class="note">資料存在 Firebase，不在 HTML 裡；更新 HTML 不會刪掉資料。這裡可以一鍵匯出 CSV、完整 JSON 備份，也可以從回收桶還原誤刪訂單。</div>
    <div class="toolbar">
      <button class="btn green" onclick="exportAllCSV()">匯出 Excel/CSV</button>
      <button class="btn" onclick="exportBackupJSON()">匯出完整 JSON 備份</button>
      <button class="btn secondary" onclick="triggerImportBackup()">匯入 JSON 備份</button>
      <input id="backupImportInput" type="file" accept="application/json,.json" style="display:none" onchange="importBackupFile(this)">
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h2>回收桶</h2>
    ${(deletedOrders||[]).length===0?'<div class="empty-state">目前沒有刪除的訂單</div>':`<table class="table"><tr><th>訂單</th><th>客人/類型</th><th>商品數</th><th>刪除時間</th><th>刪除者</th><th>動作</th></tr>${deletedRows}</table>`}
  </div>
  <div class="card" style="margin-top:16px"><h2>活動紀錄</h2>
    <div class="toolbar">
      <select style="max-width:260px" onchange="setActivityLogUserFilter(this.value)">
        <option value="all" ${activityLogUserFilter==='all'?'selected':''}>全部使用者</option>
        ${activityUsers.map(u=>`<option value="${escAttr(u)}" ${activityLogUserFilter===u?'selected':''}>${esc(u)}</option>`).join('')}
      </select>
      <span class="muted">依時間由新到舊排列</span>
    </div>
    ${filteredLogs.length===0?'<div class="empty-state">目前沒有符合條件的活動紀錄</div>':`<table class="table"><tr><th>時間</th><th>使用者</th><th>動作</th><th>內容</th></tr>${logRows}</table>`}
  </div>`;
}

function openOrderDetail(orderId, editMode){

function renderCustomerOrders(){
  const custOrders = orders.filter(o=>o.orderType==='customer');
  const rows = custOrders.map(o=>{
    const total = o.items.length;
    const doneCount = o.items.filter(it=>{
      if(it.isReturn) return true; // 已離開此訂單的流程，不列入待處理
      if(needsTwFlow(it,o)) return !!it.customerShippedDate;
      return !!it.usShippedDate;
    }).length;
    const readyToShip = o.items.some(it=>needsTwFlow(it,o) && it.twReceivedDate && !it.customerShippedDate);
    const allDone = o.items.filter(it=>needsTwFlow(it,o)).every(it=>it.customerShippedDate) && o.items.filter(it=>needsTwFlow(it,o)).length>0;
    let statusPill;
    if(allDone) statusPill = `<span class="status s-done">已完成</span>`;
    else if(readyToShip) statusPill = `<span class="status s-ready">可先寄已到商品</span>`;
    else statusPill = `<span class="status s-wait">等待到齊</span>`;
    return `<tr>
      <td>${esc(o.id)}</td>
      <td>${esc(o.customerName)}</td>
      <td>${total}</td>
      <td>${doneCount}/${total} 已完成流程</td>
      <td>${statusPill}</td>
      <td>
        <button class="btn small secondary" onclick="openOrderDetail('${escAttr(o.id)}', false)">查看詳細紀錄</button>
        <button class="btn small" onclick="openOrderDetail('${escAttr(o.id)}', true)">修改訂單</button>
        <button class="btn small red" onclick="deleteOrder('${escAttr(o.id)}')">刪除訂單</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('customerOrdersContent').innerHTML = `
  <div class="card"><h2>訂單管理</h2>
   <div class="note">這裡顯示尚未完成的訂單。商品寄出給客人後若整張訂單已完成，會移到左側「完成訂單」。</div>

}

      <div class="field normalOnly"><label>台幣：客訂金額</label><input class="input" data-field="priceTWD" value="${escAttr(it.priceTWD)}"></div>
      <div class="field normalOnly"><label>美金：買貨金額</label><input class="input" data-field="priceUSD" value="${escAttr(it.priceUSD)}"></div>
      <div class="field normalOnly"><label>是否退貨</label><select data-field="isReturn" onchange="toggleEditReturnFields(this)"><option value="false" ${!it.isReturn?'selected':''}>否</option><option value="true" ${it.isReturn?'selected':''}>是</option></select></div>
    </div>
    <div class="directbox" style="display:${it.flow==='直郵'?'block':'none'}"><b>直郵資訊</b><div class="formgrid" style="margin-top:10px">
      <div class="field"><label>直郵收件人</label><input class="input" data-field="directRecipient" value="${escAttr(it.directRecipient)}"></div>
      <div class="field"><label>直郵地址</label><input class="input" data-field="directAddress" value="${escAttr(it.directAddress)}"></div>
      <div class="field"><label>直郵分組</label><input class="input" data-field="directGroup" value="${escAttr(it.directGroup)}"></div>
    </div></div>
    <div class="formgrid" style="margin-top:12px">
      <div class="field"><label>購買日期</label><input class="input" data-field="purchasedDate" type="date" value="${escAttr(it.purchasedDate)}"></div>
      <div class="field"><label>美國收貨日期</label><input class="input" data-field="usReceivedDate" type="date" value="${escAttr(it.usReceivedDate)}"></div>
      <div class="field"><label>美國出貨日期</label><input class="input" data-field="usShippedDate" type="date" value="${escAttr(it.usShippedDate)}"></div>
      <div class="field twOnly"><label>台灣收貨日期</label><input class="input" data-field="twReceivedDate" type="date" value="${escAttr(it.twReceivedDate)}"></div>
      <div class="field twOnly"><label>台灣出貨給客人日期</label><input class="input" data-field="customerShippedDate" type="date" value="${escAttr(it.customerShippedDate)}"></div>
      <div class="field returnOnly"><label>退貨日期</label><input class="input" data-field="returnDate" type="date" value="${escAttr(it.returnDate)}"></div>
    </div>
  </div>`;
}

function toggleEditReturnFields(sel){
  const card = sel.closest('.edit-item');
  if(!card) return;
  const isRet = sel.value === 'true';
  card.querySelectorAll('.normalOnly').forEach(el=>{ if(el.querySelector('[data-field="isReturn"]')) return; el.style.display = isRet ? 'none' : ''; });
  card.querySelectorAll('.twOnly').forEach(el=>el.style.display = isRet ? 'none' : '');
  card.querySelectorAll('.returnOnly').forEach(el=>el.style.display = isRet ? '' : 'none');
}

function renderEditOrder(order, options){
  const isReturnOrder = order.orderType === 'return';
  const custBox = isReturnOrder ? '' : `<div class="card" style="margin-top:16px"><h2>客人資料</h2>
    <div class="formgrid">
      <div class="field"><label>客人姓名</label><input class="input" id="editCustomerName" value="${escAttr(order.customerName)}"></div>
      <div class="field"><label>電話</label><input class="input" id="editPhone" value="${escAttr(order.phone)}"></div>
      <div class="field"><label>LINE ID</label><input class="input" id="editLineId" value="${escAttr(order.lineId)}"></div>
      <div class="field"><label>台灣收件人</label><input class="input" id="editTwRecipient" value="${escAttr(order.twRecipient)}"></div>
      <div class="field"><label>台灣電話</label><input class="input" id="editTwPhone" value="${escAttr(order.twPhone)}"></div>
      <div class="field"><label>台灣地址</label><input class="input" id="editTwAddress" value="${escAttr(order.twAddress)}"></div>
    </div></div>`;
  document.getElementById('detailContent').innerHTML = `
  <div class="card">
    <h2>修改訂單</h2>
    <div class="note">客人改資料或改商品時，在這裡修改後按「儲存修改」。商品若改成退貨，會自動從原本訂單拆出來，建立成獨立退貨訂單。</div>
    <div class="toolbar">
      <select id="detailOrderSelect" style="max-width:420px">${options}</select>
      <button class="btn secondary" id="cancelEditOrderBtn">取消修改</button>
      <button class="btn green" id="saveEditOrderBtn">儲存修改</button>
    </div>
  </div>
  ${custBox}
  <div class="card" style="margin-top:16px">
    <h2>商品品項</h2>
    <div id="editItemsWrap">${order.items.map(it=>editItemCardHTML(it,order)).join('')}</div>
    <button class="btn" id="addEditItemBtn">＋ 新增商品</button>
  </div>`;
  const sel = document.getElementById('detailOrderSelect');
  if(sel) sel.addEventListener('change', e=>{ detailSelectedId = e.target.value; detailEditing=false; renderDetail(); hydrateImages(); });
  document.getElementById('cancelEditOrderBtn').addEventListener('click', ()=>{ detailEditing=false; renderDetail(); hydrateImages(); });
  document.getElementById('saveEditOrderBtn').addEventListener('click', saveEditOrder);
  document.getElementById('addEditItemBtn').addEventListener('click', ()=>{
    const wrap = document.getElementById('editItemsWrap');
    wrap.insertAdjacentHTML('beforeend', editItemCardHTML(null, order));
    hydrateImages(wrap.lastElementChild);
  });
  document.querySelectorAll('[data-action="remove-edit-item"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.currentTarget.closest('.edit-item');
      const remaining = document.querySelectorAll('#editItemsWrap .edit-item').length;
      if(remaining <= 1){ alert('至少要保留一個商品'); return; }
      if(confirm('確定要刪除這個商品嗎？')) card.remove();
    });
  });
  document.querySelectorAll('.edit-item [data-field="isReturn"]').forEach(sel=>toggleEditReturnFields(sel));
  hydrateImages();
}

async function saveEditOrder(){
  const order = findOrder(detailSelectedId);
  if(!order) return;
  if(order.orderType === 'customer'){
    const name = (document.getElementById('editCustomerName')||{}).value || '';
    if(!name.trim()){ alert('請填寫客人姓名'); return; }
    order.customerName = name.trim();
    order.phone = (document.getElementById('editPhone')||{}).value || '';
    order.lineId = (document.getElementById('editLineId')||{}).value || '';
    order.twRecipient = (document.getElementById('editTwRecipient')||{}).value || '';
    order.twPhone = (document.getElementById('editTwPhone')||{}).value || '';
    order.twAddress = (document.getElementById('editTwAddress')||{}).value || '';
  }
  const cards = document.querySelectorAll('#editItemsWrap .edit-item');
  const newItems = [];
  const uploadJobs = [];
  cards.forEach(card=>{
    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
    const itemName = get('itemName').trim();
    const id = card.dataset.itemid || uidItem();
    if(!itemHasEnoughInfo(card, id)) return;
    const isRet = order.orderType === 'return' || get('isReturn') === 'true';
    const flow = isRet ? '' : get('flow');
    const old = (order.items||[]).find(i=>i.id===id) || {};
    const item = Object.assign({}, old, {
      id,
      itemName,
      brand: get('brand'),
      site: get('site'),
      itemUrl: get('itemUrl'),
      size: get('size'),
      color: get('color'),
      qty: get('qty') || '1',
      note: get('note'),
      flow,
      priceTWD: isRet ? '' : get('priceTWD'),
      priceUSD: isRet ? '' : get('priceUSD'),
      directRecipient: flow==='直郵'?get('directRecipient'):'',
      directAddress: flow==='直郵'?get('directAddress'):'',
      directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: isRet,
      purchasedDate: get('purchasedDate'),
      usReceivedDate: get('usReceivedDate'),
      usShippedDate: get('usShippedDate'),
      twReceivedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('twReceivedDate'),
      customerShippedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('customerShippedDate'),
      returnDate: isRet ? get('returnDate') : ''
    });
    if(pendingImageFiles[id]){
      item.hasImage = true;
      uploadJobs.push({itemId:id, file:pendingImageFiles[id]});
    }
    newItems.push(item);
  });
  if(newItems.length===0){ alert('至少要有一個商品：可以只上傳圖片，商品名稱可空白'); return; }
  order.items = newItems;
  splitReturnItemsIntoSeparateOrders(order.id);
  await saveOrders();
  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();
  alert('訂單已更新');
  detailEditing = false;
  renderDetail();
  hydrateImages();
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.getElementById('loginScreen') && document.getElementById('loginScreen').style.display !== 'none') loginWithEmail();
});
initAuth();
</script>
