<script>
// ====== Firebase 設定（沿用你已建立好的專案） ======
const firebaseConfig = {
  apiKey: "AIzaSyCJxAWxAhOtkewFF0FEqu4UduELWDdAv2k",
  authDomain: "jenna---usa-buy.firebaseapp.com",
  projectId: "jenna---usa-buy",
  storageBucket: "jenna---usa-buy.firebasestorage.app",
  messagingSenderId: "786455761363",
  appId: "1:786455761363:web:e9390a916083d2d0d55f26"
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let connectionError = '';
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;
const FS_KEY = firebaseConfig.apiKey;
const dbReady = !CONFIG_IS_PLACEHOLDER;
const AUTH_BASE = `https://identitytoolkit.googleapis.com/v1/accounts`;
let currentUser = null;
function authHeaders(){ return currentUser && currentUser.idToken ? { 'Authorization': 'Bearer ' + currentUser.idToken } : {}; }
function getStoredUser(){ try { return JSON.parse(localStorage.getItem('buyflowUser') || 'null'); } catch(e){ return null; } }
function setStoredUser(u){ if(u) localStorage.setItem('buyflowUser', JSON.stringify(u)); else localStorage.removeItem('buyflowUser'); }
function showLoginError(msg){ const el=document.getElementById('loginError'); if(el){ el.style.display='block'; el.textContent=msg; } }
async function loginWithEmail(){
  const email=(document.getElementById('loginEmail')||{}).value || '';
  const password=(document.getElementById('loginPassword')||{}).value || '';
  if(!email || !password){ showLoginError('請輸入 Email 和 Password'); return; }
  try{
    const res = await fetch(`${AUTH_BASE}:signInWithPassword?key=${FS_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, returnSecureToken:true })
    });
    if(!res.ok){ throw new Error('登入失敗，請確認 Email / Password 是否正確'); }
    const data = await res.json();
    currentUser = { email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn||'3600')*1000) };
    setStoredUser(currentUser);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }catch(e){ showLoginError(e.message || '登入失敗'); }
}
function logout(){
  setStoredUser(null); currentUser=null; loaded=false; orders=[];
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('appRoot').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  const err=document.getElementById('loginError'); if(err) err.style.display='none';
}
function initAuth(){
  const u = getStoredUser();
  if(u && u.idToken && (!u.expiresAt || u.expiresAt > Date.now()+60000)){
    currentUser = u;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }else{
    setStoredUser(null);
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appRoot').style.display='none';
  }
}

async function fsGetDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('資料庫讀取失敗（HTTP ' + res.status + '）');
  const data = await res.json();
  return data.fields || null;
}
async function fsSetDoc(collection, docId, fieldName, stringValue){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields: { [fieldName]: { stringValue } } })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}
async function fsSetFieldsDoc(collection, docId, values){
  const fields = {};
  Object.keys(values || {}).forEach(key => {
    fields[key] = { stringValue: String(values[key] == null ? '' : values[key]) };
  });
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}

async function fsDeleteDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { method: 'DELETE', headers: authHeaders() });
  return res.ok;
}

// ====== 資料 ======
const SITES = ['Walmart','Target','Costco',"Sam's Club","Trader Joe's","Macy's",'Nordstrom',"Bloomingdale's","Dillard's",'Kohl\'s','JCPenney','Belk','Neiman Marcus','Saks Fifth Avenue','Burlington','Ross Dress for Less','Marshalls','TJ Maxx','HomeGoods','Sierra','Best Buy','Pottery Barn',"Dick's Sporting Goods",'REI','Old Navy','Gap','Banana Republic','Athleta','American Eagle','Aerie','Hollister','Abercrombie & Fitch','H&M','Zara','Forever 21',"J.Crew",'Ann Taylor','LOFT','DSW','Famous Footwear','Foot Locker','Finish Line','Ulta Beauty','Sephora','Tiffany & Co.','Pandora','Louis Vuitton','Gucci','Prada','Cartier','Burberry','Chanel','Hermès','Amazon','Adidas','Nike','Urban Outfitters'];
const BRANDS = ['Nike','Adidas','Coach','Dior','Chanel','Hermès','Gucci','Prada','Louis Vuitton','Lululemon','Alo','Stanley','Dyson','Apple','Tory Burch','Kate Spade','Michael Kors','The North Face','Patagonia','New Balance','UGG','Sephora Collection','Rare Beauty','Charlotte Tilbury','LEGO'];
const FLOWS = ['小沈','JLS','恬恬','婷婷','直郵'];
const TW_FLOWS = ['小沈','JLS','恬恬'];

let orders = [];
let deletedOrders = [];
let activityLog = [];
let loaded = false;
let imageCache = {};
let pendingImageFiles = {};
let isComposingSearch = false;
let lastOrdersJson = '';

function uidOrder(){ return 'ORD-' + Math.random().toString(36).slice(2,5).toUpperCase() + Date.now().toString().slice(-4); }
function uidItem(){ return 'ITM-' + Math.random().toString(36).slice(2,6).toUpperCase() + Date.now().toString().slice(-3); }
function todayStr(){ const d=new Date(); const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,'0'); const day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function opts(arr, selected){ return arr.map(x=>`<option value="${escAttr(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`).join(''); }
function fmtMoney(n){ n = parseFloat(n)||0; return n.toLocaleString('en-US'); }

function needsTwFlow(item, order){
  return order.orderType==='customer' && !item.isReturn && TW_FLOWS.includes(item.flow);
}
function endsAfterUSShip(item, order){
  return order.orderType==='customer' && !item.isReturn && ['直郵','婷婷'].includes(item.flow);
}
function findItem(itemId){
  for(const o of orders){
    const it = o.items.find(i=>i.id===itemId);
    if(it) return {item:it, order:o};
  }
  return null;
}
function findOrder(id){ return orders.find(o=>o.id===id); }
function allPairs(){
  const pairs = [];
  orders.forEach(o=>o.items.forEach(it=>pairs.push({item:it, order:o})));
  return pairs;
}


function splitReturnItemsIntoSeparateOrders(preferredDetailId){
  // 只要客人訂單中的某個商品被標記為退貨，就把該商品拆成獨立退貨訂單。
  // 這樣原本客人的訂單只保留正常商品；退貨商品會走自己的退貨流程。
  let changed = false;
  const newReturnOrders = [];

  orders.forEach(order => {
    if(order.orderType !== 'customer' || !Array.isArray(order.items)) return;
    const keepItems = [];
    order.items.forEach(item => {
      if(item && item.isReturn){
        changed = true;
        const returnItem = Object.assign({}, item, {
          isReturn: true,
          flow: '',
          priceTWD: '',
          priceUSD: '',
          twReceivedDate: '',
          customerShippedDate: '',
          directRecipient: '',
          directAddress: '',
          directGroup: ''
        });
        newReturnOrders.push({
          id: uidOrder(),
          orderType: 'return',
          createdAt: todayStr(),
          sourceOrderId: order.id,
          sourceCustomerName: order.customerName || '',
          customerName: '', phone: '', lineId: '', twRecipient: '', twPhone: '', twAddress: '',
          paymentsReceived: 0,
          items: [returnItem]
        });
      }else{
        keepItems.push(item);
      }
    });
    order.items = keepItems;
  });

  if(changed){
    // 移除已經沒有任何商品的原訂單，避免留下空訂單。
    orders = orders.filter(o => o.orderType !== 'customer' || (Array.isArray(o.items) && o.items.length > 0));
    orders.unshift(...newReturnOrders);
    if(preferredDetailId && !findOrder(preferredDetailId) && newReturnOrders.length){
      detailSelectedId = newReturnOrders[0].id;
    }
  }
  return changed;
}

function itemIsWorkflowComplete(item, order){
  if(item.isReturn) return !!item.returnDate;
  if(endsAfterUSShip(item, order)) return !!item.usShippedDate;
  if(needsTwFlow(item, order)) return !!item.customerShippedDate;
  return !!item.usShippedDate;
}
function orderIsCompleted(order){

let pollTimer = null;
async function pollOrders(){
  if(!dbReady) return;
  try{
    const fields = await fsGetDoc('app-data', 'main');
    const json = (fields && fields.ordersJson && fields.ordersJson.stringValue) || '[]';
    const deletedJson = (fields && fields.deletedOrdersJson && fields.deletedOrdersJson.stringValue) || '[]';
    const logJson = (fields && fields.activityLogJson && fields.activityLogJson.stringValue) || '[]';
    const combinedJson = json + '|' + deletedJson + '|' + logJson;
    if(combinedJson !== lastOrdersJson){
      lastOrdersJson = combinedJson;
      orders = JSON.parse(json || '[]');
      deletedOrders = JSON.parse(deletedJson || '[]');
      activityLog = JSON.parse(logJson || '[]');
      renderAll();
    }
    if(connectionError){ connectionError = ''; renderAll(); }
  }catch(e){
    console.error('讀取資料失敗', e);
    connectionError = e && e.message ? e.message : '無法連線到資料庫';
    renderAll();
  }
}
function startListening(){
  if(!dbReady){ loaded = true; renderAll(); return; }
  pollOrders().finally(()=>{ loaded = true; renderAll(); });
  pollTimer = setInterval(pollOrders, 4000);
}
async function saveOrders(addGenericLog=true){
  if(addGenericLog) logActivity('更新資料', currentSection || '');
  if(!dbReady) return;
  try{
    const json = JSON.stringify(orders);
    const deletedJson = JSON.stringify(deletedOrders);
    const logJson = JSON.stringify(activityLog);
    // 一次寫入三個欄位，避免 Firestore PATCH 互相覆蓋，造成新訂單消失。
    await fsSetFieldsDoc('app-data', 'main', {
      ordersJson: json,
      deletedOrdersJson: deletedJson,
      activityLogJson: logJson
    });
    lastOrdersJson = json + '|' + deletedJson + '|' + logJson;
    connectionError = '';
  }catch(e){
    console.error('儲存發生錯誤', e);
    connectionError = e && e.message ? e.message : String(e);
    renderAll();
  }
}

// ====== 圖片 ======
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('無法解析這張圖片的格式'));
    img.src = src;
  });
}
function drawToDataURL(srcW, srcH, drawFn){
  const maxDim = 900;
  let w = srcW, h = srcH;
  if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, w, h);
  return canvas.toDataURL('image/jpeg', 0.7);
}
async function compressImage(file){
  try{
    const bitmap = await createImageBitmap(file);
    const dataUrl = drawToDataURL(bitmap.width, bitmap.height, (ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h));
    bitmap.close && bitmap.close();
    return dataUrl;
  }catch(e1){
    try{
      const rawDataUrl = await readFileAsDataURL(file);
      const img = await loadImageEl(rawDataUrl);
      return drawToDataURL(img.naturalWidth, img.naturalHeight, (ctx,w,h)=>ctx.drawImage(img,0,0,w,h));
    }catch(e2){
      const rawDataUrl = await readFileAsDataURL(file).catch(()=>null);
      if(rawDataUrl && rawDataUrl.length < 4000000) return rawDataUrl;
      throw new Error('這張圖片的格式或大小無法處理，建議改用 JPG / PNG 格式，或先縮小照片再上傳');
    }
  }
}
async function uploadImageForItem(itemId, file){
  if(!dbReady) return;
  try{
    const dataUrl = await compressImage(file);
    await fsSetDoc('item-images', itemId, 'dataUrl', dataUrl);
    imageCache[itemId] = dataUrl;
  }catch(e){
    console.error('圖片上傳失敗', e);
    alert('商品「'+itemId+'」的圖片上傳失敗：' + (e && e.message ? e.message : '未知錯誤'));
  }
}
async function handleImageDelete(itemId){
  if(!dbReady) return;
  try{ await fsDeleteDoc('item-images', itemId); }catch(e){}
  delete imageCache[itemId];
  const found = findItem(itemId);

  renderAll();

function hydrateImages(root){
  (root||document).querySelectorAll('[data-hasimage="1"]').forEach(async(el2)=>{
    const id = el2.dataset.id;

function bindSearch(inputId, onChange, rerenderFn){
  const el = document.getElementById(inputId);
  if(!el) return;
  el.addEventListener('compositionstart', ()=>{ isComposingSearch = true; });
  el.addEventListener('compositionend', (e)=>{ isComposingSearch = false; onChange(e.target.value); rerenderFn(); });
  el.addEventListener('input', (e)=>{
    onChange(e.target.value);
    if(isComposingSearch) return;
    const pos = e.target.selectionStart;

    const again = document.getElementById(inputId);
    if(again){ again.focus(); again.setSelectionRange(pos,pos); }
  });

    return { text:'已退貨完成', cls:'s-done', detail:'這個商品已完成退貨流程。', current:'完成' };
  }
  if(!item.usReceivedDate) return { text:'已下單，等待 Jen 收到', cls:'s-buy', detail:'Jenna 已標記購買，現在等待 Jen 在美國收到貨。', current:'Jen 美國收貨' };
  if(!item.usShippedDate){
    if(item.flow === '直郵') return { text:'Jen 已收到，等待直郵出貨', cls:'s-usa', detail:'這是直郵商品，Jen 收到後只需要標記美國出貨日期。', current:'Jen 美國出貨' };

    return { text:'Jen 已收到，等待美國出貨回台灣', cls:'s-usa', detail:'Jen 已收到商品，下一步是標記美國出貨回台灣日期。', current:'Jen 美國出貨' };

function isReturnOnlyMode(){
  const el = document.querySelector('input[name="orderType"]:checked');
  return el ? el.value === 'return' : false;
}

function toggleOrderType(){
  const returnMode = isReturnOnlyMode();
  document.getElementById('customerInfoCard').style.display = returnMode ? 'none' : 'block';
  document.getElementById('itemsWrap').innerHTML = '';
  newOrderItemCount = 0;
  addNewOrderItem();
}

function toggleBrandOther(sel, id){
  const el = document.getElementById(id);
  if(el) el.style.display = sel.value === '__other__' ? 'block' : 'none';
}
function toggleFlowDirect(sel){
  const card = sel.closest('.itemcard');
  const box = card ? card.querySelector('.directbox') : null;
  if(box) box.style.display = sel.value === '直郵' ? 'block' : 'none';
}
function previewNewItemImage(input, itemId){
  const box = input.closest('.field').querySelector('.thumb');
  if(!box || !input.files || !input.files[0]) return;
  pendingImageFiles[itemId] = input.files[0];
  const reader = new FileReader();
  reader.onload = e => { box.classList.add("has-photo"); box.onclick = () => openImageModal(e.target.result, "圖片預覽"); box.innerHTML = `<img src="${e.target.result}" alt="圖片預覽">`; };
  reader.readAsDataURL(input.files[0]);
}

async function saveNewOrder(){
  const returnMode = isReturnOnlyMode();
  const orderType = returnMode ? 'return' : 'customer';
  let customerName='', phone='', lineId='', twRecipient='', twPhone='', twAddress='';
  if(!returnMode){
    customerName = (document.getElementById('noCustomerName')||{}).value || '';
    if(!customerName.trim()){ alert('請填寫客人姓名'); return; }
    phone = (document.getElementById('noPhone')||{}).value || '';
    lineId = (document.getElementById('noLineId')||{}).value || '';
    twRecipient = (document.getElementById('noTwRecipient')||{}).value || '';
    twPhone = (document.getElementById('noTwPhone')||{}).value || '';
    twAddress = (document.getElementById('noTwAddress')||{}).value || '';
  }

  const cards = document.querySelectorAll('#itemsWrap .itemcard');
  const items = [];
  const uploadJobs = [];
  cards.forEach(card=>{
    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
    const itemName = get('itemName').trim();
    const itemId = card.dataset.itemid;
    if(!itemHasEnoughInfo(card, itemId)) return;
    let brand = get('brand'); if(brand==='__other__') brand = get('brandOther');
    let site = get('site'); if(site==='__other__') site = get('siteOther');
    const flow = returnMode ? '' : get('flow');
    const item = {
      id: itemId, itemName, brand, site, itemUrl: get('itemUrl'), size: get('size'), color: get('color'),
      qty: get('qty') || '1',
      flow, priceTWD: returnMode?'':get('priceTWD'), priceUSD: returnMode?'':get('priceUSD'),
      directRecipient: flow==='直郵'?get('directRecipient'):'', directAddress: flow==='直郵'?get('directAddress'):'', directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: returnMode, hasImage: false,
      purchasedDate:'', usReceivedDate:'', usShippedDate:'', twReceivedDate:'', customerShippedDate:'', returnDate:''
    };
    items.push(item);
    if(pendingImageFiles[itemId]) uploadJobs.push({itemId, file: pendingImageFiles[itemId]});
  });

  if(items.length===0){ alert('請至少加入一個商品：可以只上傳圖片，商品名稱可空白'); return; }

  const newOrder = {
    id: uidOrder(), orderType, createdAt: todayStr(),
    customerName, phone, lineId, twRecipient, twPhone, twAddress,
    paymentsReceived: 0, items
  };
  orders.unshift(newOrder);
  await saveOrders();

  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    const found = findItem(job.itemId);
    if(found) found.item.hasImage = true;
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();

  alert('訂單已建立！');
  show(returnMode ? 'returns' : 'customerOrders');
}
// ====== Jenna：待訂購商品（依網站分組） ======
let jennaState = { search:'', site:'all' };

function renderJenna(){
  let pairs = allPairs().filter(p=>!p.item.purchasedDate);
  pairs = pairs.filter(p=>{
    if(!jennaState.search) return true;
    const t = jennaState.search.toLowerCase();
    return (p.item.itemName||'').toLowerCase().includes(t)
      || (p.item.brand||'').toLowerCase().includes(t)
      || (p.item.site||'').toLowerCase().includes(t)
      || (p.order.customerName||'').toLowerCase().includes(t);
  });
  const sites = Array.from(new Set(pairs.map(p=>p.item.site).filter(Boolean))).sort();
  if(jennaState.site !== 'all') pairs = pairs.filter(p=>p.item.site === jennaState.site);

  const rows = pairs.map(p=>{
    const custLabel = p.order.orderType==='return' ? '（退貨商品）' : esc(p.order.customerName)||'—';
    const money = p.order.orderType==='return' ? '' : `US$${esc(p.item.priceUSD||'-')}<br>NT$${esc(p.item.priceTWD||'-')}`;
    return `<tr>
      <td>${thumbHTML(p.item)}</td>
      <td><b>${esc(p.item.site)||'—'}</b></td>
      <td>${esc(p.item.brand)&&p.item.itemName?esc(p.item.brand)+'<br>':''}<span class="item-click" onclick="openItemStatusModal('${escAttr(p.item.id)}', event)">${esc(itemDisplayName(p.item))}</span><br><button class="btn secondary small" style="margin-top:6px" onclick="openItemStatusModal('${escAttr(p.item.id)}', event)">查看狀態</button></td>
      <td>${custLabel}</td>
      <td>${esc(p.item.size)||'-'} / ${esc(p.item.color)||'-'}</td>
      <td>${money}</td>
      <td><input type="date" class="input" id="pdate_${p.item.id}" style="max-width:150px;display:inline-block"><button class="btn small green" data-action="mark-purchased" data-id="${p.item.id}">標記已購買</button></td>
    </tr>`;
  }).join('');

  document.getElementById('jennaContent').innerHTML = `
  <div class="card"><h2>Purchase Queue：Jenna 依訂購網站一起買</h2>
   <div class="toolbar">
    <select id="jennaSiteSelect" style="max-width:260px"><option value="all">全部網站</option>${opts(sites, jennaState.site==='all'?null:jennaState.site)}</select>
    <input class="input" id="jennaSearchInput" style="max-width:320px" placeholder="搜尋商品/品牌/客人" value="${escAttr(jennaState.search)}">
   </div>
   ${pairs.length===0? `<div class="empty-state">目前沒有待採購的商品 🎉</div>` :
   `<table class="table"><tr><th>圖片</th><th>網站</th><th>品牌/商品</th><th>客人</th><th>Size/顏色</th><th>金額</th><th>動作</th></tr>${rows}</table>`}
  </div>`;

  const siteSel = document.getElementById('jennaSiteSelect');
  if(siteSel) siteSel.addEventListener('change', e=>{ jennaState.site = e.target.value; renderJenna(); hydrateImages(); });
  bindSearch('jennaSearchInput', v=>jennaState.search=v, ()=>{ renderJenna(); hydrateImages(); });
  document.querySelectorAll('[data-action="mark-purchased"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const dateInput = document.getElementById('pdate_'+id);
      const found = findItem(id);
      if(found){
        found.item.purchasedDate = (dateInput && dateInput.value) ? dateInput.value : todayStr();
        await saveOrders();
        renderJenna(); hydrateImages();
      }
    });
  });
  hydrateImages();
}

let jenState = { search:'', flow:'all' };
let usShipState = { search:'', flow:'all' };

function usReceiveActionCell(item){
  return `<input type="date" class="input" id="jrdate_${item.id}" style="max-width:150px;display:inline-block"><button class="btn small green" data-action="jen-mark-received" data-id="${item.id}">確認美國收到</button>`;
}

function usShipActionCell(item){
  if(item.isReturn){
    return `<span class="status s-return">退貨商品：已移到退貨頁</span>`;
  }
  const label = item.flow === '直郵' ? '直郵已出貨' : '美國出貨回台灣';
  return `<input type="date" class="input" id="jsdate_${item.id}" style="max-width:150px;display:inline-block"><button class="btn small orange" data-action="us-ship-mark-shipped" data-id="${item.id}">${label}</button>`;
}

function renderJen(){
  let pairs = allPairs().filter(p=>p.item.purchasedDate && !p.item.usReceivedDate);
  pairs = pairs.filter(p=>{
    if(!jenState.search) return true;
    const t = jenState.search.toLowerCase();
    return (p.item.itemName||'').toLowerCase().includes(t) || (p.item.site||'').toLowerCase().includes(t)
      || (p.item.brand||'').toLowerCase().includes(t) || (p.item.flow||'').toLowerCase().includes(t);
  });
  if(jenState.flow !== 'all') pairs = pairs.filter(p=>p.item.flow === jenState.flow);

  const rows = pairs.map(p=>{
    const flowBadge = p.item.isReturn ? `<span class="status s-return">退貨商品</span>` : (p.item.flow ? `<span class="badge">${esc(p.item.flow)}</span>` : '—');

      <td>${thumbHTML(p.item)}</td>
      <td><b class="item-click" onclick="openItemStatusModal('${escAttr(p.item.id)}', event)">${esc(itemDisplayName(p.item))}</b><br><span class="badge">${esc(p.item.site)||'—'}</span><br><button class="btn secondary small" style="margin-top:6px" onclick="openItemStatusModal('${escAttr(p.item.id)}', event)">查看狀態</button></td>

      <td>${esc(p.item.purchasedDate)||'-'}</td>
      <td>${usReceiveActionCell(p.item)}</td>

  document.getElementById('jenContent').innerHTML = `
  <div class="card"><h2>美國收貨：確認 Jen 已收到貨</h2>
   <div class="note">這一頁只顯示 Jenna 已購買、但 Jen 還沒確認收到的商品。Jen 標記「確認美國收到」後，一般商品會移到「美國出貨」；退貨商品會移到「退貨」頁。</div>

    <select id="jenFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(FLOWS, jenState.flow==='all'?null:jenState.flow)}</select>
   </div>

   `<table class="table"><tr><th>圖片</th><th>商品</th><th>流向 / 類型</th><th>購買日期</th><th>動作</th></tr>${rows}</table>`}

  bindSearch('jenSearchInput', v=>jenState.search=v, ()=>{ renderJen(); hydrateImages(); });

      const id = e.currentTarget.dataset.id;
      const d = document.getElementById('jrdate_'+id);
      const found = findItem(id);
      if(found){ found.item.usReceivedDate = (d && d.value) ? d.value : todayStr(); await saveOrders(); renderJen(); hydrateImages(); }
    });
  });
  hydrateImages();

// ====== 台灣出貨給客人 ======
let jessicaState = { search:'', flow:'all', status:'all' };

function renderJessica(){
  let pairs = allPairs().filter(p=>needsTwFlow(p.item,p.order) && p.item.twReceivedDate && !p.item.customerShippedDate);
  pairs = pairs.filter(p=>{
    if(!jessicaState.search) return true;
    const t = jessicaState.search.toLowerCase();
    return (p.item.itemName||'').toLowerCase().includes(t) || (p.item.brand||'').toLowerCase().includes(t) || (p.order.customerName||'').toLowerCase().includes(t);
  });
  if(jessicaState.flow !== 'all') pairs = pairs.filter(p=>p.item.flow === jessicaState.flow);

  const groups = new Map();
  pairs.forEach(p=>{
    const name = p.order.customerName || '（未填客人姓名）';
    if(!groups.has(name)) groups.set(name, {order:p.order, items:[]});
    groups.get(name).items.push(p.item);
  });

  let names = Array.from(groups.keys()).sort((a,b)=>a.localeCompare(b,'zh-Hant'));

  const body = names.map(name=>{
    const g = groups.get(name);
    const o = g.order;
    const readyItems = g.items.filter(i=>i.twReceivedDate && !i.customerShippedDate);
    const waitingItems = g.items.filter(i=>!i.twReceivedDate);
    const shippedItems = g.items.filter(i=>i.customerShippedDate);
    const tagLabel = `${readyItems.length} 件可寄給客人`;
    const rows = g.items.map(item=>{
      let statusHtml, checkbox;
      if(item.customerShippedDate){
        statusHtml = `<span class="status s-done">已寄出 ${esc(item.customerShippedDate)}</span>`;
        checkbox = `<input type="checkbox" disabled>`;
      }else if(item.twReceivedDate){
        statusHtml = `<span class="status s-ready">可寄</span>`;
        checkbox = `<input type="checkbox" checked class="jessica-check" data-id="${item.id}">`;
      }else{
        statusHtml = `<span class="status s-ship">等待到台灣</span>`;
        checkbox = `<input type="checkbox" disabled>`;
      }
      return `<div class="checkrow">${checkbox} ${thumbHTML(item)}<div style="flex:1"><b class="item-click" onclick="openItemStatusModal('${escAttr(item.id)}', event)">${esc(itemDisplayName(item))}</b><br><span class="muted">${esc(item.brand)||esc(item.site)||''} · ${esc(item.flow)} · ${item.twReceivedDate?('台灣已收到 '+esc(item.twReceivedDate)):'已從美國出貨，尚未台灣收貨'}</span></div>${statusHtml}</div>`;
    }).join('');
    const custBox = (o.twRecipient||o.twPhone||o.twAddress) ? `<div class="customerbox"><b>台灣收件人：</b>${esc(o.twRecipient)||'—'}　<b>電話：</b>${esc(o.twPhone)||'—'}<br><b>地址：</b>${esc(o.twAddress)||'—'}</div>` : '';
    const canShipCount = readyItems.length;
    return `<div class="shipmentgroup" data-customer="${escAttr(name)}">
      <h3>${esc(name)} <span class="badge">${tagLabel}</span></h3>
      ${custBox}
      ${rows}
      <div class="toolbar">
        <input type="date" class="input" id="jship_${escAttr(name).replace(/[^a-zA-Z0-9]/g,'_')}" style="max-width:180px">
        <button class="btn green" data-action="jessica-ship-group" data-customer="${escAttr(name)}" ${canShipCount===0?'disabled':''}>2. 寄出給客人（${canShipCount} 件）</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('jessicaContent').innerHTML = `
  <div class="card"><h2>台灣流程 Step 2：寄出給客人</h2>
   <div class="note">只有已完成 Step 1「確認收貨」的商品才會出現在這裡。標記出貨日期後，商品會從這裡移除；若整張訂單都完成，就會進入「完成訂單」。</div>
   <div class="toolbar">
    <select id="jessicaFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(TW_FLOWS, jessicaState.flow==='all'?null:jessicaState.flow)}</select>
    <input class="input" id="jessicaSearchInput" style="max-width:340px" placeholder="搜尋客人 / 商品 / 品牌" value="${escAttr(jessicaState.search)}">

   </div>
   ${names.length===0? `<div class="empty-state">目前沒有符合條件的客人</div>` : body}
  </div>`;

  bindSearch('jessicaSearchInput', v=>jessicaState.search=v, ()=>{ renderJessica(); hydrateImages(); });
  const flowSel = document.getElementById('jessicaFlowSelect');
  if(flowSel) flowSel.addEventListener('change', e=>{ jessicaState.flow = e.target.value; renderJessica(); hydrateImages(); });
  document.querySelectorAll('[data-action="jessica-ship-group"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const name = e.currentTarget.dataset.customer;
      const safeId = name.replace(/[^a-zA-Z0-9]/g,'_');
      const dateInput = document.getElementById('jship_'+safeId);
      const date = (dateInput && dateInput.value) ? dateInput.value : todayStr();
      const group = document.querySelector(`.shipmentgroup[data-customer="${CSS.escape(name)}"]`);
      const checks = group ? group.querySelectorAll('.jessica-check:checked') : [];
      if(checks.length===0){ alert('沒有可標記出貨的商品'); return; }
      checks.forEach(chk=>{
        const found = findItem(chk.dataset.id);
        if(found) found.item.customerShippedDate = date;
      });
      await saveOrders();
      renderJessica(); hydrateImages();
    });
  });
  hydrateImages();
}

// ====== 收款管理 ======
function orderTWDTotal(order){
  return order.items.filter(i=>!i.isReturn).reduce((sum,i)=>sum + (parseFloat(i.priceTWD)||0), 0);
}
function renderPayments(){
  const custOrders = orders.filter(o=>o.orderType==='customer' && !orderIsCompleted(o));
  const rows = custOrders.map(o=>{
    const total = orderTWDTotal(o);
    const received = o.paymentsReceived || 0;
    let statusHtml;
    if(total<=0) statusHtml = `<span class="status s-wait">尚無金額</span>`;
    else if(received >= total) statusHtml = `<span class="status s-done">已收齊</span>`;
    else if(received > 0) statusHtml = `<span class="status s-buy">部分收款</span>`;
    else statusHtml = `<span class="status s-wait">等貨到台灣後收款</span>`;
    return `<tr>
      <td>${esc(o.customerName)}</td>
      <td>${esc(o.id)}</td>
      <td>NT$${fmtMoney(total)}</td>
      <td>NT$${fmtMoney(received)}</td>
      <td>${statusHtml}</td>
      <td><input class="input" id="payinput_${o.id}" style="max-width:130px;display:inline-block" placeholder="收款金額" type="number"><button class="btn small green" data-action="add-payment" data-id="${o.id}">新增收款</button></td>
    </tr>`;
  }).join('');
  document.getElementById('paymentsContent').innerHTML = `
  <div class="card"><h2>收款管理</h2>
  ${custOrders.length===0? `<div class="empty-state">目前沒有客人訂單</div>` :
  `<table class="table"><tr><th>客人</th><th>訂單</th><th>台幣客訂金額</th><th>已收</th><th>狀態</th><th>動作</th></tr>${rows}</table>`}
  </div>`;
  document.querySelectorAll('[data-action="add-payment"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const input = document.getElementById('payinput_'+id);
      const amount = parseFloat(input && input.value);
      if(!amount || amount<=0){ alert('請輸入有效的收款金額'); return; }
      const o = findOrder(id);
      if(o){ o.paymentsReceived = (o.paymentsReceived||0) + amount; await saveOrders(); renderPayments(); }
    });
  });
}

// ====== 訂單管理 ======
function openOrderDetail(orderId, editMode){
  detailSelectedId = orderId;
  detailEditing = !!editMode;
  show('detail');
}
function renderCustomerOrders(){
  const custOrders = orders.filter(o=>o.orderType==='customer');
  const rows = custOrders.map(o=>{
    const total = o.items.length;
    const doneCount = o.items.filter(it=>{
      if(it.isReturn) return true; // 已離開此訂單的流程，不列入待處理
      if(needsTwFlow(it,o)) return !!it.customerShippedDate;
      return !!it.usShippedDate;
    }).length;
    const readyToShip = o.items.some(it=>needsTwFlow(it,o) && it.twReceivedDate && !it.customerShippedDate);
    const allDone = o.items.filter(it=>needsTwFlow(it,o)).every(it=>it.customerShippedDate) && o.items.filter(it=>needsTwFlow(it,o)).length>0;
    let statusPill;
    if(allDone) statusPill = `<span class="status s-done">已完成</span>`;
    else if(readyToShip) statusPill = `<span class="status s-ready">可先寄已到商品</span>`;
    else statusPill = `<span class="status s-wait">等待到齊</span>`;
    return `<tr>
      <td>${esc(o.id)}</td>
      <td>${esc(o.customerName)}</td>
      <td>${total}</td>
      <td>${doneCount}/${total} 已完成流程</td>
      <td>${statusPill}</td>
      <td>
        <button class="btn small secondary" onclick="openOrderDetail('${escAttr(o.id)}', false)">查看詳細紀錄</button>
        <button class="btn small" onclick="openOrderDetail('${escAttr(o.id)}', true)">修改訂單</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('customerOrdersContent').innerHTML = `
  <div class="card"><h2>訂單管理</h2>
   <div class="note">這裡顯示尚未完成的訂單。商品寄出給客人後若整張訂單已完成，會移到左側「完成訂單」。</div>
   ${custOrders.length===0? `<div class="empty-state">目前沒有客人訂單</div>` :
   `<table class="table"><tr><th>訂單</th><th>客人</th><th>商品數</th><th>處理狀態</th><th>是否可寄客人</th><th>動作</th></tr>${rows}</table>`}
  </div>`;
}

function editOptions(arr, selected){
  const exists = arr.includes(selected);
  const base = arr.map(x=>`<option value="${escAttr(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`).join('');
  const custom = selected && !exists ? `<option value="${escAttr(selected)}" selected>${esc(selected)}</option>` : '';
  return `<option value="">（不指定）</option>${custom}${base}`;
}

function renderDetail(){
  if(!detailSelectedId && orders.length) detailSelectedId = orders[0].id;
  const order = findOrder(detailSelectedId);
  const options = orders.map(o=>`<option value="${escAttr(o.id)}" ${o.id===detailSelectedId?'selected':''}>${esc(o.id)} － ${o.orderType==='return'?'退貨商品':esc(o.customerName)}</option>`).join('');
  if(detailEditing && order){
    renderEditOrder(order, options);
    return;
  }
  let body = '';
  if(order){
    const readonly = 'readonly disabled';
    const custBox = order.orderType==='customer' ? `
    <div class="card" style="margin-top:16px">
      <div class="itemhead"><div><h2>客人資料</h2><div class="muted">像新增訂單一樣分區顯示，按「修改這張訂單」即可編輯</div></div></div>
      <div class="formgrid">
        <div class="field"><label>客人姓名</label><input class="input" ${readonly} value="${escAttr(order.customerName)}"></div>
        <div class="field"><label>電話</label><input class="input" ${readonly} value="${escAttr(order.phone)}"></div>
        <div class="field"><label>LINE ID</label><input class="input" ${readonly} value="${escAttr(order.lineId)}"></div>
        <div class="field"><label>台灣收件人</label><input class="input" ${readonly} value="${escAttr(order.twRecipient)}"></div>
        <div class="field"><label>台灣電話</label><input class="input" ${readonly} value="${escAttr(order.twPhone)}"></div>
        <div class="field"><label>台灣地址</label><input class="input" ${readonly} value="${escAttr(order.twAddress)}"></div>
      </div>
    </div>` : `
    <div class="card" style="margin-top:16px">
      <h2>退貨商品資料</h2>
      <div class="note">這是獨立退貨訂單，不需要客人資料。來源訂單：${esc(order.sourceOrderId)||'—'} ${order.sourceCustomerName ? '｜原客人：'+esc(order.sourceCustomerName) : ''}</div>
    </div>`;

    const cards = order.items.map((item, idx)=>{
      const toTw = needsTwFlow(item, order);
      const isDirectOrTing = endsAfterUSShip(item, order);
      const flowText = item.isReturn ? '退貨' : (item.flow || '—');
      const itemTypeNote = item.isReturn
        ? '此商品為退貨，只需要美國收貨與退貨日期。'
        : isDirectOrTing
          ? '此商品為直郵 / 婷婷，只需要記錄到美國出貨日期。'
          : '此商品需要台灣收貨與台灣出貨給客人。';
      return `<div class="card" style="margin-top:16px">
        <div class="itemhead">
          <div>
            <h2>商品 #${idx+1}</h2>
            <span class="badge">${esc(item.id)}</span>
            ${item.isReturn ? '<span class="status s-return" style="margin-left:6px">退貨</span>' : ''}<span class="status ${itemStatusInfo(item, order).cls}" style="margin-left:6px">${esc(itemStatusInfo(item, order).text)}</span>
          </div>
          <div onclick="openImageModalFromItem('${escAttr(item.id)}')" style="cursor:pointer">${thumbHTML(item,'lg')}<div class="muted" style="text-align:center;margin-top:6px;font-size:12px">點圖片放大</div></div>
        </div>
        <div class="formgrid">
          <div class="field"><label>商品名稱（選填）</label><input class="input" ${readonly} value="${escAttr(item.itemName)}"></div>
          <div class="field"><label>品牌</label><input class="input" ${readonly} value="${escAttr(item.brand)}"></div>
          <div class="field"><label>訂購網站</label><input class="input" ${readonly} value="${escAttr(item.site)}"></div>
          <div class="field"><label>商品網址</label><input class="input" ${readonly} value="${escAttr(item.itemUrl)}"></div>
          <div class="field"><label>Size</label><input class="input" ${readonly} value="${escAttr(item.size)}"></div>
          <div class="field"><label>顏色</label><input class="input" ${readonly} value="${escAttr(item.color)}"></div>
          <div class="field"><label>數量</label><input class="input" ${readonly} value="${escAttr(item.qty||1)}"></div>
          <div class="field"><label>流向</label><input class="input" ${readonly} value="${escAttr(flowText)}"></div>
          ${item.isReturn ? '' : `<div class="field"><label>台幣：客訂金額</label><input class="input" ${readonly} value="${escAttr(item.priceTWD)}"></div>
          <div class="field"><label>美金：買貨金額</label><input class="input" ${readonly} value="${escAttr(item.priceUSD)}"></div>`}
        </div>
        ${item.flow==='直郵' && !item.isReturn ? `<div class="customerbox" style="margin-top:12px"><b>直郵資訊</b><br>收件人：${esc(item.directRecipient)||'—'}｜地址：${esc(item.directAddress)||'—'}｜分組：${esc(item.directGroup)||'—'}</div>` : ''}
        <div class="note" style="margin-top:12px"><b>目前狀態：</b>${esc(itemStatusInfo(item, order).text)}<br>${itemTypeNote}</div>
        <button class="btn secondary small" onclick="openItemStatusModal('${escAttr(item.id)}', event)">查看這個商品目前在哪裡</button>
        <h3 style="margin-top:18px">日期 / 物流流程</h3>
        <div class="formgrid">
          <div class="field"><label>購買日期</label><input class="input" ${readonly} value="${escAttr(item.purchasedDate)}"></div>
          <div class="field"><label>美國收貨日期</label><input class="input" ${readonly} value="${escAttr(item.usReceivedDate)}"></div>
          <div class="field"><label>美國出貨日期</label><input class="input" ${readonly} value="${escAttr(item.usShippedDate)}"></div>
          ${toTw ? `<div class="field"><label>台灣收貨日期</label><input class="input" ${readonly} value="${escAttr(item.twReceivedDate)}"></div>
          <div class="field"><label>台灣出貨給客人日期</label><input class="input" ${readonly} value="${escAttr(item.customerShippedDate)}"></div>` : ''}
          ${item.isReturn ? `<div class="field"><label>退貨日期</label><input class="input" ${readonly} value="${escAttr(item.returnDate)}"></div>` : ''}
        </div>
        ${flowStepsHTML(item, order)}
      </div>`;
    }).join('');
    body = custBox + cards;
  }else{
    body = `<div class="empty-state">目前還沒有任何訂單</div>`;
  }
  document.getElementById('detailContent').innerHTML = `
  <div class="card">
   <h2>訂單明細</h2>
   <div class="toolbar">
    <select id="detailOrderSelect" style="max-width:420px">${options}</select>
    ${order? `<button class="btn" id="editCurrentOrderBtn">修改這張訂單</button>` : ''}
   </div>
  </div>
  ${body}`;
  const sel = document.getElementById('detailOrderSelect');
  if(sel) sel.addEventListener('change', e=>{ detailSelectedId = e.target.value; detailEditing=false; renderDetail(); hydrateImages(); });
  const editBtn = document.getElementById('editCurrentOrderBtn');
  if(editBtn) editBtn.addEventListener('click', ()=>{ detailEditing=true; renderDetail(); hydrateImages(); });
  document.querySelectorAll('[data-action="detail-toggle-return"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const found = findItem(id);
      if(found){ found.item.isReturn = !found.item.isReturn; splitReturnItemsIntoSeparateOrders(found.order.id); await saveOrders(); renderDetail(); hydrateImages(); }
    });
  });
  hydrateImages();
}

  const it = Object.assign({
    id, itemName:'', brand:'', site:'', itemUrl:'', size:'', color:'', qty:'1', flow:'', priceTWD:'', priceUSD:'',
    directRecipient:'', directAddress:'', directGroup:'', isReturn:false, hasImage:false,
    purchasedDate:'', usReceivedDate:'', usShippedDate:'', twReceivedDate:'', customerShippedDate:'', returnDate:''
  }, item || {});
  const returnMode = order.orderType==='return' || it.isReturn;
  return `<div class="itemcard edit-item" data-itemid="${escAttr(id)}">
    <div class="itemhead">
      <div><h3>商品 ${esc(it.id)}</h3><span class="badge">${isNew?'新增商品':'可修改'}</span></div>
      <button class="btn red small" data-action="remove-edit-item" type="button">刪除商品</button>
    </div>
    <div class="formgrid">
      <div class="field"><label>商品圖片</label>${thumbHTML(it)}<label class="upload-btn" style="margin-top:8px">更換圖片<input type="file" accept="image/*" style="display:none" onchange="previewNewItemImage(this,'${escAttr(id)}')"></label></div>
      <div class="field"><label>商品名稱（選填）</label><input class="input" data-field="itemName" value="${escAttr(it.itemName)}" placeholder="可以空白，有圖片也可以"></div>
      <div class="field"><label>品牌</label><select data-field="brand">${editOptions(BRANDS,it.brand)}</select></div>
      <div class="field"><label>訂購網站</label><select data-field="site">${editOptions(SITES,it.site)}</select></div>
      <div class="field"><label>商品網址</label><input class="input" data-field="itemUrl" value="${escAttr(it.itemUrl)}"></div>
      <div class="field"><label>Size</label><input class="input" data-field="size" value="${escAttr(it.size)}"></div>
      <div class="field"><label>顏色</label><input class="input" data-field="color" value="${escAttr(it.color)}"></div>
      <div class="field"><label>數量</label><input class="input" data-field="qty" type="number" value="${escAttr(it.qty||1)}"></div>
      <div class="field normalOnly"><label>流向</label><select data-field="flow" onchange="toggleFlowDirect(this)"><option value="">（請選擇）</option>${opts(FLOWS,it.flow)}</select></div>
      <div class="field normalOnly"><label>台幣：客訂金額</label><input class="input" data-field="priceTWD" value="${escAttr(it.priceTWD)}"></div>
      <div class="field normalOnly"><label>美金：買貨金額</label><input class="input" data-field="priceUSD" value="${escAttr(it.priceUSD)}"></div>
      <div class="field normalOnly"><label>是否退貨</label><select data-field="isReturn" onchange="toggleEditReturnFields(this)"><option value="false" ${!it.isReturn?'selected':''}>否</option><option value="true" ${it.isReturn?'selected':''}>是</option></select></div>
    </div>
    <div class="directbox" style="display:${it.flow==='直郵'?'block':'none'}"><b>直郵資訊</b><div class="formgrid" style="margin-top:10px">
      <div class="field"><label>直郵收件人</label><input class="input" data-field="directRecipient" value="${escAttr(it.directRecipient)}"></div>
      <div class="field"><label>直郵地址</label><input class="input" data-field="directAddress" value="${escAttr(it.directAddress)}"></div>
      <div class="field"><label>直郵分組</label><input class="input" data-field="directGroup" value="${escAttr(it.directGroup)}"></div>
    </div></div>
    <div class="formgrid" style="margin-top:12px">
      <div class="field"><label>購買日期</label><input class="input" data-field="purchasedDate" type="date" value="${escAttr(it.purchasedDate)}"></div>
      <div class="field"><label>美國收貨日期</label><input class="input" data-field="usReceivedDate" type="date" value="${escAttr(it.usReceivedDate)}"></div>
      <div class="field"><label>美國出貨日期</label><input class="input" data-field="usShippedDate" type="date" value="${escAttr(it.usShippedDate)}"></div>
      <div class="field twOnly"><label>台灣收貨日期</label><input class="input" data-field="twReceivedDate" type="date" value="${escAttr(it.twReceivedDate)}"></div>
      <div class="field twOnly"><label>台灣出貨給客人日期</label><input class="input" data-field="customerShippedDate" type="date" value="${escAttr(it.customerShippedDate)}"></div>
      <div class="field returnOnly"><label>退貨日期</label><input class="input" data-field="returnDate" type="date" value="${escAttr(it.returnDate)}"></div>
    </div>
  </div>`;
}

function toggleEditReturnFields(sel){
  const card = sel.closest('.edit-item');
  if(!card) return;
  const isRet = sel.value === 'true';
  card.querySelectorAll('.normalOnly').forEach(el=>{ if(el.querySelector('[data-field="isReturn"]')) return; el.style.display = isRet ? 'none' : ''; });
  card.querySelectorAll('.twOnly').forEach(el=>el.style.display = isRet ? 'none' : '');
  card.querySelectorAll('.returnOnly').forEach(el=>el.style.display = isRet ? '' : 'none');
}

function renderEditOrder(order, options){
  const isReturnOrder = order.orderType === 'return';
  const custBox = isReturnOrder ? '' : `<div class="card" style="margin-top:16px"><h2>客人資料</h2>
    <div class="formgrid">
      <div class="field"><label>客人姓名</label><input class="input" id="editCustomerName" value="${escAttr(order.customerName)}"></div>
      <div class="field"><label>電話</label><input class="input" id="editPhone" value="${escAttr(order.phone)}"></div>
      <div class="field"><label>LINE ID</label><input class="input" id="editLineId" value="${escAttr(order.lineId)}"></div>
      <div class="field"><label>台灣收件人</label><input class="input" id="editTwRecipient" value="${escAttr(order.twRecipient)}"></div>
      <div class="field"><label>台灣電話</label><input class="input" id="editTwPhone" value="${escAttr(order.twPhone)}"></div>
      <div class="field"><label>台灣地址</label><input class="input" id="editTwAddress" value="${escAttr(order.twAddress)}"></div>
    </div></div>`;
  document.getElementById('detailContent').innerHTML = `
  <div class="card">
    <h2>修改訂單</h2>
    <div class="note">客人改資料或改商品時，在這裡修改後按「儲存修改」。商品若改成退貨，會自動從原本訂單拆出來，建立成獨立退貨訂單。</div>
    <div class="toolbar">
      <select id="detailOrderSelect" style="max-width:420px">${options}</select>
      <button class="btn secondary" id="cancelEditOrderBtn">取消修改</button>
      <button class="btn green" id="saveEditOrderBtn">儲存修改</button>
    </div>
  </div>
  ${custBox}
  <div class="card" style="margin-top:16px">
    <h2>商品品項</h2>
    <div id="editItemsWrap">${order.items.map(it=>editItemCardHTML(it,order)).join('')}</div>
    <button class="btn" id="addEditItemBtn">＋ 新增商品</button>
  </div>`;
  const sel = document.getElementById('detailOrderSelect');
  if(sel) sel.addEventListener('change', e=>{ detailSelectedId = e.target.value; detailEditing=false; renderDetail(); hydrateImages(); });
  document.getElementById('cancelEditOrderBtn').addEventListener('click', ()=>{ detailEditing=false; renderDetail(); hydrateImages(); });
  document.getElementById('saveEditOrderBtn').addEventListener('click', saveEditOrder);
  document.getElementById('addEditItemBtn').addEventListener('click', ()=>{
    const wrap = document.getElementById('editItemsWrap');
    wrap.insertAdjacentHTML('beforeend', editItemCardHTML(null, order));
    hydrateImages(wrap.lastElementChild);
  });
  document.querySelectorAll('[data-action="remove-edit-item"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.currentTarget.closest('.edit-item');
      const remaining = document.querySelectorAll('#editItemsWrap .edit-item').length;
      if(remaining <= 1){ alert('至少要保留一個商品'); return; }
      if(confirm('確定要刪除這個商品嗎？')) card.remove();
    });
  });
  document.querySelectorAll('.edit-item [data-field="isReturn"]').forEach(sel=>toggleEditReturnFields(sel));
  hydrateImages();
}

async function saveEditOrder(){
  const order = findOrder(detailSelectedId);
  if(!order) return;
  if(order.orderType === 'customer'){
    const name = (document.getElementById('editCustomerName')||{}).value || '';
    if(!name.trim()){ alert('請填寫客人姓名'); return; }
    order.customerName = name.trim();
    order.phone = (document.getElementById('editPhone')||{}).value || '';
    order.lineId = (document.getElementById('editLineId')||{}).value || '';
    order.twRecipient = (document.getElementById('editTwRecipient')||{}).value || '';
    order.twPhone = (document.getElementById('editTwPhone')||{}).value || '';
    order.twAddress = (document.getElementById('editTwAddress')||{}).value || '';
  }
  const cards = document.querySelectorAll('#editItemsWrap .edit-item');
  const newItems = [];
  const uploadJobs = [];
  cards.forEach(card=>{
    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
    const itemName = get('itemName').trim();
    const id = card.dataset.itemid || uidItem();
    if(!itemHasEnoughInfo(card, id)) return;
    const isRet = order.orderType === 'return' || get('isReturn') === 'true';
    const flow = isRet ? '' : get('flow');
    const old = (order.items||[]).find(i=>i.id===id) || {};
    const item = Object.assign({}, old, {
      id,
      itemName,
      brand: get('brand'),
      site: get('site'),
      itemUrl: get('itemUrl'),
      size: get('size'),
      color: get('color'),
      qty: get('qty') || '1',
      flow,
      priceTWD: isRet ? '' : get('priceTWD'),
      priceUSD: isRet ? '' : get('priceUSD'),
      directRecipient: flow==='直郵'?get('directRecipient'):'',
      directAddress: flow==='直郵'?get('directAddress'):'',
      directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: isRet,
      purchasedDate: get('purchasedDate'),
      usReceivedDate: get('usReceivedDate'),
      usShippedDate: get('usShippedDate'),
      twReceivedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('twReceivedDate'),
      customerShippedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('customerShippedDate'),
      returnDate: isRet ? get('returnDate') : ''
    });
    if(pendingImageFiles[id]){
      item.hasImage = true;
      uploadJobs.push({itemId:id, file:pendingImageFiles[id]});
    }
    newItems.push(item);
  });
  if(newItems.length===0){ alert('至少要有一個商品：可以只上傳圖片，商品名稱可空白'); return; }
  order.items = newItems;
  splitReturnItemsIntoSeparateOrders(order.id);
  await saveOrders();
  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();
  alert('訂單已更新');
  detailEditing = false;
  renderDetail();
  hydrateImages();
}

  if(e.key === 'Enter' && document.getElementById('loginScreen') && document.getElementById('loginScreen').style.display !== 'none') loginWithEmail();
});
initAuth();
