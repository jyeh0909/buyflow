async function loginWithEmail(){

      method:'POST', headers:{'Content-Type':'application/json'},

    });

    const data = await res.json();
    currentUser = { email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn||'3600')*1000) };
    setStoredUser(currentUser);
    document.getElementById('loginScreen').style.display='none';

async function fsGetDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('資料庫讀取失敗（HTTP ' + res.status + '）');
  const data = await res.json();
  return data.fields || null;
}
async function fsSetDoc(collection, docId, fieldName, stringValue){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields: { [fieldName]: { stringValue } } })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}
async function fsSetFieldsDoc(collection, docId, values){
  const fields = {};
  Object.keys(values || {}).forEach(key => {
    fields[key] = { stringValue: String(values[key] == null ? '' : values[key]) };
  });
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}

async function fsDeleteDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { method: 'DELETE', headers: authHeaders() });
  return res.ok;
}


// ====== v85 增量儲存層 ======
// 日常操作只寫入有變更的訂單 document；不再每 4 秒下載整包資料，也不在每次修改後立刻重寫整包 orders。
// 舊版 app-data/main 僅在使用者閒置一段時間後做一次相容性快照，避免阻塞操作。
const FAST_ORDER_COLLECTION = 'buyflow-orders';
const FAST_STATE_COLLECTION = 'buyflow-state';
const FAST_META_COLLECTION = 'buyflow-meta';
const FAST_META_DOC = 'orders';
let legacySyncTimer = null;
let legacySyncRunning = false;
let legacySyncDirty = false;
let fastOrderBaseline = new Map();
let lastFastStateJson = '';
let lastFastMetaVersion = '';
let fastPollRunning = false;
const FAST_SAVE_TIMEOUT_MS = 12000;

function fastOrderDocId(orderId){
  return String(orderId || '').replace(/[^A-Za-z0-9_-]/g, '_');
}

async function fsSetFieldsDocFast(collection, docId, values, timeoutMs=FAST_SAVE_TIMEOUT_MS){
  const fields = {};
  Object.keys(values || {}).forEach(key => { fields[key] = { stringValue: String(values[key] == null ? '' : values[key]) }; });
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
      method:'PATCH',
      headers:{'Content-Type':'application/json', ...authHeaders()},
      body:JSON.stringify({fields}),
      signal:controller.signal
    });
    if(!res.ok){
      const errText=await res.text().catch(()=> '');
      throw new Error('資料庫寫入失敗（HTTP '+res.status+'）'+(errText?'：'+errText.slice(0,200):''));
    }
    return true;
  }catch(e){
    if(e && e.name==='AbortError') throw new Error('資料庫回應超過 12 秒，已停止等待。請檢查網路後再試一次。');
    throw e;
  }finally{ clearTimeout(timer); }
}
function orderFingerprint(order){
  try{return JSON.stringify(order||{});}catch(e){return '';}
}
function captureFastBaseline(){
  fastOrderBaseline = new Map((orders||[]).filter(o=>o&&o.id).map(o=>[o.id,orderFingerprint(o)]));
}
async function saveOrderFast(order){
  if(!order || !order.id) throw new Error('找不到要儲存的訂單');
  if(!dbReady){ fastOrderBaseline.set(order.id, orderFingerprint(order)); return true; }
  const started = performance.now();
  await fsSetFieldsDocFast(FAST_ORDER_COLLECTION, fastOrderDocId(order.id), {
    orderId: order.id,
    orderJson: JSON.stringify(order),
    updatedAt: new Date().toISOString(),
    updatedBy: (currentUser && currentUser.email) || 'unknown'
  });
  fastOrderBaseline.set(order.id, orderFingerprint(order));
  console.log(`[BuyFlow v85] Order save ${order.id}: ${Math.round(performance.now()-started)} ms`);
  return true;
}

  if(!dbReady) return;
  const version = Date.now()+'-'+Math.random().toString(36).slice(2,7);
  try{
    await fsSetFieldsDocFast(FAST_META_COLLECTION, FAST_META_DOC, {version, updatedAt:new Date().toISOString()}, 8000);

  }catch(e){ console.warn('更新同步版本失敗（不影響訂單已儲存）',e); }

  const stateJson = JSON.stringify({deletedOrders, activityLog});
  if(stateJson===lastFastStateJson) return;
  try{
    await fsSetFieldsDocFast(FAST_STATE_COLLECTION,'main',{
      deletedOrdersJson:JSON.stringify(deletedOrders),
      activityLogJson:JSON.stringify(activityLog),
      updatedAt:new Date().toISOString()

  }catch(e){ console.warn('回收桶／活動紀錄背景儲存失敗',e); }
}
async function overlayFastState(){
  if(!dbReady) return;
  try{
    const f=await fsGetDoc(FAST_STATE_COLLECTION,'main');
    if(!f) return;
    const dj=(f.deletedOrdersJson&&f.deletedOrdersJson.stringValue)||'';
    const aj=(f.activityLogJson&&f.activityLogJson.stringValue)||'';
    if(dj) deletedOrders=JSON.parse(dj);
    if(aj) activityLog=JSON.parse(aj);
    lastFastStateJson=JSON.stringify({deletedOrders,activityLog});
  }catch(e){ console.warn('快速狀態讀取失敗，沿用舊資料',e); }
}
async function fsListCollectionDocs(collection){
  const docs=[];
  let token='';
  do{
    const url = `${FS_BASE}/${collection}?pageSize=500${token ? '&pageToken='+encodeURIComponent(token) : ''}&key=${FS_KEY}`;
    const res = await fetch(url, { headers: authHeaders() });
    if(res.status===404) return docs;
    if(!res.ok) throw new Error('資料庫清單讀取失敗（HTTP '+res.status+'）');
    const data=await res.json();
    (data.documents||[]).forEach(d=>docs.push(d));
    token=data.nextPageToken||'';
  }while(token);
  return docs;
}

async function overlayFastOrders(){
  if(!dbReady) return;
  try{
    const docs = await fsListCollectionDocs(FAST_ORDER_COLLECTION);
    if(!docs.length) return;
    const byId = new Map((orders||[]).map(o=>[o.id,o]));
    let changed=false;
    docs.forEach(d=>{
      try{
        const fields=d.fields||{};
        const raw=(fields.orderJson&&fields.orderJson.stringValue)||'';
        if(!raw) return;
        const fast=JSON.parse(raw);
        if(!fast || !fast.id) return;
        byId.set(fast.id, fast);
        changed=true;
      }catch(e){ console.warn('忽略無法解析的快速訂單資料',e); }
    });
    if(changed){
      const originalIds=(orders||[]).map(o=>o.id);
      const merged=[];
      originalIds.forEach(id=>{ if(byId.has(id)){ merged.push(byId.get(id)); byId.delete(id); } });
      byId.forEach(o=>merged.unshift(o));
      orders=merged;
      captureFastBaseline();
      console.log(`[BuyFlow v85] Loaded ${docs.length} order documents`);
    }
  }catch(e){
    console.warn('快速訂單覆蓋讀取失敗，改用舊資料',e);
  }
}

function scheduleLegacySync(delay=300000){

  legacySyncDirty=true;

  legacySyncTimer=setTimeout(flushLegacySync, Math.max(delay,300000));
}
async function saveLegacySnapshot(){
  if(!dbReady) return true;
  const json=JSON.stringify(orders), deletedJson=JSON.stringify(deletedOrders), logJson=JSON.stringify(activityLog);

  lastOrdersJson=json+'|'+deletedJson+'|'+logJson;
  return true;
}
async function flushLegacySync(){
  if(legacySyncRunning || !legacySyncDirty || document.visibilityState==='hidden') return;
  legacySyncRunning=true; legacySyncDirty=false;
  try{
    const started=performance.now();
    await saveLegacySnapshot();
    console.log(`[BuyFlow v85] Idle compatibility snapshot: ${Math.round(performance.now()-started)} ms`);
  }catch(e){ console.warn('閒置完整快照失敗，下次再試',e); legacySyncDirty=true; }
  finally{ legacySyncRunning=false; if(legacySyncDirty) scheduleLegacySync(300000); }
}

function autocompleteSource(name){
  const src = name==='brands' ? BRANDS : SITES;
  // v81: case-insensitive de-duplication, preserving the first canonical spelling.
  const seen = new Set();
  return src.filter(x=>{ const k=String(x).trim().toLocaleLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}
function resolveAutocompleteValue(value, source){
  source = [...new Map((source||[]).map(x=>[String(x).trim().toLocaleLowerCase(), x])).values()];
  const raw=String(value||'').trim();
  if(!raw) return {value:'', needsChoice:false};
  const q=raw.toLocaleLowerCase();
  const exact=source.find(x=>x.toLocaleLowerCase()===q);
  if(exact) return {value:exact, needsChoice:false};
  const matches=source.filter(x=>x.toLocaleLowerCase().startsWith(q) || x.toLocaleLowerCase().includes(q));
  if(matches.length===1) return {value:matches[0], needsChoice:false};
  return {value:raw, needsChoice:matches.length>0, matches};
}
function normalizeAutocompleteInput(input, showMessage=false){
  const wrap=input && input.closest('.mobile-autocomplete');
  if(!wrap) return true;
  const source=autocompleteSource(wrap.dataset.autocompleteSource);
  const result=resolveAutocompleteValue(input.value, source);
  if(!result.needsChoice){
    input.value=result.value;
    return true;
  }
  if(showMessage){
    alert(`「${input.value.trim()}」符合多個既有選項，請從下拉選單選擇正確的名稱，避免產生重複資料。`);
    input.focus();

}
function closeAutocomplete(except){

}
function updateAutocomplete(input){
  const wrap=input.closest('.mobile-autocomplete');
  if(!wrap) return;
  const list=wrap.querySelector('.mobile-autocomplete-list');
  const source=autocompleteSource(wrap.dataset.autocompleteSource);
  const q=(input.value||'').trim().toLocaleLowerCase();
  let matches=source.filter(x=>!q || x.toLocaleLowerCase().startsWith(q));
  if(q && matches.length<10){
    const extra=source.filter(x=>x.toLocaleLowerCase().includes(q) && !matches.includes(x));
    matches=matches.concat(extra);
  }
  matches=matches.slice(0,12);
  list.innerHTML=matches.length ? matches.map(x=>`<button type="button" class="mobile-autocomplete-option" data-value="${escAttr(x)}">${esc(x)}</button>`).join('') : `<div class="mobile-autocomplete-empty">沒有符合的既有選項，可保留目前輸入內容</div>`;
  closeAutocomplete(list);
  list.classList.add('open');
}

function splitReturnItemsIntoSeparateOrders(preferredDetailId){
  // 只要客人訂單中的某個商品被標記為退貨，就把該商品拆成獨立退貨訂單。
  // 這樣原本客人的訂單只保留正常商品；退貨商品會走自己的退貨流程。
  let changed = false;
  const newReturnOrders = [];

  orders.forEach(order => {
    if(order.orderType !== 'customer' || !Array.isArray(order.items)) return;
    const keepItems = [];
    order.items.forEach(item => {
      if(item && item.isReturn){
        changed = true;
        const returnItem = Object.assign({}, item, {
          isReturn: true,
          purchasedDate: item.purchasedDate || order.createdAt || todayStr(),
          returnSourceOrderId: item.returnSourceOrderId || order.id,
          returnSourceCustomerName: item.returnSourceCustomerName || order.customerName || '',
          flow: '',
          priceTWD: '',
          priceUSD: '',
          twReceivedDate: '',
          customerShippedDate: '',
          directRecipient: '',
          directAddress: '',
          directGroup: ''
        });
        newReturnOrders.push({
          id: uidOrder(),
          orderType: 'return',
          createdAt: todayStr(),
          sourceOrderId: order.id,
          sourceCustomerName: order.customerName || '',
          customerName: '', phone: '', lineId: '', twRecipient: '', twPhone: '', twAddress: '',
          paymentsReceived: 0,
          items: [returnItem]
        });
      }else{
        keepItems.push(item);
      }
    });
    order.items = keepItems;
  });

  if(changed){
    // 移除已經沒有任何商品的原訂單，避免留下空訂單。
    orders = orders.filter(o => o.orderType !== 'customer' || (Array.isArray(o.items) && o.items.length > 0));
    orders.unshift(...newReturnOrders);
    if(preferredDetailId && !findOrder(preferredDetailId) && newReturnOrders.length){
      detailSelectedId = newReturnOrders[0].id;
    }
  }
  return changed;
}

async function convertItemToReturn(itemId){
  const found = findItem(itemId);
  if(!found){ alert('找不到這個商品'); return; }
  const item = found.item;
  const sourceOrder = found.order;
  if(item.isReturn || sourceOrder.orderType === 'return'){
    alert('這個商品已經在退貨流程中');
    return;
  }
  const shippedQty = usShippedQty(item);
  if(shippedQty > 0){
    alert('這個商品已有 ' + shippedQty + ' 件從美國出貨，不能直接轉為退貨。請先確認實際貨況後再處理。');
    return;
  }
  const totalQty = itemTotalQty(item);
  const qtyText = prompt(`這個商品共有 ${totalQty} 件，請輸入要退貨的數量`, String(totalQty));
  if(qtyText === null) return;
  const returnQty = parseInt(qtyText, 10);
  if(!Number.isFinite(returnQty) || returnQty < 1 || returnQty > totalQty){
    alert(`退貨數量必須介於 1 到 ${totalQty} 件`);
    return;
  }
  const receivedQty = usReceivedQty(item);
  const stageText = receivedQty > 0
    ? `Jen 已收到 ${receivedQty}/${totalQty} 件。退貨商品會依實際已收到數量進入退貨頁。`
    : `商品已購買但尚未收到；退貨部分仍會先留在「美國收貨」，收到後才進入「退貨」頁。`;
  if(!confirm(`確定要把「${itemDisplayName(item)}」中的 ${returnQty} 件轉為退貨嗎？\n\n${stageText}\n原本的購買與美國收貨紀錄都會保留。`)) return;

  const sourceOrderId = sourceOrder.id;
  const sourceCustomerName = sourceOrder.customerName || '';
  const userEmail = currentUser && currentUser.email ? currentUser.email : '未知使用者';

  let returnItem;
  if(returnQty === totalQty){
    returnItem = item;
    returnItem.isReturn = true;
  }else{
    returnItem = JSON.parse(JSON.stringify(item));
    returnItem.id = uidItem();
    returnItem.qty = String(returnQty);
    returnItem.isReturn = true;
    returnItem.returnQty = returnQty;

    // 原訂單保留未退貨數量。
    item.qty = String(totalQty - returnQty);
    item.returnQty = 0;

    // 依照已收到數量，把相對應數量分配到退貨商品；其餘保留在原商品。
    const returnReceivedQty = Math.min(returnQty, receivedQty);
    const remainReceivedQty = Math.max(0, receivedQty - returnReceivedQty);
    const split = splitStageHistoryForQty(item.usReceipts || [], returnReceivedQty);
    returnItem.usReceipts = split.taken;
    item.usReceipts = split.remaining;
    returnItem.usReceivedQty = returnReceivedQty;
    item.usReceivedQty = remainReceivedQty;
    returnItem.usReceivedDate = returnItem.usReceipts.length ? returnItem.usReceipts[returnItem.usReceipts.length-1].date : (returnReceivedQty ? item.usReceivedDate : '');
    item.usReceivedDate = item.usReceipts.length ? item.usReceipts[item.usReceipts.length-1].date : (remainReceivedQty ? item.usReceivedDate : '');

    // 退貨商品尚未出貨回台灣；原商品的未來流程保持不變。
    returnItem.usShippedQty = 0;
    returnItem.usShippedDate = '';
    returnItem.usShipments = [];
    returnItem.twReceivedQty = 0;
    returnItem.twReceivedDate = '';
    returnItem.twReceipts = [];
    returnItem.customerShippedQty = 0;
    returnItem.customerShippedDate = '';
    returnItem.customerShipments = [];

    sourceOrder.items.push(returnItem);
  }

  returnItem.purchasedDate = returnItem.purchasedDate || sourceOrder.createdAt || todayStr();
  returnItem.convertedToReturnAt = localDateTimeStr();
  returnItem.convertedToReturnBy = userEmail;
  returnItem.returnSourceOrderId = sourceOrderId;
  returnItem.returnSourceCustomerName = sourceCustomerName;
  returnItem.returnQty = returnQty;
  returnItem.flow = '';
  returnItem.priceTWD = '';
  returnItem.priceUSD = '';
  returnItem.twReceivedDate = '';
  returnItem.customerShippedDate = '';
  returnItem.twReceipts = [];
  returnItem.customerShipments = [];
  returnItem.directRecipient = '';
  returnItem.directAddress = '';
  returnItem.directGroup = '';

  splitReturnItemsIntoSeparateOrders(sourceOrderId);
  const returnOrder = orders.find(o => o.orderType === 'return' && (o.items||[]).some(i => i.id === returnItem.id));
  if(returnOrder) detailSelectedId = returnOrder.id;
  logActivity('商品轉為退貨', `${itemDisplayName(returnItem)}（${returnItem.id}）退貨 ${returnQty} 件，從訂單 ${sourceOrderId}${sourceCustomerName ? '／客人 '+sourceCustomerName : ''} 拆出並進入退貨流程`);
  await saveOrders();
  detailEditing = false;
  show('detail');
  alert(`已將 ${returnQty} 件轉為退貨。原本的購買日期與美國收貨紀錄已保留。`);
}

function splitStageHistoryForQty(history, takeQty){
  const source = Array.isArray(history) ? history.map(x=>({date:String(x.date||''), qty:Number(x.qty)||0, user:String(x.user||'')})).filter(x=>x.qty>0) : [];
  const taken = [];
  const remaining = [];
  let need = Math.max(0, Number(takeQty)||0);
  for(const row of source){
    if(need <= 0){ remaining.push({...row}); continue; }
    const use = Math.min(row.qty, need);
    if(use > 0) taken.push({date:row.date, qty:use, user:row.user||''});
    if(row.qty > use) remaining.push({date:row.date, qty:row.qty-use, user:row.user||''});
    need -= use;
  }
  return {taken, remaining};
}

function itemTotalQty(item){
  const n = parseInt(item && item.qty, 10);
  return Number.isFinite(n) && n > 0 ? n : 1;
}
function itemStageQty(item, key, legacyDateKey){
  const explicit = Number(item && item[key]);
  if(Number.isFinite(explicit) && explicit >= 0) return Math.min(explicit, itemTotalQty(item));
  return item && item[legacyDateKey] ? itemTotalQty(item) : 0;
}
function purchasedQty(item){ return item && item.purchasedDate ? itemTotalQty(item) : 0; }
function usReceivedQty(item){ return itemStageQty(item, 'usReceivedQty', 'usReceivedDate'); }
function usShippedQty(item){ return itemStageQty(item, 'usShippedQty', 'usShippedDate'); }
function twReceivedQty(item){ return itemStageQty(item, 'twReceivedQty', 'twReceivedDate'); }
function customerShippedQty(item){ return itemStageQty(item, 'customerShippedQty', 'customerShippedDate'); }

function stageHistory(item, arrayKey, legacyDateKey, qtyGetter){
  if(!Array.isArray(item[arrayKey])) item[arrayKey]=[];
  item[arrayKey] = item[arrayKey]
    .filter(x=>x && Number(x.qty)>0)
    .map(x=>({date:String(x.date||''), qty:Number(x.qty)||0, user:String(x.user||'')}));
  const totalQty = qtyGetter(item);
  const recordedQty = item[arrayKey].reduce((sum,x)=>sum + (Number(x.qty)||0), 0);
  // 舊資料沒有逐批紀錄時只能用舊的總日期補一筆；之後可直接按「修改」校正日期。
  if(totalQty > recordedQty){
    item[arrayKey].push({date:item[legacyDateKey]||'', qty:totalQty-recordedQty, user:''});
  }
  return item[arrayKey];
}
function appendStageEvent(item, arrayKey, legacyDateKey, qtyGetter, date, qty){
  if(!Array.isArray(item[arrayKey])) item[arrayKey]=[];
  if(item[arrayKey].length===0){
    const previousQty=qtyGetter(item);
    const previousDate=item[legacyDateKey]||'';
    if(previousQty>0) item[arrayKey].push({date:previousDate,qty:previousQty,user:''});
  }
  // 每次操作都以當下輸入的日期新增獨立紀錄，不覆蓋前一筆。
  item[arrayKey].push({date:String(date||todayStr()),qty:Number(qty)||0,user:(currentUser&&currentUser.email)||'unknown'});
}
function usReceiptHistory(item){ return stageHistory(item,'usReceipts','usReceivedDate',usReceivedQty); }
function usShipmentHistory(item){ return stageHistory(item,'usShipments','usShippedDate',usShippedQty); }
function twReceiptHistory(item){ return stageHistory(item,'twReceipts','twReceivedDate',twReceivedQty); }
function customerShipmentHistory(item){ return stageHistory(item,'customerShipments','customerShippedDate',customerShippedQty); }
function stageHistoryHTML(history, title, itemId, arrayKey){

}
function shipmentHistoryHTML(item){ return stageHistoryHTML(customerShipmentHistory(item),'已出貨紀錄',item.id,'customerShipments'); }
async function editStageHistory(itemId,arrayKey,index,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const found=findItem(itemId); if(!found) return;
  const map={
    usReceipts:{dateKey:'usReceivedDate',qtyKey:'usReceivedQty'},
    usShipments:{dateKey:'usShippedDate',qtyKey:'usShippedQty'},
    twReceipts:{dateKey:'twReceivedDate',qtyKey:'twReceivedQty'},
    customerShipments:{dateKey:'customerShippedDate',qtyKey:'customerShippedQty'}
  };
  const cfg=map[arrayKey]; if(!cfg) return;
  if(!Array.isArray(found.item[arrayKey]) || !found.item[arrayKey][index]) return;
  const row=found.item[arrayKey][index];
  const date=prompt('請輸入正確日期（YYYY-MM-DD）',row.date||todayStr());
  if(date===null) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('日期格式請使用 YYYY-MM-DD');return;}
  const qtyText=prompt('請輸入這一次的件數',String(row.qty||1));
  if(qtyText===null) return;
  const qty=parseInt(qtyText,10);
  if(!Number.isFinite(qty)||qty<1){alert('件數必須大於 0');return;}
  const otherTotal=found.item[arrayKey].reduce((sum,x,j)=>sum+(j===index?0:(Number(x.qty)||0)),0);
  if(otherTotal+qty>itemTotalQty(found.item)){alert('歷史紀錄總件數不能超過商品總數量');return;}
  found.item[arrayKey][index]={date,qty,user:row.user||((currentUser&&currentUser.email)||'unknown')};
  const total=found.item[arrayKey].reduce((sum,x)=>sum+(Number(x.qty)||0),0);
  found.item[cfg.qtyKey]=total;
  const latest=found.item[arrayKey].filter(x=>x.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
  found.item[cfg.dateKey]=latest?latest.date:'';
  logActivity(`修改${arrayKey}歷史：第 ${index+1} 次 ${date} ${qty} 件`,found.order.id);
  await saveOrders();
  renderSection(currentSection); hydrateImages();
}


async function deleteStageHistory(itemId,arrayKey,index,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const found=findItem(itemId); if(!found) return;
  const map={
    usReceipts:{dateKey:'usReceivedDate',qtyKey:'usReceivedQty',label:'美國收貨',downstream:()=>usShippedQty(found.item)},
    usShipments:{dateKey:'usShippedDate',qtyKey:'usShippedQty',label:'美國出貨',downstream:()=>twReceivedQty(found.item)},
    twReceipts:{dateKey:'twReceivedDate',qtyKey:'twReceivedQty',label:'台灣收貨',downstream:()=>customerShippedQty(found.item)},
    customerShipments:{dateKey:'customerShippedDate',qtyKey:'customerShippedQty',label:'寄給客人',downstream:()=>0}
  };
  const cfg=map[arrayKey]; if(!cfg) return;
  if(!Array.isArray(found.item[arrayKey]) || !found.item[arrayKey][index]) return;
  const row=found.item[arrayKey][index];
  const newTotal=found.item[arrayKey].reduce((sum,x,j)=>sum+(j===index?0:(Number(x.qty)||0)),0);
  const downstream=Number(cfg.downstream())||0;
  if(newTotal < downstream){
    alert(`不能撤銷這筆${cfg.label}紀錄，因為後續流程已有 ${downstream} 件。請先撤銷後續的物流紀錄。`);
    return;
  }
  if(!confirm(`確定要撤銷這筆${cfg.label}紀錄嗎？\n日期：${row.date||'未填'}\n數量：${row.qty||0} 件`)) return;
  found.item[arrayKey].splice(index,1);
  const total=found.item[arrayKey].reduce((sum,x)=>sum+(Number(x.qty)||0),0);
  found.item[cfg.qtyKey]=total;
  const latest=found.item[arrayKey].filter(x=>x.date).slice().sort((a,b)=>a.date.localeCompare(b.date)).pop();
  found.item[cfg.dateKey]=latest?latest.date:'';
  logActivity(`撤銷${cfg.label}紀錄：${row.date||'未填日期'} ${row.qty||0} 件`,found.order.id,found.item.id);
  await saveOrders();
  renderSection(currentSection); hydrateImages();
}

async function clearSimpleDate(itemId,key,label,event){
  if(event){event.stopPropagation();event.preventDefault();}
  const found=findItem(itemId); if(!found || !found.item[key]) return;
  const downstreamMap={
    purchasedDate:()=>usReceivedQty(found.item),
    returnDate:()=>0
  };
  const downstream=downstreamMap[key]?Number(downstreamMap[key]())||0:0;
  if(downstream>0){alert(`不能撤銷${label}，因為後續流程已有 ${downstream} 件。請先撤銷後續物流紀錄。`);return;}
  const oldDate=found.item[key];

async function saveOrders(addGenericLog=true, throwOnError=false){
  if(addGenericLog) logActivity('更新資料', currentSection || '');
  if(!dbReady) return true;
  try{
    const currentById=new Map((orders||[]).filter(o=>o&&o.id).map(o=>[o.id,o]));
    const changed=[];
    currentById.forEach((o,id)=>{ if(fastOrderBaseline.get(id)!==orderFingerprint(o)) changed.push(o); });
    const removed=[];
    fastOrderBaseline.forEach((_fp,id)=>{ if(!currentById.has(id)) removed.push(id); });
    const started=performance.now();
    if(changed.length) await Promise.all(changed.map(saveOrderFast));
    if(removed.length){
      await Promise.all(removed.map(id=>fsDeleteDoc(FAST_ORDER_COLLECTION,fastOrderDocId(id))));
      removed.forEach(id=>fastOrderBaseline.delete(id));
    }
    console.log(`[BuyFlow v85] Incremental save: ${changed.length} changed, ${removed.length} removed, ${Math.round(performance.now()-started)} ms`);
    connectionError='';
    // 不阻塞 UI 的小型狀態／同步標記。
    Promise.allSettled([saveFastStateBackground(), touchFastMeta()]);
    scheduleLegacySync(300000);
    return true;
  }catch(e){
    console.error('儲存發生錯誤', e);
    connectionError=e&&e.message?e.message:String(e);
    if(throwOnError) throw e;
    return false;
  }
}

function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('無法解析這張圖片的格式'));
    img.src = src;
  });
}
function drawToDataURL(srcW, srcH, drawFn){
  const maxDim = 900;
  let w = srcW, h = srcH;
  if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, w, h);
  return canvas.toDataURL('image/jpeg', 0.7);
}
async function compressImage(file){
  try{
    const bitmap = await createImageBitmap(file);
    const dataUrl = drawToDataURL(bitmap.width, bitmap.height, (ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h));
    bitmap.close && bitmap.close();
    return dataUrl;
  }catch(e1){
    try{
      const rawDataUrl = await readFileAsDataURL(file);
      const img = await loadImageEl(rawDataUrl);
      return drawToDataURL(img.naturalWidth, img.naturalHeight, (ctx,w,h)=>ctx.drawImage(img,0,0,w,h));
    }catch(e2){
      const rawDataUrl = await readFileAsDataURL(file).catch(()=>null);
      if(rawDataUrl && rawDataUrl.length < 4000000) return rawDataUrl;
      throw new Error('這張圖片的格式或大小無法處理，建議改用 JPG / PNG 格式，或先縮小照片再上傳');
    }
  }
}
async function makeThumbnailDataURL(source, maxSize=180){
  const img = typeof source === 'string' ? await loadImageEl(source) : source;
  const sw = img.naturalWidth || img.width;
  const sh = img.naturalHeight || img.height;
  if(!sw || !sh) throw new Error('無法建立縮圖');
  const scale = Math.min(1, maxSize / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * scale));
  const h = Math.max(1, Math.round(sh * scale));
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', 0.62);
}
async function uploadImageForItem(itemId, file){
  if(!dbReady) return;

    const thumbDataUrl = await makeThumbnailDataURL(dataUrl, 180);

function hydrateImages(root){
  (root||document).querySelectorAll('[data-hasimage="1"]').forEach(async(el2)=>{
    const id = el2.dataset.id;
    if(!id) return;
    const useThumb = el2.dataset.thumbnail === '1';
    const cached = useThumb ? thumbnailCache[id] : imageCache[id];
    if(cached){
      el2.innerHTML = `<img src="${cached}" alt="商品圖片" loading="lazy">`;
      return;
    }
    // 先顯示固定的圖片圖示，不再卡在「載入中」。
    el2.innerHTML = '<span class="image-loading-text">🖼️</span>';
    if(!dbReady) return;
    try{
      const fields = await fsGetDoc('item-images', id);
      const full = fields && fields.dataUrl && fields.dataUrl.stringValue;
      let thumb = fields && fields.thumbDataUrl && fields.thumbDataUrl.stringValue;
      if(!full && !thumb){
        el2.classList.remove('has-photo');
        el2.removeAttribute('onclick');
        el2.innerHTML = '圖片';
        return;
      }
      if(full) imageCache[id] = full;
      if(!thumb && full){
        try{
          thumb = await makeThumbnailDataURL(full, 180);
          thumbnailCache[id] = thumb;
          fsSetFieldsDoc('item-images', id, { dataUrl: full, thumbDataUrl: thumb }).catch(()=>{});
        }catch(e){ thumb = full; }
      }
      if(thumb) thumbnailCache[id] = thumb;
      const src = useThumb ? (thumb || full) : (full || thumb);
      if(src) el2.innerHTML = `<img src="${src}" alt="商品圖片" loading="lazy">`;
      const found=findItem(id);
      if(found && !found.item.hasImage){
        found.item.hasImage=true;
        saveOrders().catch(()=>{});
      }
    }catch(e){
      // 網路或權限暫時失敗時保留圖片圖示，不顯示無限載入。
      el2.innerHTML = '<span class="image-loading-text">🖼️</span>';
    }
  });
}

    if(!item.returnDate) return { text:`Jen 已收到 ${r}/${total} 件，等待退貨`, cls:'s-return', detail:`目前已收到 ${r} 件；尚有 ${total-r} 件未收到。`, current:'退貨處理' };
    return { text:'已退貨完成', cls:'s-done', detail:'這個商品已完成退貨流程。', current:'完成' };
  }
  if(r < total) return { text:`已下單，Jen 已收到 ${r}/${total} 件`, cls:'s-buy', detail:`共訂購 ${total} 件，目前 Jen 收到 ${r} 件，仍有 ${total-r} 件等待到貨。已收到的部分可以進入美國出貨。`, current:'Jen 美國收貨 / 美國出貨' };
  if(us < total){
    const msg=item.flow==='直郵'?'等待直郵出貨':item.flow==='婷婷'?'等待美國出貨': '等待美國出貨回台灣';
    return { text:`Jen 已收齊，已出貨 ${us}/${total} 件`, cls:'s-usa', detail:`已收到全部 ${total} 件；目前從美國寄出 ${us} 件，尚有 ${total-us} 件等待出貨。`, current:msg };
  }
  if(endsAfterUSShip(item, order)) return { text:`美國已出貨 ${us}/${total} 件，流程完成`, cls:'s-done', detail:'直郵 / 婷婷商品完成美國端流程。', current:'完成' };
  if(tw < total) return { text:`美國已出貨，台灣收到 ${tw}/${total} 件`, cls:'s-ship', detail:`共 ${total} 件，台灣目前收到 ${tw} 件，尚有 ${total-tw} 件等待收貨。`, current:'台灣收貨' };
  if(cs < total) return { text:`台灣已收齊，已寄客人 ${cs}/${total} 件`, cls:'s-tw', detail:`台灣已收到全部 ${total} 件，目前已寄給客人 ${cs} 件，尚有 ${total-cs} 件可寄。`, current:'台灣出貨給客人' };
  return { text:`已寄給客人 ${cs}/${total} 件，完成`, cls:'s-done', detail:'這個商品的全部數量已完成流程。', current:'完成' };
}
function itemStatusSteps(item, order){
  const total=itemTotalQty(item);
  const base = [
    {label:`Jenna 購買（${total} 件）`, date:item.purchasedDate, done:!!item.purchasedDate},
    {label:`Jen 美國收貨（${usReceivedQty(item)}/${total} 件）`, date:item.usReceivedDate, done:usReceivedQty(item)>=total}
  ];
  if(item.isReturn){
    base.push({label:'退貨日期', date:item.returnDate, done:!!item.returnDate});
    return base;
  }
  base.push({label:`${item.flow==='直郵'?'直郵 / 美國出貨':'美國出貨'}（${usShippedQty(item)}/${total} 件）`, date:item.usShippedDate, done:usShippedQty(item)>=total});
  if(needsTwFlow(item, order)){
    base.push({label:`台灣收貨（${twReceivedQty(item)}/${total} 件）`, date:item.twReceivedDate, done:twReceivedQty(item)>=total});
    base.push({label:`台灣出貨給客人（${customerShippedQty(item)}/${total} 件）`, date:item.customerShippedDate, done:customerShippedQty(item)>=total});
  }
  return base;
}

let modalGalleryItems = [];
let modalGalleryIndex = -1;
function updateImageModalNavigation(){
  const hasMany = modalGalleryItems.length > 1;
  ['imageModalPrev','imageModalNext'].forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.toggle('show',hasMany); });
  const counter=document.getElementById('imageModalCounter');
  if(counter){ counter.classList.toggle('show',hasMany); counter.textContent=hasMany ? `${modalGalleryIndex+1} / ${modalGalleryItems.length}` : ''; }

async function openOrderImageGallery(orderId, startIndex, event){
  if(event){ event.stopPropagation(); event.preventDefault(); }
  const order=orders.find(o=>o.id===orderId);
  if(!order || !Array.isArray(order.items) || !order.items.length) return;
  modalGalleryItems=order.items.slice();
  modalGalleryIndex=Math.max(0,Math.min(Number(startIndex)||0,modalGalleryItems.length-1));
  await showModalGalleryImage();
}
async function showModalGalleryImage(){
  const item=modalGalleryItems[modalGalleryIndex];
  if(!item) return;
  let src=imageCache[item.id] || thumbnailCache[item.id] || '';
  if(!src && dbReady){
    try{ const fields=await fsGetDoc('item-images',item.id); if(fields){ src=(fields.dataUrl&&fields.dataUrl.stringValue)||(fields.thumbnailDataUrl&&fields.thumbnailDataUrl.stringValue)||''; if(src) imageCache[item.id]=src; } }catch(e){ console.error(e); }
  }
  if(!src) return;
  openImageModal(src,itemDisplayName(item));
  updateImageModalNavigation();
}
async function showPreviousModalImage(event){
  if(event){event.stopPropagation();event.preventDefault();}
  if(modalGalleryItems.length<2)return;
  modalGalleryIndex=(modalGalleryIndex-1+modalGalleryItems.length)%modalGalleryItems.length;
  await showModalGalleryImage();
}
async function showNextModalImage(event){
  if(event){event.stopPropagation();event.preventDefault();}
  if(modalGalleryItems.length<2)return;
  modalGalleryIndex=(modalGalleryIndex+1)%modalGalleryItems.length;
  await showModalGalleryImage();
}
function openImageModal(src, title){
  if(!src) return;
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('imageModalImg');
  const titleEl = document.getElementById('imageModalTitle');
  if(!modal || !img) return;
  img.src = src;
  if(titleEl) titleEl.textContent = title || '商品圖片';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}
async function openImageModalById(itemId, event){
  if(event){ event.stopPropagation(); event.preventDefault(); }
  modalGalleryItems=[]; modalGalleryIndex=-1; updateImageModalNavigation();
  const found = findItem(itemId);
  const title = found ? `${itemDisplayName(found.item)}${found.item.brand && found.item.itemName ? '｜' + found.item.brand : ''}` : '商品圖片';
  if(imageCache[itemId]){ openImageModal(imageCache[itemId], title); return; }
  if(!dbReady) return;
  try{
    const fields = await fsGetDoc('item-images', itemId);
    if(fields && fields.dataUrl && fields.dataUrl.stringValue){
      imageCache[itemId] = fields.dataUrl.stringValue;
      openImageModal(imageCache[itemId], title);
    }
  }catch(e){ console.error('讀取圖片失敗', e); }
}
function closeImageModal(event){
  if(event){ event.stopPropagation(); }
  const modal = document.getElementById('imageModal');
  const img = document.getElementById('imageModalImg');
  if(modal) modal.classList.remove('open');
  if(img) img.src = '';
  modalGalleryItems=[]; modalGalleryIndex=-1; updateImageModalNavigation();
  document.body.style.overflow = '';
}

async function saveNewOrder(){

  const orderType = returnMode ? 'return' : (stockMode ? 'stock' : 'customer');
  let customerName='', phone='', lineId='', twRecipient='', twPhone='', twAddress='';

    lineId = (document.getElementById('noLineId')||{}).value || '';
    twRecipient = (document.getElementById('noTwRecipient')||{}).value || '';
    twPhone = (document.getElementById('noTwPhone')||{}).value || '';
    twAddress = (document.getElementById('noTwAddress')||{}).value || '';

  const cards = document.querySelectorAll('#itemsWrap .itemcard');

    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';

    if(!itemHasEnoughInfo(card, itemId)) return;
    let brand = get('brand'); if(brand==='__other__') brand = get('brandOther');
    let site = get('site'); if(site==='__other__') site = get('siteOther');
    const brandResult=resolveAutocompleteValue(brand, BRANDS);
    const siteResult=resolveAutocompleteValue(site, SITES);
    if(brandResult.needsChoice || siteResult.needsChoice){
      autocompleteError=true;
      const input=card.querySelector(`[data-field="${brandResult.needsChoice?'brand':'site'}"]`);
      if(input) normalizeAutocompleteInput(input, true);
      return;
    }
    brand=brandResult.value;
    site=siteResult.value;
    const flow = returnMode ? '' : (stockMode ? get('stockFlow') : get('flow'));
    if(stockMode && !flow){ alert('囤貨商品請選擇流向：小沈、JLS 或 Jen'); return; }
    const item = {
      id: itemId, itemName, brand, site, itemUrl: get('itemUrl'), size: get('size'), color: get('color'),
      qty: get('qty') || '1', note: get('note'),
      flow, priceTWD:(returnMode||stockMode)?'':get('priceTWD'), priceUSD:returnMode?'':get('priceUSD'),
      isStock:stockMode, stockBuyer:'', stockSoldDate:'', stockOriginalFlow:stockMode?flow:'',
      directRecipient: flow==='直郵'?get('directRecipient'):'', directAddress: flow==='直郵'?get('directAddress'):'', directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: returnMode, hasImage: false,
      purchasedDate:(returnMode||stockMode)?todayStr():'', usReceivedDate:'', usShippedDate:'', twReceivedDate:'', customerShippedDate:'', returnDate:'', usReceipts:[], usShipments:[], twReceipts:[], customerShipments:[]
    };
    items.push(item);
    if(pendingImageFiles[itemId]) uploadJobs.push({itemId, file: pendingImageFiles[itemId]});
  });

  if(autocompleteError) return;
  if(items.length===0){ alert('請至少加入一個商品：可以只上傳圖片，商品名稱可空白'); return; }

  const newOrder = {
    id: uidOrder(), orderType, createdAt: todayStr(),
    customerName, phone, lineId, twRecipient, twPhone, twAddress,
    paymentsReceived: 0, items
  };
  orders.unshift(newOrder);
  await saveOrders();

  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    const found = findItem(job.itemId);
    if(found) found.item.hasImage = true;
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();

  alert('訂單已建立！');
  show((returnMode||stockMode) ? 'jen' : 'customerOrders');
}

async function deleteStockItem(itemId){
  const found=findItem(itemId);
  if(!found) return;
  const item=found.item, order=found.order;
  if(!confirm('確定要刪除這件囤貨商品嗎？刪除後會移到回收桶，可再還原。')) return;

  if((order.items||[]).length<=1){
    orders=orders.filter(o=>o.id!==order.id);
    order.deletedAt=new Date().toLocaleString('zh-TW',{hour12:false});
    order.deletedBy=currentUser&&currentUser.email?currentUser.email:'unknown';
    deletedOrders.unshift(order);
  }else{
    order.items=(order.items||[]).filter(it=>it.id!==itemId);
    const deletedCopy={
      ...order,
      id: order.id+'-STOCK-'+Date.now(),
      items:[item],
      deletedAt:new Date().toLocaleString('zh-TW',{hour12:false}),
      deletedBy:currentUser&&currentUser.email?currentUser.email:'unknown',
      deletedFromOrderId:order.id
    };
    deletedOrders.unshift(deletedCopy);
  }
  logActivity('刪除囤貨商品並移到回收桶',order.id,itemId);
  await saveOrders(false);
  renderAll();
  show('stock',document.querySelector('aside button[onclick*="stock"]'));
}

// ====== 囤貨 ======
let stockState={search:'',location:'all',status:'all'};
function stockProgressText(item){
  const total=itemTotalQty(item), home=stockHomeFlow(item);
  if(item.isReturn) return item.returnDate?'已完成退貨':'退貨處理中';
  if(home==='Jen'){
    if(usReceivedQty(item)<total) return '等待美國收貨';
    if(!item.stockBuyer) return '美國囤貨中';
    if(usShippedQty(item)<total) return '已售出，等待美國出貨';
    if(twReceivedQty(item)<total) return '已售出，運往台灣途中';
    if(customerShippedQty(item)<total) return '台灣已收到，等待交付買家';
    return '已交付買家';
  }
  if(usReceivedQty(item)<total) return '等待美國收貨';
  if(usShippedQty(item)<total) return '美國已收，等待美國出貨';
  if(twReceivedQty(item)<total) return '運往台灣途中';
  if(!item.stockBuyer) return '台灣囤貨中';
  if(customerShippedQty(item)<total) return '已售出，等待交付買家';
  return '已交付買家';
}
function stockProgressKey(item){
  const text=stockProgressText(item);
  if(item.isReturn) return 'return';
  if(text==='等待美國收貨') return 'wait-us';
  if(text==='美國囤貨中') return 'us-stock';
  if(text.includes('等待美國出貨')) return 'wait-us-ship';
  if(text.includes('運往台灣途中')) return 'transit';
  if(text==='台灣囤貨中') return 'tw-stock';
  if(item.stockBuyer) return 'sold';
  return 'all';
}
function renderStock(){
  let pairs=allPairs().filter(p=>p.order.orderType==='stock' || p.item.isStock);
  pairs=pairs.filter(p=>{
    const t=stockState.search.toLowerCase();
    if(t&&![(p.item.itemName||''),(p.item.brand||''),(p.item.site||''),(p.item.stockBuyer||''),stockHomeFlow(p.item),stockProgressText(p.item)].join(' ').toLowerCase().includes(t))return false;

  bindSearch('stockSearch',v=>stockState.search=v,()=>{renderStock();hydrateImages();});

  document.querySelectorAll('[data-action="stock-sold"]').forEach(b=>b.onclick=async e=>{const f=findItem(e.currentTarget.dataset.id);if(!f)return;const buyer=(document.getElementById('stockBuyer_'+f.item.id)||{}).value.trim();if(!buyer){alert('請填寫買家姓名');return;}f.item.stockBuyer=buyer;f.item.stockSoldDate=(document.getElementById('stockSold_'+f.item.id)||{}).value||todayStr();if(stockHomeFlow(f.item)==='Jen'&&f.item.flow==='Jen'){const d=document.getElementById('stockDest_'+f.item.id);f.item.flow=d?d.value:'小沈';}logActivity('囤貨標記售出：'+buyer,f.order.id,f.item.id);await saveOrders();renderStock();hydrateImages();});
  document.querySelectorAll('[data-action="stock-return"]').forEach(b=>b.onclick=async e=>{const f=findItem(e.currentTarget.dataset.id);if(!f)return;if(!confirm('確定這件囤貨沒有賣出，要改成退貨嗎？'))return;f.item.isReturn=true;f.item.flow='';f.item.stockBuyer='';logActivity('囤貨改為退貨',f.order.id,f.item.id);await saveOrders();renderStock();hydrateImages();});document.querySelectorAll('[data-action="stock-delete"]').forEach(b=>b.onclick=e=>deleteStockItem(e.currentTarget.dataset.id));hydrateImages();

  </div>`;

  bindSearch('returnsSearchInput', v=>returnsState.search=v, ()=>{ renderReturns(); hydrateImages(); });

let twState = { search:'', flow:'all', status:'all', usShipDate:'all' };

function displayFilterDate(date){
  if(!date) return '日期待確認';
  const parts=String(date).split('-');
  if(parts.length===3) return `${Number(parts[1])}/${Number(parts[2])}/${parts[0]}`;
  return String(date);
}
function itemUsShipDates(item){
  return Array.from(new Set(usShipmentHistory(item).map(h=>String(h.date||'').trim()).filter(Boolean)));
}
function itemUsShipDateHTML(item){
  const history=usShipmentHistory(item).filter(h=>h.date);
  if(!history.length) return `<span class="muted">日期待確認</span>`;
  return history.map(h=>`<div><b>${esc(displayFilterDate(h.date))}</b>${Number(h.qty)>0?` <span class="badge">${Number(h.qty)} 件</span>`:''}</div>`).join('');
}

function renderTaiwanReceive(){
  let pairs=allPairs().filter(p=>needsTwFlow(p.item,p.order) && usShippedQty(p.item)>twReceivedQty(p.item));
  const availableUsShipDates=Array.from(new Set(pairs.flatMap(p=>itemUsShipDates(p.item)))).sort((a,b)=>a.localeCompare(b));
  if(twState.usShipDate!=='all' && !availableUsShipDates.includes(twState.usShipDate)) twState.usShipDate='all';
  pairs=pairs.filter(p=>{if(!twState.search)return true;const t=twState.search.toLowerCase();return (p.item.itemName||'').toLowerCase().includes(t)||(p.item.brand||'').toLowerCase().includes(t);});
  if(twState.flow!=='all')pairs=pairs.filter(p=>p.item.flow===twState.flow);

  const rows=pairs.map(p=>{const avail=usShippedQty(p.item)-twReceivedQty(p.item);return `<tr><td>${thumbHTML(p.item)}</td><td><b class="item-click" onclick="openItemStatusModal('${escAttr(p.item.id)}', event)">${esc(itemDisplayName(p.item))}</b>${mobileVariantHTML(p.item)}${itemNoteHTML(p.item)}<br><span class="badge">${esc(p.item.brand)||esc(p.item.site)||'—'}</span></td><td>${esc(displayCustomerName(p.item,p.order))||'—'}</td><td>${esc(p.item.flow)}</td><td><span class="muted">美國出貨日期</span><br>${itemUsShipDateHTML(p.item)}</td><td>${qtyProgress(usShippedQty(p.item),itemTotalQty(p.item))}</td><td><div class="qty-action"><span class="badge">台灣待收 ${avail} 件</span><input type="number" min="1" max="${avail}" value="${avail}" class="input" id="twqty_${p.item.id}" style="max-width:90px"><input type="date" class="input" id="twdate_${p.item.id}" style="max-width:150px"><button class="btn small green" data-action="tw-mark-received" data-id="${p.item.id}">確認收貨數量</button></div></td></tr>`;}).join('');
  const dateOptions=availableUsShipDates.map(d=>`<option value="${escAttr(d)}" ${twState.usShipDate===d?'selected':''}>${esc(displayFilterDate(d))}</option>`).join('');
  document.getElementById('taiwanReceiveContent').innerHTML=`<div class="card"><h2>台灣流程 Step 1：確認收貨數量</h2><div class="note">只有已從美國出貨的數量可以確認台灣收貨。若美國先寄回 2 件，台灣就先確認收到 2 件。</div><div class="toolbar"><input class="input" id="twSearchInput" style="max-width:360px" placeholder="搜尋商品名稱或品牌" value="${escAttr(twState.search)}"><select id="twFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(TW_FLOWS,twState.flow==='all'?null:twState.flow)}</select><select id="twUsShipDateSelect" style="max-width:220px"><option value="all">全部美國出貨日期</option>${dateOptions}</select></div>${pairs.length===0?`<div class="empty-state">目前沒有符合條件的商品</div>`:`<table class="table mobile-card-table twreceive-mobile-table"><tr><th>圖片</th><th>品牌 / 商品</th><th>客人</th><th>流向</th><th>美國出貨日期</th><th>美國已出貨</th><th>本次台灣收貨</th></tr>${rows}</table>`}</div>`;
  bindSearch('twSearchInput',v=>twState.search=v,()=>{renderTaiwanReceive();hydrateImages();});const flowSel=document.getElementById('twFlowSelect');if(flowSel)flowSel.addEventListener('change',e=>{twState.flow=e.target.value;renderTaiwanReceive();hydrateImages();});const dateSel=document.getElementById('twUsShipDateSelect');if(dateSel)dateSel.addEventListener('change',e=>{twState.usShipDate=e.target.value;renderTaiwanReceive();hydrateImages();});
  document.querySelectorAll('[data-action="tw-mark-received"]').forEach(btn=>btn.addEventListener('click',async e=>{const found=findItem(e.currentTarget.dataset.id);if(!found)return;const avail=usShippedQty(found.item)-twReceivedQty(found.item);const q=clampActionQty((document.getElementById('twqty_'+found.item.id)||{}).value,avail);if(!q){alert('請輸入有效的台灣收貨數量');return;}const date=(document.getElementById('twdate_'+found.item.id)||{}).value||todayStr();if(!confirmDateAction('確認台灣收到貨',date,`商品：${itemDisplayName(found.item)}
本次數量：${q} 件`))return;appendStageEvent(found.item,'twReceipts','twReceivedDate',twReceivedQty,date,q);found.item.twReceivedQty=twReceivedQty(found.item)+q;found.item.twReceivedDate=date;logActivity(`台灣收到 ${q} 件（累計 ${found.item.twReceivedQty}/${itemTotalQty(found.item)}）`,found.order.id,found.item.id);await saveOrders();renderTaiwanReceive();hydrateImages();}));hydrateImages();
}

let jessicaState = { search:'', flow:'all', status:'all' };

function renderJessica(){
  let allCustomerPairs=allPairs().filter(p=>readyForCustomerFlow(p.item,p.order));
  allCustomerPairs=allCustomerPairs.filter(p=>{if(!jessicaState.search)return true;const t=jessicaState.search.toLowerCase();return (p.item.itemName||'').toLowerCase().includes(t)||(p.item.brand||'').toLowerCase().includes(t)||(displayCustomerName(p.item,p.order)||'').toLowerCase().includes(t);});
  if(jessicaState.flow!=='all')allCustomerPairs=allCustomerPairs.filter(p=>p.item.flow===jessicaState.flow);
  const groups=new Map();allCustomerPairs.forEach(p=>{const name=displayCustomerName(p.item,p.order);if(!groups.has(name))groups.set(name,{orders:[],pairs:[]});const g=groups.get(name);if(!g.orders.some(o=>o.id===p.order.id))g.orders.push(p.order);g.pairs.push(p);});
  let names=Array.from(groups.keys()).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  names=names.filter(name=>{const ps=groups.get(name).pairs;const ready=ps.reduce((n,p)=>n+Math.max(0,twReceivedQty(p.item)-customerShippedQty(p.item)),0);const waiting=ps.reduce((n,p)=>n+Math.max(0,itemTotalQty(p.item)-twReceivedQty(p.item)),0);const remaining=ps.reduce((n,p)=>n+Math.max(0,itemTotalQty(p.item)-customerShippedQty(p.item)),0);if(remaining<=0)return false;if(jessicaState.status==='partial')return ready>0&&waiting>0;if(jessicaState.status==='all-ready')return ready>0&&waiting===0;if(jessicaState.status==='waiting')return ready===0&&waiting>0;return true;});
  const body=names.map(name=>{const g=groups.get(name),primaryOrder=g.orders[0]||{};const readyUnits=g.pairs.reduce((n,p)=>n+Math.max(0,twReceivedQty(p.item)-customerShippedQty(p.item)),0);const waitingUnits=g.pairs.reduce((n,p)=>n+Math.max(0,itemTotalQty(p.item)-twReceivedQty(p.item)),0);const shippedUnits=g.pairs.reduce((n,p)=>n+customerShippedQty(p.item),0);const summaryText=readyUnits&&waitingUnits?`部分到貨：${readyUnits} 件可先寄，${waitingUnits} 件等待中`:readyUnits?`全部到貨：${readyUnits} 件可寄`:`尚未到貨：${waitingUnits} 件等待中`;const summaryClass=readyUnits&&waitingUnits?'s-ready':readyUnits?'s-done':'s-ship';
    const activeRows=g.pairs.map(p=>{const item=p.item,total=itemTotalQty(item),ready=Math.max(0,twReceivedQty(item)-customerShippedQty(item)),waiting=Math.max(0,total-twReceivedQty(item)),remaining=Math.max(0,total-customerShippedQty(item));if(remaining<=0)return '';return `<div class="checkrow mobile-item-row">${thumbHTML(item)}<div class="mobile-item-info" style="flex:1"><b class="item-click" onclick="openItemStatusModal('${escAttr(item.id)}', event)">${esc(itemDisplayName(item))}</b>${itemNoteHTML(item)}<br><span class="muted">總數 ${total} 件｜台灣已收 ${twReceivedQty(item)}｜已寄客人 ${customerShippedQty(item)}｜仍未寄 ${remaining}｜仍等待到貨 ${waiting}</span>${shipmentHistoryHTML(item)}</div>${ready>0?`<div class="qty-action"><span class="status s-ready">可寄 ${ready} 件</span><input type="number" min="0" max="${ready}" value="${ready}" class="input jessica-qty" data-id="${item.id}" style="max-width:80px"></div>`:`<span class="status s-ship">無可寄數量</span>`}</div>`;}).join('');
    const shippedRows=g.pairs.filter(p=>customerShippedQty(p.item)>0).map(p=>{const item=p.item;return `<div class="checkrow mobile-item-row shipped-record-row">${thumbHTML(item)}<div class="mobile-item-info" style="flex:1"><b class="item-click" onclick="openItemStatusModal('${escAttr(item.id)}', event)">${esc(itemDisplayName(item))}</b>${itemNoteHTML(item)}<br><span class="status s-done">已出貨 ${customerShippedQty(item)}/${itemTotalQty(item)} 件</span>${shipmentHistoryHTML(item)}</div></div>`;}).join('');
    const custBox=(primaryOrder.twRecipient||primaryOrder.twPhone||primaryOrder.twAddress)?`<div class="customerbox"><b>台灣收件人：</b>${esc(primaryOrder.twRecipient)||'—'}　<b>電話：</b>${esc(primaryOrder.twPhone)||'—'}<br><b>地址：</b>${esc(primaryOrder.twAddress)||'—'}</div>`:'';const safeKey=btoa(unescape(encodeURIComponent(name))).replace(/=/g,'');return `<div class="shipmentgroup customer-shipment-card" data-customer="${escAttr(name)}"><div class="customer-shipment-head"><div><h3>${esc(name)}</h3><span class="status ${summaryClass}">${summaryText}</span>${shippedUnits>0?`<span class="status s-done" style="margin-left:6px">已出貨 ${shippedUnits} 件</span>`:''}</div></div>${custBox}<h4 class="shipment-section-title">待處理商品</h4>${activeRows||'<div class="empty-state">目前沒有待處理商品</div>'}${shippedRows?`<details class="shipped-history-box" open><summary>查看已出貨商品與日期（${shippedUnits} 件）</summary>${shippedRows}</details>`:''}<div class="shipping-choice"><div><b>本次出貨</b><div class="muted">每個商品可填本次要寄出的數量；已寄出的商品與日期會保留在上方紀錄。</div></div><div class="shipping-actions"><input type="date" class="input" id="jship_${safeKey}"><button class="btn green" data-action="jessica-ship-group" data-customer="${escAttr(name)}" data-key="${safeKey}" ${readyUnits===0?'disabled':''}>確認本次出貨</button></div></div></div>`;}).join('');

// ====== 收款管理 ======
function orderTWDTotal(order){
  return order.items.filter(i=>!i.isReturn).reduce((sum,i)=>sum + (parseFloat(i.priceTWD)||0), 0);
}
function renderPayments(){
  const custOrders = orders.filter(o=>o.orderType==='customer' && !orderIsCompleted(o));
  const rows = custOrders.map(o=>{
    const total = orderTWDTotal(o);
    const received = o.paymentsReceived || 0;
    let statusHtml;
    if(total<=0) statusHtml = `<span class="status s-wait">尚無金額</span>`;
    else if(received >= total) statusHtml = `<span class="status s-done">已收齊</span>`;
    else if(received > 0) statusHtml = `<span class="status s-buy">部分收款</span>`;
    else statusHtml = `<span class="status s-wait">等貨到台灣後收款</span>`;
    return `<tr>
      <td data-label="客人"><b>${esc(o.customerName)}</b></td>
      <td data-label="台幣客訂金額">NT$${fmtMoney(total)}</td>
      <td data-label="已收">NT$${fmtMoney(received)}</td>
      <td data-label="新增收款"><div class="payment-entry"><input class="input" id="payinput_${o.id}" style="max-width:130px;display:inline-block" placeholder="收款金額" type="number"><button class="btn small green" data-action="add-payment" data-id="${o.id}">新增收款</button></div></td>
    </tr>`;
  }).join('');
  document.getElementById('paymentsContent').innerHTML = `
  <div class="card"><h2>收款管理</h2>
  ${custOrders.length===0? `<div class="empty-state">目前沒有客人訂單</div>` :
  `<table class="table mobile-summary-table"><tr><th>客人</th><th>台幣客訂金額</th><th>已收</th><th>動作</th></tr>${rows}</table>`}
  </div>`;
  document.querySelectorAll('[data-action="add-payment"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const input = document.getElementById('payinput_'+id);
      const amount = parseFloat(input && input.value);
      if(!amount || amount<=0){ alert('請輸入有效的收款金額'); return; }
      const o = findOrder(id);
      if(o){ o.paymentsReceived = (o.paymentsReceived||0) + amount; await saveOrders(); renderPayments(); }
    });
  });
}

let activityLogUserFilter = 'all';
function activityLogTimestamp_(log){
  const m = String(log && log.id || '').match(/^LOG-(\d+)/);
  if(m) return Number(m[1]) || 0;
  const t = Date.parse(log && log.at ? log.at : '');
  return Number.isFinite(t) ? t : 0;
}
function setActivityLogUserFilter(value){
  activityLogUserFilter = value || 'all';
  renderBackup();
}
function renderBackup(){
  const deletedRows = (deletedOrders||[]).map(o=>`<tr>
    <td>${esc(o.id)}</td><td>${o.orderType==='return'?'退貨商品':esc(o.customerName)}</td><td>${(o.items||[]).length}</td><td>${esc(o.deletedAt)||'-'}</td><td>${esc(o.deletedBy)||'-'}</td>
    <td><button class="btn small green" onclick="restoreDeletedOrder('${escAttr(o.id)}')">還原</button> <button class="btn small red" onclick="permanentlyDeleteOrder('${escAttr(o.id)}')">永久刪除</button></td>
  </tr>`).join('');
  const activityUsers = Array.from(new Set((activityLog||[]).map(l=>l.user||'unknown'))).sort((a,b)=>a.localeCompare(b));
  let filteredLogs = (activityLog||[]).slice().sort((a,b)=>activityLogTimestamp_(b)-activityLogTimestamp_(a));
  if(activityLogUserFilter !== 'all') filteredLogs = filteredLogs.filter(l=>(l.user||'unknown')===activityLogUserFilter);
  const logRows = filteredLogs.slice(0,200).map(l=>`<tr><td>${esc(l.at)}</td><td>${esc(l.user)}</td><td>${esc(l.action)}</td><td>${esc(l.detail)}</td></tr>`).join('');
  document.getElementById('backupContent').innerHTML = `
  <div class="card"><h2>備份與資料安全</h2>
    <div class="note">資料存在 Firebase，不在 HTML 裡；更新 HTML 不會刪掉資料。這裡可以一鍵匯出 CSV、完整 JSON 備份，也可以從回收桶還原誤刪訂單。</div>
    <div class="toolbar">
      <button class="btn green" onclick="exportAllCSV()">匯出 Excel/CSV</button>
      <button class="btn" onclick="exportBackupJSON()">匯出完整 JSON 備份</button>
      <button class="btn secondary" onclick="triggerImportBackup()">匯入 JSON 備份</button>
      <input id="backupImportInput" type="file" accept="application/json,.json" style="display:none" onchange="importBackupFile(this)">
    </div>
  </div>
  <div class="card" style="margin-top:16px"><h2>回收桶</h2>
    ${(deletedOrders||[]).length===0?'<div class="empty-state">目前沒有刪除的訂單</div>':`<table class="table"><tr><th>訂單</th><th>客人/類型</th><th>商品數</th><th>刪除時間</th><th>刪除者</th><th>動作</th></tr>${deletedRows}</table>`}
  </div>
  <div class="card" style="margin-top:16px"><h2>活動紀錄</h2>
    <div class="toolbar">
      <select style="max-width:260px" onchange="setActivityLogUserFilter(this.value)">
        <option value="all" ${activityLogUserFilter==='all'?'selected':''}>全部使用者</option>
        ${activityUsers.map(u=>`<option value="${escAttr(u)}" ${activityLogUserFilter===u?'selected':''}>${esc(u)}</option>`).join('')}
      </select>
      <span class="muted">依時間由新到舊排列</span>
    </div>
    ${filteredLogs.length===0?'<div class="empty-state">目前沒有符合條件的活動紀錄</div>':`<table class="table"><tr><th>時間</th><th>使用者</th><th>動作</th><th>內容</th></tr>${logRows}</table>`}
  </div>`;
}

function renderCompletedOrders(){
  const lastCompletedDate = (order)=>{
    const finishedDates = (order.items||[])
      .flatMap(it=>[
        it.customerShippedDate || '',
        it.returnDate || '',
        (!needsTwFlow(it, order) ? (it.usShippedDate || '') : '')
      ])
      .filter(Boolean)
      .sort();
    return finishedDates.length ? finishedDates[finishedDates.length-1] : '';
  };
  const doneOrders = orders
    .filter(o=>orderIsCompleted(o))
    .slice()
    .sort((a,b)=>
      lastCompletedDate(b).localeCompare(lastCompletedDate(a)) ||
      (b.createdAt||'').localeCompare(a.createdAt||'') ||
      (b.id||'').localeCompare(a.id||'')
    );
  const rows = doneOrders.map(o=>{
    const completedItems = o.items.length;
    const lastDate = lastCompletedDate(o) || '-';
    return `<tr>
      <td>${esc(o.id)}</td>
      <td>${o.orderType==='return'?'退貨商品':esc(o.customerName)}</td>
      <td>${completedItems}</td>
      <td>${esc(lastDate)}</td>
      <td><span class="status s-done">已完成</span></td>
      <td>
        <button type="button" class="btn small secondary" onclick="openOrderDetail('${escAttr(o.id)}', false)">查看</button>
        <button type="button" class="btn small" onclick="openOrderDetail('${escAttr(o.id)}', true)">修改</button>
        <button type="button" class="btn small red" onclick="deleteOrder('${escAttr(o.id)}')">刪除</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('completedOrdersContent').innerHTML = `
  <div class="card"><h2>完成訂單</h2>
   <div class="note">商品寄出給客人後會從「台灣出貨給客人」移除；當整張訂單所有商品都完成，就會出現在這裡。完成訂單可以查看、修改或刪除。</div>

  </div>`;
}

let customerOrdersState = { search:'', type:'all' };
function openOrderDetail(orderId, editMode){
  detailSelectedId = orderId;
  detailEditing = !!editMode;
  show('detail');
}
function managementTypeLabel(order){
  if(order.orderType==='stock') return '囤貨';
  if(order.orderType==='return') return '退貨';
  return '一般訂單';
}
function managementOwnerText(order){
  if(order.orderType==='stock'){
    const buyers=[...new Set((order.items||[]).map(it=>it.stockBuyer).filter(Boolean))];
    const homes=[...new Set((order.items||[]).map(it=>stockHomeFlow(it)).filter(Boolean))];
    return buyers.length ? buyers.join('、') : (homes.length ? homes.join('、')+' 囤貨' : '囤貨未售');
  }
  if(order.orderType==='return') return order.sourceCustomerName || order.customerName || '退貨商品';
  return order.customerName || '（未填客人姓名）';
}
function managementStatusHTML(order){
  const items=order.items||[];
  if(order.orderType==='return'){
    const done=items.filter(it=>!!it.returnDate).length;
    return done===items.length && items.length
      ? `<span class="status s-done">退貨完成</span><br><span class="muted">${done}/${items.length} 件</span>`
      : `<span class="status s-return">退貨處理中</span><br><span class="muted">${done}/${items.length} 件完成</span>`;
  }
  if(order.orderType==='stock'){
    const texts=[...new Set(items.map(stockProgressText))];
    const sold=items.filter(it=>it.stockBuyer).length;
    return `<span class="status ${sold===items.length&&items.length?'s-done':'s-ready'}">${esc(texts.slice(0,2).join('、') || '囤貨追蹤中')}</span><br><span class="muted">${sold}/${items.length} 件已售出</span>`;
  }
  const total=items.length;
  const doneCount=items.filter(it=>{
    if(it.isReturn) return true;
    if(needsTwFlow(it,order)) return !!it.customerShippedDate;
    return !!it.usShippedDate;
  }).length;
  const readyToShip=items.some(it=>needsTwFlow(it,order)&&it.twReceivedDate&&!it.customerShippedDate);
  const normalTw=items.filter(it=>needsTwFlow(it,order));
  const allDone=normalTw.length>0&&normalTw.every(it=>it.customerShippedDate);
  let pill=allDone?`<span class="status s-done">已完成</span>`:readyToShip?`<span class="status s-ready">可先寄已到商品</span>`:`<span class="status s-wait">等待到齊</span>`;
  return `${pill}<br><span class="muted">${doneCount}/${total} 已完成流程</span>`;
}
function renderCustomerOrders(){
  const q=(customerOrdersState.search||'').trim().toLowerCase();

      ...(o.items||[]).flatMap(it=>[
        it.itemName,it.productName,it.brand,it.site,it.color,it.size,it.flow,it.stockOriginalFlow,
        it.stockBuyer,it.note,it.purchasedDate,it.usReceivedDate,it.usShippedDate,it.twReceivedDate,
        it.customerShippedDate,it.returnDate,stockProgressText(it)
      ])
    ].filter(Boolean).join(' ').toLowerCase();
    return orderText.includes(q);
  }).slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')||(b.id||'').localeCompare(a.id||''));

  const rows=managedOrders.map(o=>{

    const flowText=flows.length?flows.join('、'):'—';

    return `<tr>
      <td data-label="訂單圖片">${orderImagesHTML(o)}</td>
      <td data-label="類型"><span class="status ${typeClass}">${managementTypeLabel(o)}</span><br><span class="muted">${esc(o.id)}</span></td>
      <td data-label="客人 / 買家"><b>${esc(managementOwnerText(o))}</b></td>
      <td data-label="商品數">${(o.items||[]).length}</td>
      <td data-label="流向 / 囤貨位置"><b>${esc(flowText)}</b></td>
      <td data-label="處理狀態">${managementStatusHTML(o)}</td>
      <td data-label="操作"><div class="mobile-actions">
        <button type="button" class="btn small secondary" onclick="openOrderDetail('${escAttr(o.id)}', false)">查看詳細紀錄</button>
        <button type="button" class="btn small" onclick="openOrderDetail('${escAttr(o.id)}', true)">修改訂單</button>
        <button type="button" class="btn small red" onclick="deleteOrder('${escAttr(o.id)}')">刪除訂單</button>
      </div></td>
    </tr>`;
  }).join('');

  document.getElementById('customerOrdersContent').innerHTML=`
  <div class="card"><h2>訂單管理</h2>
   <div class="note">這裡整合顯示一般訂單、退貨與囤貨。可用類型篩選、搜尋、查看、修改或刪除；原本的「退貨」與「囤貨」頁面仍會保留各自的專用操作。</div>
   <div class="toolbar">
     <input class="input" id="customerOrdersSearchInput" style="max-width:420px" placeholder="搜尋客人、買家、訂單編號、商品、品牌、網站、流向、日期" value="${escAttr(customerOrdersState.search)}">
     <select id="customerOrdersTypeFilter">
       <option value="all" ${type==='all'?'selected':''}>全部類型</option>
       <option value="customer" ${type==='customer'?'selected':''}>一般訂單</option>
       <option value="return" ${type==='return'?'selected':''}>退貨</option>
       <option value="stock" ${type==='stock'?'selected':''}>囤貨</option>
     </select>
     ${(customerOrdersState.search||type!=='all')?`<button class="btn small" id="customerOrdersClearSearch" type="button">清除篩選</button>`:''}
     <span class="badge">目前 ${managedOrders.length} 張訂單</span>
   </div>
   ${managedOrders.length===0?`<div class="empty-state">找不到符合條件的訂單</div>`:
   `<table class="table mobile-summary-table"><tr><th>訂單圖片</th><th>類型 / 編號</th><th>客人 / 買家</th><th>商品數</th><th>流向 / 囤貨位置</th><th>處理狀態</th><th>動作</th></tr>${rows}</table>`}
  </div>`;
  bindSearch('customerOrdersSearchInput',v=>customerOrdersState.search=v,()=>{renderCustomerOrders();hydrateImages();});
  const typeFilter=document.getElementById('customerOrdersTypeFilter');
  if(typeFilter) typeFilter.addEventListener('change',e=>{customerOrdersState.type=e.target.value;renderCustomerOrders();hydrateImages();});
  const clearBtn=document.getElementById('customerOrdersClearSearch');
  if(clearBtn) clearBtn.addEventListener('click',()=>{customerOrdersState.search='';customerOrdersState.type='all';renderCustomerOrders();hydrateImages();});
  hydrateImages(document.getElementById('customerOrdersContent'));
}

function toggleEditReturnFields(sel){
  const card = sel.closest('.edit-item');

  card.querySelectorAll('.normalOnly').forEach(el=>{ if(el.querySelector('[data-field="isReturn"]')) return; el.style.display = isRet ? 'none' : ''; });
  card.querySelectorAll('.twOnly').forEach(el=>el.style.display = isRet ? 'none' : '');
  card.querySelectorAll('.returnOnly').forEach(el=>el.style.display = isRet ? '' : 'none');
}

let saveEditInProgress = false;
async function saveEditOrder(){
  if(saveEditInProgress) return;
  const order = findOrder(detailSelectedId);
  if(!order) return;

  const saveBtn = document.getElementById('saveEditOrderBtn');
  const originalBtnText = saveBtn ? saveBtn.textContent : '儲存修改';
  const ordersSnapshot = JSON.stringify(orders);
  const activitySnapshot = JSON.stringify(activityLog);
  const deletedSnapshot = JSON.stringify(deletedOrders);

  try{
    saveEditInProgress = true;
    if(saveBtn){
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存中…';
      saveBtn.style.opacity = '0.7';
      saveBtn.style.cursor = 'wait';
    }

    if(order.orderType === 'customer'){
      const name = (document.getElementById('editCustomerName')||{}).value || '';
      if(!name.trim()){ alert('請填寫客人姓名'); return; }
      order.customerName = name.trim();
      order.phone = (document.getElementById('editPhone')||{}).value || '';
      order.lineId = (document.getElementById('editLineId')||{}).value || '';
      order.twRecipient = (document.getElementById('editTwRecipient')||{}).value || '';
      order.twPhone = (document.getElementById('editTwPhone')||{}).value || '';
      order.twAddress = (document.getElementById('editTwAddress')||{}).value || '';
    }

    const cards = document.querySelectorAll('#editItemsWrap .edit-item');
    const newItems = [];
    const uploadJobs = [];
    let autocompleteError = false;

    cards.forEach(card=>{
      const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
      const itemName = get('itemName').trim();
      const id = card.dataset.itemid || uidItem();
      if(!itemHasEnoughInfo(card, id)) return;
      const isRet = order.orderType === 'return' || get('isReturn') === 'true';
      const flow = isRet ? '' : get('flow');
      const old = (order.items||[]).find(i=>i.id===id) || {};
      const brandResult=resolveAutocompleteValue(get('brand'), BRANDS);
      const siteResult=resolveAutocompleteValue(get('site'), SITES);
      if(brandResult.needsChoice || siteResult.needsChoice){
        autocompleteError=true;
        const input=card.querySelector(`[data-field="${brandResult.needsChoice?'brand':'site'}"]`);
        if(input) normalizeAutocompleteInput(input, true);
        return;
      }
      const item = Object.assign({}, old, {
        id,
        itemName,
        brand: brandResult.value,
        site: siteResult.value,
        itemUrl: get('itemUrl'),
        size: get('size'),
        color: get('color'),
        qty: get('qty') || '1',
        note: get('note'),
        flow,
        stockBuyer: order.orderType==='stock' ? get('stockBuyer') : (old.stockBuyer||''),
        stockSoldDate: order.orderType==='stock' ? get('stockSoldDate') : (old.stockSoldDate||''),
        priceTWD: isRet ? '' : get('priceTWD'),
        priceUSD: isRet ? '' : get('priceUSD'),
        directRecipient: flow==='直郵'?get('directRecipient'):'',
        directAddress: flow==='直郵'?get('directAddress'):'',
        directGroup: flow==='直郵'?get('directGroup'):'',
        isReturn: isRet,
        purchasedDate: get('purchasedDate'),
        usReceivedDate: get('usReceivedDate'),
        usShippedDate: get('usShippedDate'),
        twReceivedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('twReceivedDate'),
        customerShippedDate: isRet || !TW_FLOWS.includes(flow) ? '' : get('customerShippedDate'),
        returnDate: isRet ? get('returnDate') : ''
      });
      // 新圖片先不要把 hasImage 寫成 true；等圖片真的上傳成功後再補標記。
      if(pendingImageFiles[id]){
        uploadJobs.push({itemId:id, file:pendingImageFiles[id]});
      }
      newItems.push(item);
    });

    if(autocompleteError) return;
    if(newItems.length===0){ alert('至少要有一個商品：可以只上傳圖片，商品名稱可空白'); return; }

    order.items = newItems;
    const beforeIds = new Set((orders||[]).map(o=>o.id));
    splitReturnItemsIntoSeparateOrders(order.id);

    // v84：一般修改只寫入這一張訂單，不再把全部 orders JSON 重寫一次。
    // 若這次修改把退貨商品拆成新訂單，連同新建立的退貨訂單一起快速寫入。
    logActivity('更新資料', currentSection || '修改訂單');
    const fastSaveTargets=[];
    const editedOrder=findOrder(order.id);
    if(editedOrder) fastSaveTargets.push(editedOrder);
    (orders||[]).forEach(o=>{ if(!beforeIds.has(o.id)) fastSaveTargets.push(o); });
    if(!fastSaveTargets.length && order) fastSaveTargets.push(order);
    const uniqueTargets=Array.from(new Map(fastSaveTargets.map(o=>[o.id,o])).values());
    const fastStarted=performance.now();
    await Promise.all(uniqueTargets.map(saveOrderFast));
    console.log(`[BuyFlow v85] Save edit total: ${Math.round(performance.now()-fastStarted)} ms (${uniqueTargets.length} order doc)`);
    Promise.allSettled([saveFastStateBackground(), touchFastMeta()]);
    scheduleLegacySync(300000);

    // 到這裡主要訂單已確實存在獨立 Firestore document，可以立刻讓使用者離開。
    detailEditing = false;
    renderDetail();
    hydrateImages();
    alert(uploadJobs.length ? '訂單已快速儲存。圖片會繼續在背景上傳。' : '訂單已快速儲存');

    if(uploadJobs.length){
      // 圖片平行上傳，不再讓「儲存修改」按鈕卡住等待每一張圖片。
      (async()=>{
        const results = await Promise.allSettled(uploadJobs.map(async job=>{
          await uploadImageForItemStrict(job.itemId, job.file);
          const found = findItem(job.itemId);
          if(found) found.item.hasImage = true;
          delete pendingImageFiles[job.itemId];
          return job.itemId;
        }));

        const failed = results.filter(r=>r.status==='rejected');
        try{
          // v84：圖片狀態只補寫受影響訂單，不再整包重寫所有 orders。
          const okIds=results.filter(r=>r.status==='fulfilled').map(r=>r.value);
          const affected=new Map();
          okIds.forEach(itemId=>{ const f=findItem(itemId); if(f&&f.order) affected.set(f.order.id,f.order); });
          if(affected.size){
            await Promise.all(Array.from(affected.values()).map(saveOrderFast));
            Promise.allSettled([saveFastStateBackground(), touchFastMeta()]);
            scheduleLegacySync(300000);
          }
        }catch(e){
          console.error('圖片狀態補存失敗', e);
        }
        if(failed.length){
          alert(`訂單文字資料已儲存，但有 ${failed.length} 張圖片上傳失敗。請重新開啟訂單後再上傳圖片。`);
        }
        renderDetail();
        hydrateImages();
      })();
    }
  }catch(e){
    // Firestore 主儲存失敗時，不讓畫面保留一份「看似成功」的本機資料。
    try{
      orders = JSON.parse(ordersSnapshot);
      activityLog = JSON.parse(activitySnapshot);
      deletedOrders = JSON.parse(deletedSnapshot);
    }catch(_e){}
    console.error('訂單儲存失敗', e);
    alert('儲存失敗，資料尚未成功寫入。請檢查網路後再試一次。');
  }finally{
    saveEditInProgress = false;
    const currentBtn = document.getElementById('saveEditOrderBtn');
    if(currentBtn){
      currentBtn.disabled = false;
      currentBtn.textContent = originalBtnText;
      currentBtn.style.opacity = '';
      currentBtn.style.cursor = '';
    }
  }
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.getElementById('loginScreen') && document.getElementById('loginScreen').style.display !== 'none') loginWithEmail();
});
initAuth();

// v85: 使用者回到頁面後，如有待做的相容性快照，再重新排到閒置時間。
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && legacySyncDirty) scheduleLegacySync(300000); });
</script>
</body>
