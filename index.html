r:pointer;background:var(--brand);color:white}.btn.secondary{background:#f3f4f6;color:#111827;border:1px solid var(--line)}.btn.green{background:var(--green)}.btn.orange{background:var(--orange)}.btn.red{background:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.table{width:100%;border-collapse:collapse;margin-top:10px}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.04em}.status{font-size:12px;font-weight:800;border-radius:999px;padding:4px 9px;display:inline-block}.s-wait{background:#fef3c7;color:#92400e}.s-buy{background:#dbeafe;color:#1e40af}.s-usa{background:#dcfce7;color:#166534}.s-ship{background:#ede9fe;color:#5b21b6}.s-tw{background:#cffafe;color:#155e75}.s-ready{background:#ffedd5;color:#9a3412}.s-done{background:#d1fae5;color:#065f46}.s-return{background:#fee2e2;color:#991b1b}.itemcard{border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;background:#fff}.itemhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}.thumb{width:74px;height:74px;border-radius:14px;background:#f3f4f6;border:1px dashed #cbd5e1;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;text-align:center;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}.thumb.thumb-lg{width:160px;height:160px;border-radius:16px}.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.step{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fafafa}.step b{font-size:12px;display:block;margin-bottom:5px}.step span{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.note{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:14px;padding:12px;margin:10px 0}.warnbanner{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:14px;padding:12px;margin:0 0 16px;font-weight:700;font-size:13px}.splitbox{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.customerbox{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#f3f4f6;font-size:12px;color:#374151}.directbox{display:none;background:#fff7ed;border:1px solid #fed7aa;border-radius:14px;padding:12px;margin-top:10px}.shipmentgroup{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;background:#fff}.checkrow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:1px solid #f3f4f6}.checkrow:last-child{border-bottom:0}.mobilehint{display:none}
.upload-btn{display:inline-block;font-size:12px;font-weight:700;color:var(--brand);background:#eef2ff;padding:8px 12px;border-radius:8px;cursor:pointer;text-align:center}

.login-card h1{margin:0 0 6px;font-size:32px}.login-card .sub2{color:var(--muted);margin-bottom:20px}.login-error{display:none;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px;margin:12px 0;font-size:13px;font-weight:700}.userbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}

@media(max-width:900px){.app{display:block}.side{width:auto;height:auto;position:relative}.grid,.formgrid,.splitbox,.flow{grid-template-columns:1fr}.main{padding:14px}.table{font-size:12px}.mobilehint{display:block}.side .nav{display:grid;grid-template-columns:repeat(2,1fr)}}

<script>
// ====== Firebase 設定（沿用你已建立好的專案） ======
const firebaseConfig = {
  apiKey: "AIzaSyCJxAWxAhOtkewFF0FEqu4UduELWDdAv2k",
  authDomain: "jenna---usa-buy.firebaseapp.com",
  projectId: "jenna---usa-buy",
  storageBucket: "jenna---usa-buy.firebasestorage.app",
  messagingSenderId: "786455761363",
  appId: "1:786455761363:web:e9390a916083d2d0d55f26"
};
const CONFIG_IS_PLACEHOLDER = firebaseConfig.apiKey === "YOUR_API_KEY";
let connectionError = '';
const FS_BASE = `https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents`;
const FS_KEY = firebaseConfig.apiKey;
const dbReady = !CONFIG_IS_PLACEHOLDER;
const AUTH_BASE = `https://identitytoolkit.googleapis.com/v1/accounts`;
let currentUser = null;
function authHeaders(){ return currentUser && currentUser.idToken ? { 'Authorization': 'Bearer ' + currentUser.idToken } : {}; }
function getStoredUser(){ try { return JSON.parse(localStorage.getItem('buyflowUser') || 'null'); } catch(e){ return null; } }
function setStoredUser(u){ if(u) localStorage.setItem('buyflowUser', JSON.stringify(u)); else localStorage.removeItem('buyflowUser'); }
function showLoginError(msg){ const el=document.getElementById('loginError'); if(el){ el.style.display='block'; el.textContent=msg; } }
async function loginWithEmail(){
  const email=(document.getElementById('loginEmail')||{}).value || '';
  const password=(document.getElementById('loginPassword')||{}).value || '';
  if(!email || !password){ showLoginError('請輸入 Email 和 Password'); return; }
  try{
    const res = await fetch(`${AUTH_BASE}:signInWithPassword?key=${FS_KEY}`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password, returnSecureToken:true })
    });
    if(!res.ok){ throw new Error('登入失敗，請確認 Email / Password 是否正確'); }
    const data = await res.json();
    currentUser = { email:data.email, idToken:data.idToken, refreshToken:data.refreshToken, expiresAt: Date.now() + (parseInt(data.expiresIn||'3600')*1000) };
    setStoredUser(currentUser);
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }catch(e){ showLoginError(e.message || '登入失敗'); }
}
function logout(){
  setStoredUser(null); currentUser=null; loaded=false; orders=[];
  if(pollTimer) clearInterval(pollTimer);
  document.getElementById('appRoot').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  const err=document.getElementById('loginError'); if(err) err.style.display='none';
}
function initAuth(){
  const u = getStoredUser();
  if(u && u.idToken && (!u.expiresAt || u.expiresAt > Date.now()+60000)){
    currentUser = u;
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('appRoot').style.display='block';
    startListening();
  }else{
    setStoredUser(null);
    document.getElementById('loginScreen').style.display='flex';
    document.getElementById('appRoot').style.display='none';
  }
}

async function fsGetDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { headers: authHeaders() });
  if(res.status === 404) return null;
  if(!res.ok) throw new Error('資料庫讀取失敗（HTTP ' + res.status + '）');
  const data = await res.json();
  return data.fields || null;
}
async function fsSetDoc(collection, docId, fieldName, stringValue){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    body: JSON.stringify({ fields: { [fieldName]: { stringValue } } })
  });
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error('資料庫寫入失敗（HTTP ' + res.status + '）' + (errText ? '：' + errText.slice(0,200) : ''));
  }
  return true;
}
async function fsDeleteDoc(collection, docId){
  const res = await fetch(`${FS_BASE}/${collection}/${docId}?key=${FS_KEY}`, { method: 'DELETE', headers: authHeaders() });
  return res.ok;
}

// ====== 資料 ======
const SITES = ['Walmart','Target','Costco',"Sam's Club","Trader Joe's","Macy's",'Nordstrom',"Bloomingdale's","Dillard's",'Kohl\'s','JCPenney','Belk','Neiman Marcus','Saks Fifth Avenue','Burlington','Ross Dress for Less','Marshalls','TJ Maxx','HomeGoods','Sierra','Best Buy','Pottery Barn',"Dick's Sporting Goods",'REI','Old Navy','Gap','Banana Republic','Athleta','American Eagle','Aerie','Hollister','Abercrombie & Fitch','H&M','Zara','Forever 21',"J.Crew",'Ann Taylor','LOFT','DSW','Famous Footwear','Foot Locker','Finish Line','Ulta Beauty','Sephora','Tiffany & Co.','Pandora','Louis Vuitton','Gucci','Prada','Cartier','Burberry','Chanel','Hermès','Amazon','Adidas','Nike','Urban Outfitters'];
const BRANDS = ['Nike','Adidas','Coach','Dior','Chanel','Hermès','Gucci','Prada','Louis Vuitton','Lululemon','Alo','Stanley','Dyson','Apple','Tory Burch','Kate Spade','Michael Kors','The North Face','Patagonia','New Balance','UGG','Sephora Collection','Rare Beauty','Charlotte Tilbury','LEGO'];
const FLOWS = ['小沈','JLS','恬恬','婷婷','直郵'];
const TW_FLOWS = ['小沈','JLS','恬恬'];

let orders = [];
let loaded = false;
let imageCache = {};
let pendingImageFiles = {};
let isComposingSearch = false;
let lastOrdersJson = '';

function uidOrder(){ return 'ORD-' + Math.random().toString(36).slice(2,5).toUpperCase() + Date.now().toString().slice(-4); }
function uidItem(){ return 'ITM-' + Math.random().toString(36).slice(2,6).toUpperCase() + Date.now().toString().slice(-3); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function opts(arr, selected){ return arr.map(x=>`<option value="${escAttr(x)}" ${selected===x?'selected':''}>${esc(x)}</option>`).join(''); }
function fmtMoney(n){ n = parseFloat(n)||0; return n.toLocaleString('en-US'); }

function needsTwFlow(item, order){
  return order.orderType==='customer' && !item.isReturn && TW_FLOWS.includes(item.flow);
}
function endsAfterUSShip(item, order){
  return order.orderType==='customer' && !item.isReturn && ['直郵','婷婷'].includes(item.flow);
}
function findItem(itemId){
  for(const o of orders){
    const it = o.items.find(i=>i.id===itemId);
    if(it) return {item:it, order:o};
  }
  return null;
}
function findOrder(id){ return orders.find(o=>o.id===id); }
function allPairs(){
  const pairs = [];
  orders.forEach(o=>o.items.forEach(it=>pairs.push({item:it, order:o})));
  return pairs;
}

// ====== Firestore 讀寫（改用 REST API，不需要載入額外的 JS 程式庫） ======
let pollTimer = null;
async function pollOrders(){
  if(!dbReady) return;
  try{
    const fields = await fsGetDoc('app-data', 'main');
    const json = (fields && fields.ordersJson && fields.ordersJson.stringValue) || '[]';
    if(json !== lastOrdersJson){
      lastOrdersJson = json;
      orders = JSON.parse(json || '[]');
      renderAll();
    }
    if(connectionError){ connectionError = ''; renderAll(); }
  }catch(e){
    console.error('讀取資料失敗', e);
    connectionError = e && e.message ? e.message : '無法連線到資料庫';
    renderAll();
  }
}
function startListening(){
  if(!dbReady){ loaded = true; renderAll(); return; }
  pollOrders().finally(()=>{ loaded = true; renderAll(); });
  pollTimer = setInterval(pollOrders, 4000);
}
async function saveOrders(){
  if(!dbReady) return;
  try{
    const json = JSON.stringify(orders);
    await fsSetDoc('app-data', 'main', 'ordersJson', json);
    lastOrdersJson = json;
    connectionError = '';
  }catch(e){
    console.error('儲存發生錯誤', e);
    connectionError = e && e.message ? e.message : String(e);
    renderAll();
  }
}

// ====== 圖片 ======
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('讀取檔案失敗'));
    reader.readAsDataURL(file);
  });
}
function loadImageEl(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('無法解析這張圖片的格式'));
    img.src = src;
  });
}
function drawToDataURL(srcW, srcH, drawFn){
  const maxDim = 900;
  let w = srcW, h = srcH;
  if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
  else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, w, h);
  return canvas.toDataURL('image/jpeg', 0.7);
}
async function compressImage(file){
  try{
    const bitmap = await createImageBitmap(file);
    const dataUrl = drawToDataURL(bitmap.width, bitmap.height, (ctx,w,h)=>ctx.drawImage(bitmap,0,0,w,h));
    bitmap.close && bitmap.close();
    return dataUrl;
  }catch(e1){
    try{
      const rawDataUrl = await readFileAsDataURL(file);
      const img = await loadImageEl(rawDataUrl);
      return drawToDataURL(img.naturalWidth, img.naturalHeight, (ctx,w,h)=>ctx.drawImage(img,0,0,w,h));
    }catch(e2){
      const rawDataUrl = await readFileAsDataURL(file).catch(()=>null);
      if(rawDataUrl && rawDataUrl.length < 4000000) return rawDataUrl;
      throw new Error('這張圖片的格式或大小無法處理，建議改用 JPG / PNG 格式，或先縮小照片再上傳');
    }
  }
}
async function uploadImageForItem(itemId, file){
  if(!dbReady) return;
  try{
    const dataUrl = await compressImage(file);
    await fsSetDoc('item-images', itemId, 'dataUrl', dataUrl);
    imageCache[itemId] = dataUrl;
  }catch(e){
    console.error('圖片上傳失敗', e);
    alert('商品「'+itemId+'」的圖片上傳失敗：' + (e && e.message ? e.message : '未知錯誤'));
  }
}
async function handleImageDelete(itemId){
  if(!dbReady) return;
  try{ await fsDeleteDoc('item-images', itemId); }catch(e){}
  delete imageCache[itemId];
  const found = findItem(itemId);
  if(found){ found.item.hasImage = false; await saveOrders(); }
  renderAll();
}
function hydrateImages(root){
  (root||document).querySelectorAll('[data-hasimage="1"]').forEach(async(el2)=>{
    const id = el2.dataset.id;
    if(imageCache[id]){ el2.innerHTML = `<img src="${imageCache[id]}">`; return; }
    if(!dbReady) return;
    try{
      const fields = await fsGetDoc('item-images', id);
      if(fields && fields.dataUrl && fields.dataUrl.stringValue){
        imageCache[id] = fields.dataUrl.stringValue;
        el2.innerHTML = `<img src="${imageCache[id]}">`;
      }
    }catch(e){}
  });
}
// ====== 導覽 ======
let currentSection = 'dashboard';
const SECTION_TITLES = {
  dashboard:'儀表板', neworder:'新增訂單', customerOrders:'訂單管理', jenna:'待訂購商品',
  jen:'美國收貨', returns:'退貨', taiwanReceive:'台灣收貨', jessica:'台灣出貨給客人',
  payments:'收款管理', detail:'訂單明細'
};
function show(id, btn){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else { const idx=Object.keys(SECTION_TITLES).indexOf(id); const b=document.querySelectorAll('.nav button')[idx]; if(b) b.classList.add('active'); }
  document.getElementById('title').textContent = SECTION_TITLES[id] || id;
  currentSection = id;
  renderSection(id);
}

function renderAll(){
  const userPill = document.getElementById('userPill');
  if(userPill) userPill.textContent = currentUser && currentUser.email ? ('Hi, ' + currentUser.email) : '未登入';
  const pill = document.getElementById('connPill');
  if(pill){
    if(CONFIG_IS_PLACEHOLDER){ pill.textContent = '⚠️ 尚未設定資料庫'; }
    else if(connectionError){ pill.textContent = '⚠️ 連線異常'; }
    else if(!loaded){ pill.textContent = '載入中…'; }
    else { pill.textContent = '● 已連線同步'; }
  }
  const warnWrap = document.getElementById('warnBannerWrap');
  if(warnWrap){
    if(CONFIG_IS_PLACEHOLDER){
      warnWrap.innerHTML = `<div class="warnbanner">⚠️ 尚未設定資料庫，請在檔案最上方 firebaseConfig 填入你的 Firebase 專案設定。</div>`;
    }else if(connectionError){
      warnWrap.innerHTML = `<div class="warnbanner">⚠️ 資料庫連線發生問題：${esc(connectionError)}</div>`;
    }else{
      warnWrap.innerHTML = '';
    }
  }
  if(!loaded) return;
  renderSection(currentSection);
}

function renderSection(id){
  if(id==='dashboard') renderDashboard();
  else if(id==='neworder') renderNewOrder();

// 讓搜尋框在輸入法組字（注音/拼音）時不被打斷
function bindSearch(inputId, onChange, rerenderFn){
  const el = document.getElementById(inputId);
  if(!el) return;
  el.addEventListener('compositionstart', ()=>{ isComposingSearch = true; });
  el.addEventListener('compositionend', (e)=>{ isComposingSearch = false; onChange(e.target.value); rerenderFn(); });
  el.addEventListener('input', (e)=>{
    onChange(e.target.value);
    if(isComposingSearch) return;
    const pos = e.target.selectionStart;
    rerenderFn();
    const again = document.getElementById(inputId);
    if(again){ again.focus(); again.setSelectionRange(pos,pos); }
  });
}

function thumbHTML(item, size){

  return `<div class="${cls}">圖片</div>`;
}

async function saveNewOrder(){
  const returnMode = isReturnOnlyMode();
  const orderType = returnMode ? 'return' : 'customer';
  let customerName='', phone='', lineId='', twRecipient='', twPhone='', twAddress='';
  if(!returnMode){
    customerName = (document.getElementById('noCustomerName')||{}).value || '';
    if(!customerName.trim()){ alert('請填寫客人姓名'); return; }
    phone = (document.getElementById('noPhone')||{}).value || '';
    lineId = (document.getElementById('noLineId')||{}).value || '';
    twRecipient = (document.getElementById('noTwRecipient')||{}).value || '';
    twPhone = (document.getElementById('noTwPhone')||{}).value || '';
    twAddress = (document.getElementById('noTwAddress')||{}).value || '';
  }

  const cards = document.querySelectorAll('#itemsWrap .itemcard');
  const items = [];
  const uploadJobs = [];
  cards.forEach(card=>{
    const get = f => (card.querySelector(`[data-field="${f}"]`)||{}).value || '';
    const itemName = get('itemName').trim();
    if(!itemName) return;
    const itemId = card.dataset.itemid;
    let brand = get('brand'); if(brand==='__other__') brand = get('brandOther');
    let site = get('site'); if(site==='__other__') site = get('siteOther');
    const flow = returnMode ? '' : get('flow');
    const item = {
      id: itemId, itemName, brand, site, itemUrl: get('itemUrl'), size: get('size'), color: get('color'),
      qty: get('qty') || '1',
      flow, priceTWD: returnMode?'':get('priceTWD'), priceUSD: returnMode?'':get('priceUSD'),
      directRecipient: flow==='直郵'?get('directRecipient'):'', directAddress: flow==='直郵'?get('directAddress'):'', directGroup: flow==='直郵'?get('directGroup'):'',
      isReturn: returnMode, hasImage: false,
      purchasedDate:'', usReceivedDate:'', usShippedDate:'', twReceivedDate:'', customerShippedDate:'', returnDate:''
    };
    items.push(item);
    if(pendingImageFiles[itemId]) uploadJobs.push({itemId, file: pendingImageFiles[itemId]});
  });

  if(items.length===0){ alert('請至少填寫一個商品的商品名稱'); return; }

  const newOrder = {
    id: uidOrder(), orderType, createdAt: todayStr(),
    customerName, phone, lineId, twRecipient, twPhone, twAddress,
    paymentsReceived: 0, items
  };
  orders.unshift(newOrder);
  await saveOrders();

  for(const job of uploadJobs){
    await uploadImageForItem(job.itemId, job.file);
    const found = findItem(job.itemId);
    if(found) found.item.hasImage = true;
    delete pendingImageFiles[job.itemId];
  }
  if(uploadJobs.length) await saveOrders();

  alert('訂單已建立！');
  show(returnMode ? 'returns' : 'customerOrders');
}

function renderReturns(){

      || (p.order.customerName||'').toLowerCase().includes(t);
  });

  if(returnsState.status==='returned') pairs = pairs.filter(p=>p.item.returnDate);

  const rows = pairs.map(p=>{
    const source = p.order.orderType==='return' ? '退貨商品' : '客人訂單';
    return `<tr>
      <td>${thumbHTML(p.item)}</td>
      <td><b>${esc(p.item.itemName)}</b><br><span class="muted">${esc(p.item.color)||''}</span></td>
      <td>${source}</td>
      <td>${esc(p.item.site)||'-'}</td>
      <td>${esc(p.item.purchasedDate)||'-'}</td>
      <td><input type="date" class="input" data-action="returns-us-received" data-id="${p.item.id}" value="${escAttr(p.item.usReceivedDate)}" style="max-width:150px"></td>
      <td><input type="date" class="input" id="rdate_${p.item.id}" value="${escAttr(p.item.returnDate)}" style="max-width:150px;display:inline-block">${p.item.returnDate? `<span class="status s-return" style="margin-left:6px;">已退貨</span>` : `<button class="btn small red" data-action="mark-returned" data-id="${p.item.id}">已退貨</button>`}</td>
    </tr>`;
  }).join('');

  document.getElementById('returnsContent').innerHTML = `
  <div class="card"><h2>退貨</h2>
   <div class="note">這一頁只放「要退貨」的商品。只需要更新退貨日期，不需要備註。</div>
   <div class="toolbar">
    <input class="input" id="returnsSearchInput" style="max-width:340px" placeholder="搜尋商品、客人、網站" value="${escAttr(returnsState.search)}">
    <select id="returnsStatusSelect" style="max-width:220px">
      <option value="all" ${returnsState.status==='all'?'selected':''}>全部退貨狀態</option>
      <option value="waiting" ${returnsState.status==='waiting'?'selected':''}>待收到</option>
      <option value="received" ${returnsState.status==='received'?'selected':''}>已收到待退貨</option>
      <option value="returned" ${returnsState.status==='returned'?'selected':''}>已退貨</option>
    </select>
   </div>
   ${pairs.length===0? `<div class="empty-state">目前沒有退貨商品</div>` :
   `<table class="table"><tr><th>圖片</th><th>商品</th><th>來源</th><th>網站</th><th>購買日期</th><th>美國收貨日期</th><th>退貨日期</th></tr>${rows}</table>`}
  </div>`;

  bindSearch('returnsSearchInput', v=>returnsState.search=v, ()=>{ renderReturns(); hydrateImages(); });
  const statSel = document.getElementById('returnsStatusSelect');
  if(statSel) statSel.addEventListener('change', e=>{ returnsState.status = e.target.value; renderReturns(); hydrateImages(); });

  document.querySelectorAll('[data-action="returns-us-received"]').forEach(inp=>{
    inp.addEventListener('change', async e=>{
      const id = e.target.dataset.id;
      const found = findItem(id);
      if(found){ found.item.usReceivedDate = e.target.value; await saveOrders(); renderReturns(); hydrateImages(); }
    });
  });
  document.querySelectorAll('[data-action="mark-returned"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const d = document.getElementById('rdate_'+id);
      const found = findItem(id);
      if(found){ found.item.returnDate = (d && d.value) ? d.value : todayStr(); await saveOrders(); renderReturns(); hydrateImages(); }
    });
  });
  hydrateImages();
}
// ====== 台灣收貨 ======
let twState = { search:'', flow:'all', status:'all' };

function renderTaiwanReceive(){
  let pairs = allPairs().filter(p=>needsTwFlow(p.item,p.order) && p.item.usShippedDate);
  pairs = pairs.filter(p=>{
    if(!twState.search) return true;
    const t = twState.search.toLowerCase();
    return (p.item.itemName||'').toLowerCase().includes(t) || (p.item.brand||'').toLowerCase().includes(t);
  });
  if(twState.flow !== 'all') pairs = pairs.filter(p=>p.item.flow === twState.flow);
  if(twState.status==='waiting') pairs = pairs.filter(p=>!p.item.twReceivedDate);
  if(twState.status==='received') pairs = pairs.filter(p=>p.item.twReceivedDate);

  const rows = pairs.map(p=>{
    const action = p.item.twReceivedDate
      ? `<span class="status s-tw">台灣已收到 ${esc(p.item.twReceivedDate)}</span>`
      : `<input type="date" class="input" id="twdate_${p.item.id}" style="max-width:150px;display:inline-block"><button class="btn small green" data-action="tw-mark-received" data-id="${p.item.id}">標記台灣收到</button>`;
    return `<tr>
      <td>${thumbHTML(p.item)}</td>
      <td><b>${esc(p.item.itemName)}</b><br><span class="badge">${esc(p.item.brand)||esc(p.item.site)||'—'}</span></td>
      <td>${esc(p.order.customerName)||'—'}</td>
      <td><span class="badge">${esc(p.item.flow)}</span></td>
      <td>${esc(p.item.usShippedDate)||'-'}</td>
      <td>${p.item.twReceivedDate? '' : `<input type="date" class="input" style="max-width:150px" disabled>`}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  document.getElementById('taiwanReceiveContent').innerHTML = `
  <div class="card"><h2>台灣收貨：確認商品已到台灣</h2>
   <div class="note">只有流向為「小沈 / 恬恬 / JLS」的商品需要在這裡確認到台灣。直郵與婷婷只需要記錄「美國出貨日期」，不需要台灣收貨或台灣出貨給客人。</div>
   <div class="toolbar">
    <input class="input" id="twSearchInput" style="max-width:360px" placeholder="搜尋商品名稱或品牌，例如 Dior / Nike / Coach" value="${escAttr(twState.search)}">
    <select id="twFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(TW_FLOWS, twState.flow==='all'?null:twState.flow)}</select>
    <select id="twStatusSelect" style="max-width:220px">
      <option value="all" ${twState.status==='all'?'selected':''}>全部狀態</option>
      <option value="waiting" ${twState.status==='waiting'?'selected':''}>已從美國出貨，待台灣收貨</option>
      <option value="received" ${twState.status==='received'?'selected':''}>台灣已收到</option>
    </select>
   </div>
   ${pairs.length===0? `<div class="empty-state">目前沒有符合條件的商品</div>` :
   `<table class="table"><tr><th>圖片</th><th>品牌 / 商品</th><th>客人</th><th>流向</th><th>美國出貨日期</th><th>台灣收貨日期</th><th>動作</th></tr>${rows}</table>`}
  </div>`;

  bindSearch('twSearchInput', v=>twState.search=v, ()=>{ renderTaiwanReceive(); hydrateImages(); });
  const flowSel = document.getElementById('twFlowSelect');
  if(flowSel) flowSel.addEventListener('change', e=>{ twState.flow = e.target.value; renderTaiwanReceive(); hydrateImages(); });
  const statSel = document.getElementById('twStatusSelect');
  if(statSel) statSel.addEventListener('change', e=>{ twState.status = e.target.value; renderTaiwanReceive(); hydrateImages(); });

  document.querySelectorAll('[data-action="tw-mark-received"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const d = document.getElementById('twdate_'+id);
      const found = findItem(id);
      if(found){ found.item.twReceivedDate = (d && d.value) ? d.value : todayStr(); await saveOrders(); renderTaiwanReceive(); hydrateImages(); }
    });
  });
  hydrateImages();
}

// ====== 台灣出貨給客人 ======
let jessicaState = { search:'', flow:'all', status:'all' };

function renderJessica(){
  let pairs = allPairs().filter(p=>needsTwFlow(p.item,p.order) && p.item.usShippedDate);
  pairs = pairs.filter(p=>{
    if(!jessicaState.search) return true;
    const t = jessicaState.search.toLowerCase();
    return (p.item.itemName||'').toLowerCase().includes(t) || (p.item.brand||'').toLowerCase().includes(t) || (p.order.customerName||'').toLowerCase().includes(t);
  });
  if(jessicaState.flow !== 'all') pairs = pairs.filter(p=>p.item.flow === jessicaState.flow);

  const groups = new Map();
  pairs.forEach(p=>{
    const name = p.order.customerName || '（未填客人姓名）';
    if(!groups.has(name)) groups.set(name, {order:p.order, items:[]});
    groups.get(name).items.push(p.item);
  });

  let names = Array.from(groups.keys()).sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  names = names.filter(name=>{
    const g = groups.get(name);
    const ready = g.items.filter(i=>i.twReceivedDate && !i.customerShippedDate).length;
    const waiting = g.items.filter(i=>!i.twReceivedDate).length;
    if(jessicaState.status==='all-ready') return waiting===0 && ready>0;
    if(jessicaState.status==='partial') return ready>0 && waiting>0;
    return true;
  });

  const body = names.map(name=>{
    const g = groups.get(name);
    const o = g.order;
    const readyItems = g.items.filter(i=>i.twReceivedDate && !i.customerShippedDate);
    const waitingItems = g.items.filter(i=>!i.twReceivedDate);
    const shippedItems = g.items.filter(i=>i.customerShippedDate);
    const tagLabel = `${readyItems.length+shippedItems.length} items 已到台灣 / ${waitingItems.length} item${waitingItems.length===1?'':'s'} 還沒到`;
    const rows = g.items.map(item=>{
      let statusHtml, checkbox;
      if(item.customerShippedDate){
        statusHtml = `<span class="status s-done">已寄出 ${esc(item.customerShippedDate)}</span>`;
        checkbox = `<input type="checkbox" disabled>`;
      }else if(item.twReceivedDate){
        statusHtml = `<span class="status s-ready">可寄</span>`;
        checkbox = `<input type="checkbox" checked class="jessica-check" data-id="${item.id}">`;
      }else{
        statusHtml = `<span class="status s-ship">等待到台灣</span>`;
        checkbox = `<input type="checkbox" disabled>`;
      }
      return `<div class="checkrow">${checkbox} ${thumbHTML(item)}<div style="flex:1"><b>${esc(item.itemName)}</b><br><span class="muted">${esc(item.brand)||esc(item.site)||''} · ${esc(item.flow)} · ${item.twReceivedDate?('台灣已收到 '+esc(item.twReceivedDate)):'已從美國出貨，尚未台灣收貨'}</span></div>${statusHtml}</div>`;
    }).join('');
    const custBox = (o.twRecipient||o.twPhone||o.twAddress) ? `<div class="customerbox"><b>台灣收件人：</b>${esc(o.twRecipient)||'—'}　<b>電話：</b>${esc(o.twPhone)||'—'}<br><b>地址：</b>${esc(o.twAddress)||'—'}</div>` : '';
    const canShipCount = readyItems.length;
    return `<div class="shipmentgroup" data-customer="${escAttr(name)}">
      <h3>${esc(name)} <span class="badge">${tagLabel}</span></h3>
      ${custBox}
      ${rows}
      <div class="toolbar">
        <input type="date" class="input" id="jship_${escAttr(name).replace(/[^a-zA-Z0-9]/g,'_')}" style="max-width:180px">
        <button class="btn green" data-action="jessica-ship-group" data-customer="${escAttr(name)}" ${canShipCount===0?'disabled':''}>標記出貨給客人（${canShipCount} 件）</button>
      </div>
    </div>`;
  }).join('');

  document.getElementById('jessicaContent').innerHTML = `
  <div class="card"><h2>台灣出貨給客人：依流向篩選</h2>
   <div class="note">這裡只處理「小沈 / 恬恬 / JLS」且已確認台灣收貨的商品。勾選要寄出的商品並標記「台灣出貨給客人日期」即可。直郵 / 婷婷不會進入此流程。</div>
   <div class="toolbar">
    <select id="jessicaFlowSelect" style="max-width:220px"><option value="all">全部流向</option>${opts(TW_FLOWS, jessicaState.flow==='all'?null:jessicaState.flow)}</select>
    <input class="input" id="jessicaSearchInput" style="max-width:340px" placeholder="搜尋客人 / 商品 / 品牌" value="${escAttr(jessicaState.search)}">
    <select id="jessicaStatusSelect" style="max-width:220px">
      <option value="all" ${jessicaState.status==='all'?'selected':''}>全部</option>
      <option value="all-ready" ${jessicaState.status==='all-ready'?'selected':''}>全部到齊</option>
      <option value="partial" ${jessicaState.status==='partial'?'selected':''}>部分到齊，可先寄</option>
    </select>
   </div>
   ${names.length===0? `<div class="empty-state">目前沒有符合條件的客人</div>` : body}
  </div>`;

  bindSearch('jessicaSearchInput', v=>jessicaState.search=v, ()=>{ renderJessica(); hydrateImages(); });
  const flowSel = document.getElementById('jessicaFlowSelect');
  if(flowSel) flowSel.addEventListener('change', e=>{ jessicaState.flow = e.target.value; renderJessica(); hydrateImages(); });
  const statSel = document.getElementById('jessicaStatusSelect');
  if(statSel) statSel.addEventListener('change', e=>{ jessicaState.status = e.target.value; renderJessica(); hydrateImages(); });

  document.querySelectorAll('[data-action="jessica-ship-group"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const name = e.currentTarget.dataset.customer;
      const safeId = name.replace(/[^a-zA-Z0-9]/g,'_');
      const dateInput = document.getElementById('jship_'+safeId);
      const date = (dateInput && dateInput.value) ? dateInput.value : todayStr();
      const group = document.querySelector(`.shipmentgroup[data-customer="${CSS.escape(name)}"]`);
      const checks = group ? group.querySelectorAll('.jessica-check:checked') : [];
      if(checks.length===0){ alert('沒有可標記出貨的商品'); return; }
      checks.forEach(chk=>{
        const found = findItem(chk.dataset.id);
        if(found) found.item.customerShippedDate = date;
      });
      await saveOrders();
      renderJessica(); hydrateImages();
    });
  });
  hydrateImages();
}

// ====== 收款管理 ======
function orderTWDTotal(order){
  return order.items.filter(i=>!i.isReturn).reduce((sum,i)=>sum + (parseFloat(i.priceTWD)||0), 0);
}
function renderPayments(){
  const custOrders = orders.filter(o=>o.orderType==='customer');
  const rows = custOrders.map(o=>{
    const total = orderTWDTotal(o);
    const received = o.paymentsReceived || 0;
    let statusHtml;
    if(total<=0) statusHtml = `<span class="status s-wait">尚無金額</span>`;
    else if(received >= total) statusHtml = `<span class="status s-done">已收齊</span>`;
    else if(received > 0) statusHtml = `<span class="status s-buy">部分收款</span>`;
    else statusHtml = `<span class="status s-wait">等貨到台灣後收款</span>`;
    return `<tr>
      <td>${esc(o.customerName)}</td>
      <td>${esc(o.id)}</td>
      <td>NT$${fmtMoney(total)}</td>
      <td>NT$${fmtMoney(received)}</td>
      <td>${statusHtml}</td>
      <td><input class="input" id="payinput_${o.id}" style="max-width:130px;display:inline-block" placeholder="收款金額" type="number"><button class="btn small green" data-action="add-payment" data-id="${o.id}">新增收款</button></td>
    </tr>`;
  }).join('');
  document.getElementById('paymentsContent').innerHTML = `
  <div class="card"><h2>收款管理</h2>
  ${custOrders.length===0? `<div class="empty-state">目前沒有客人訂單</div>` :
  `<table class="table"><tr><th>客人</th><th>訂單</th><th>台幣客訂金額</th><th>已收</th><th>狀態</th><th>動作</th></tr>${rows}</table>`}
  </div>`;
  document.querySelectorAll('[data-action="add-payment"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const input = document.getElementById('payinput_'+id);
      const amount = parseFloat(input && input.value);
      if(!amount || amount<=0){ alert('請輸入有效的收款金額'); return; }
      const o = findOrder(id);
      if(o){ o.paymentsReceived = (o.paymentsReceived||0) + amount; await saveOrders(); renderPayments(); }
    });
  });
}

// ====== 訂單管理 ======
function renderCustomerOrders(){
  const custOrders = orders.filter(o=>o.orderType==='customer');
  const rows = custOrders.map(o=>{
    const total = o.items.length;
    const doneCount = o.items.filter(it=>{
      if(it.isReturn) return true; // 已離開此訂單的流程，不列入待處理
      if(needsTwFlow(it,o)) return !!it.twReceivedDate;
      return !!it.usShippedDate;
    }).length;
    const readyToShip = o.items.some(it=>needsTwFlow(it,o) && it.twReceivedDate && !it.customerShippedDate);
    const allDone = o.items.filter(it=>needsTwFlow(it,o)).every(it=>it.customerShippedDate) && o.items.filter(it=>needsTwFlow(it,o)).length>0;
    let statusPill;
    if(allDone) statusPill = `<span class="status s-done">已完成</span>`;
    else if(readyToShip) statusPill = `<span class="status s-ready">可先寄已到商品</span>`;
    else statusPill = `<span class="status s-wait">等待到齊</span>`;
    return `<tr>
      <td>${esc(o.id)}</td>
      <td>${esc(o.customerName)}</td>
      <td>${total}</td>
      <td>${doneCount}/${total} 已完成流程</td>
      <td>${statusPill}</td>
    </tr>`;
  }).join('');
  document.getElementById('customerOrdersContent').innerHTML = `
  <div class="card"><h2>訂單管理</h2>
   <div class="note">這裡只放真正有客人的訂單。可看到每位客人的多個商品、哪些已到台灣、哪些可分批出貨。</div>
   ${custOrders.length===0? `<div class="empty-state">目前沒有客人訂單</div>` :
   `<table class="table"><tr><th>訂單</th><th>客人</th><th>商品數</th><th>處理狀態</th><th>是否可寄客人</th></tr>${rows}</table>`}
  </div>`;
}

// ====== 訂單明細 ======
let detailSelectedId = '';
function flowStepsHTML(item, order){
  const isReturn = item.isReturn;
  const toTw = needsTwFlow(item, order);
  return `<div class="flow">
   <div class="step"><b>購買</b><span>${esc(item.purchasedDate)||'待填'}</span></div>
   <div class="step"><b>美國收貨</b><span>${esc(item.usReceivedDate)||'-'}</span></div>
   <div class="step"><b>美國出貨</b><span>${esc(item.usShippedDate)||'-'}</span></div>
   <div class="step"><b>台灣收貨</b><span>${toTw ? (esc(item.twReceivedDate)||'-') : '不需要'}</span></div>
   <div class="step"><b>寄給客人</b><span>${toTw ? (esc(item.customerShippedDate)||'-') : '不需要'}</span></div>
   <div class="step"><b>退貨</b><span>${isReturn ? (esc(item.returnDate)||'待退貨') : '-'}</span></div>
  </div>`;
}
function renderDetail(){
  if(!detailSelectedId && orders.length) detailSelectedId = orders[0].id;
  const order = findOrder(detailSelectedId);
  const options = orders.map(o=>`<option value="${escAttr(o.id)}" ${o.id===detailSelectedId?'selected':''}>${esc(o.id)} － ${o.orderType==='return'?'退貨商品':esc(o.customerName)}</option>`).join('');
  let body = '';
  if(order){
    const custBox = order.orderType==='customer' ? `<div class="customerbox"><b>${esc(order.customerName)}</b><br>台灣收件人：${esc(order.twRecipient)||'—'}｜電話：${esc(order.twPhone)||'—'}｜地址：${esc(order.twAddress)||'—'}</div>` : `<div class="customerbox"><b>退貨商品訂單</b></div>`;
    const cards = order.items.map(item=>{
      const flowBadges = [];
      if(item.brand) flowBadges.push(`<span class="badge">${esc(item.brand)}</span>`);
      if(item.site) flowBadges.push(`<span class="badge">${esc(item.site)}</span>`);
      if(item.flow) flowBadges.push(`<span class="badge">${esc(item.flow)}</span>`);
      if(item.isReturn) flowBadges.push(`<span class="badge" style="background:#fee2e2;color:#991b1b;">退貨</span>`);
      return `<div class="itemcard">
        <div class="itemhead"><div><h3>${esc(item.itemName)}</h3>${flowBadges.join(' ')}</div>${thumbHTML(item)}</div>
        ${flowStepsHTML(item, order)}
        <div class="toolbar" style="margin-top:10px">
          ${item.isReturn? `<button class="btn secondary small" data-action="detail-toggle-return" data-id="${item.id}">取消退貨標記</button>` : `<button class="btn secondary small" data-action="detail-toggle-return" data-id="${item.id}">標記為退貨</button>`}
        </div>
      </div>`;
    }).join('');
    body = custBox + cards;
  }else{
    body = `<div class="empty-state">目前還沒有任何訂單</div>`;
  }
  document.getElementById('detailContent').innerHTML = `
  <div class="card">
   <h2>訂單明細</h2>
   <div class="toolbar"><select id="detailOrderSelect" style="max-width:420px">${options}</select></div>
  </div>
  ${body}`;
  const sel = document.getElementById('detailOrderSelect');
  if(sel) sel.addEventListener('change', e=>{ detailSelectedId = e.target.value; renderDetail(); hydrateImages(); });
  document.querySelectorAll('[data-action="detail-toggle-return"]').forEach(btn=>{
    btn.addEventListener('click', async e=>{
      const id = e.currentTarget.dataset.id;
      const found = findItem(id);
      if(found){ found.item.isReturn = !found.item.isReturn; await saveOrders(); renderDetail(); hydrateImages(); }
    });
  });
  hydrateImages();
}

document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.getElementById('loginScreen') && document.getElementById('loginScreen').style.display !== 'none') loginWithEmail();
});
initAuth();
